<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; --ver: #1B8A4A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; font-weight: 900; }
        
        body { background: var(--blu); color: white; height: 100vh; width: 100vw; overflow: hidden; }

        /* SCHERMATA INIZIALE PERFETTAMENTE CENTRATA */
        .page-init { 
            position: fixed; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
            z-index: 2000; background: var(--blu); text-align: center;
        }
        .page-init.show { display: flex; }

        /* HEADER FISSO BLU */
        .header-main { 
            position: fixed; top: 0; left: 0; right: 0; height: 75px;
            background: var(--blu); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000;
        }
        #main-total { color: var(--giallo); font-size: 2.2rem; text-shadow: 0 0 10px rgba(255,239,0,0.5); }
        .order-tag { background: var(--ora); color: white; padding: 5px 12px; border-radius: 8px; font-size: 1.2rem; }

        /* BARRA NAVIGAZIONE TASTI */
        .nav-bar { 
            position: fixed; top: 75px; left: 0; right: 0; height: 65px;
            background: #f4f7f9; display: flex; padding: 8px; gap: 8px; 
            border-bottom: 2px solid var(--bor); z-index: 999;
        }
        .nav-btn { 
            flex: 1; border: none; border-radius: 10px; background: #D0DCE8; 
            color: var(--blu); font-size: 0.8rem; cursor: pointer; text-transform: uppercase; 
        }
        .nav-btn.active { background: var(--ora); color: white; }

        /* AREA CONTENUTO PULITA */
        .content-area { 
            position: absolute; top: 140px; bottom: 0; left: 0; right: 0;
            overflow-y: auto; background: #f4f7f9; color: var(--blu); padding: 20px;
        }
        .tab-content { display: none; width: 100%; }
        .tab-content.show { display: block; }

        /* STILI INPUT */
        .label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .input-big { 
            width: 100%; padding: 15px; border: 2px solid var(--bor); border-radius: 12px; 
            font-size: 1.2rem; margin-bottom: 15px; outline: none; text-transform: uppercase; 
            color: var(--blu); background: white; font-weight: 900;
        }

        /* QUADERNO PIZZE FISSO E CHIARO */
        .comanda-paper { 
            background: #FFF9E5; border: 2px solid var(--blu); border-radius: 12px; 
            display: grid; grid-template-columns: 60px 1fr 110px; overflow: hidden; 
            width: 100%;
        }
        .col-qty, .col-gusto { border-right: 1px solid #F0E6BC; display: flex; flex-direction: column; }
        .col-prezzo { background: white; border-left: 3px solid var(--blu); display: flex; flex-direction: column; }
        .line-input { 
            height: 48px; border: none; border-bottom: 1px solid #F0E6BC; 
            background: transparent; font-size: 1.2rem; text-transform: uppercase; 
            padding: 5px 10px; outline: none; color: var(--blu); font-weight: 900; 
        }
        .col-prezzo .line-input { text-align: right; padding-right: 10px; font-size: 1.3rem; }

        .is-gf { color: #00E676 !important; }
        .col-prezzo .line-input.is-gf { background: #e8fff5; color: #00E676 !important; }

        /* PIN PAD CENTRATO */
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { 
            width: 75px; height: 75px; background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; cursor: pointer; color: white;
        }
    </style>
</head>
<body>

    <div id="page-start" class="page-init show">
        <h1 style="font-size:3.5rem; margin-bottom:40px;">SAVERIO DELIVERY</h1>
        <button class="btn-main" onclick="showPin()">ADMIN LOGIN</button>
    </div>

    <div id="page-pin" class="page-init">
        <h2 style="margin-bottom:20px;">INSERISCI PIN</h2>
        <div id="pin-dots" style="display:flex; gap:15px; margin-bottom:30px;">
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-0"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-1"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-2"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
    </div>

    <div id="app-admin" style="display:none;">
        <div class="header-main">
            <span style="font-size:0.9rem;">SAVERIO DELIVERY</span>
            <div id="main-total">0,00 €</div>
            <div class="order-tag">#01</div>
        </div>
        
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-t1" onclick="showTab(1)">CLIENTE</button>
            <button class="nav-btn" id="btn-t2" onclick="showTab(2)">PIZZE</button>
            <button class="nav-btn" id="btn-t3" onclick="showTab(3)">POLLO/ALTRO</button>
            <button class="nav-btn" id="btn-t4" onclick="showTab(4)">RIEPILOGO</button>
        </div>

        <div class="content-area">
            <div id="tab1" class="tab-content show">
                <span class="label">COGNOME *</span>
                <input type="text" id="o-cognome" class="input-big" oninput="validate()">
                
                <span class="label">CELLULARE *</span>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;">
                    <button style="background:var(--rosso); color:white; border:none; width:60px; border-radius:12px; font-size:1.5rem;" onclick="skipTel()">X</button>
                </div>

                <span class="label">INDIRIZZO *</span>
                <input type="text" id="o-indirizzo" class="input-big" oninput="validate()">
                <button style="width:100%; padding:18px; background:#4285F4; color:white; border:none; border-radius:12px; margin-bottom:15px;" onclick="verifyMaps()">📍 VERIFICA POSIZIONE</button>
                
                <span class="label">COSTO CONSEGNA *</span>
                <div style="display:grid; grid-template-columns: repeat(5,1fr); gap:8px; margin-bottom:15px;">
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost1" onclick="setCost(1)">1€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost2" onclick="setCost(2)">2€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost3" onclick="setCost(3)">3€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost4" onclick="setCost(4)">4€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost5" onclick="setCost(5)">5€</button>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><span class="label">SCALA</span><input type="text" id="o-scala" class="input-big"></div>
                    <div><span class="label">PIANO</span><input type="text" id="o-piano" class="input-big"></div>
                </div>

                <span class="label">ORARIO *</span>
                <select id="o-orario" class="input-big" onchange="validate()"><option value="">-- : --</option></select>
            </div>

            <div id="tab2" class="tab-content">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2 style="color:var(--blu);">PIZZE</h2>
                    <button style="background:var(--neon); color:var(--blu); border:none; padding:12px 20px; border-radius:10px;" onclick="insertGF()">+ GLUTEN FREE</button>
                </div>
                <div class="comanda-paper" id="comanda-root">
                    <div class="col-qty" id="cq"></div>
                    <div class="col-gusto" id="cg"></div>
                    <div class="col-prezzo" id="cp"></div>
                </div>
                <div style="text-align:right; font-weight:900; font-size:1.6rem; margin-top:15px;">
                    TOT. PIZZE ➔ <span id="tot-pizze-val">0,00 €</span>
                </div>
            </div>

            <div id="tab3" class="tab-content"><h2>CUCINA / ALTRO</h2></div>
            <div id="tab4" class="tab-content">
                <h2>RIEPILOGO</h2>
                <button id="btn-invia" style="width:100%; height:80px; background:#ccc; border:none; border-radius:15px; color:white; margin-top:20px;" disabled>INVIA ORDINE</button>
            </div>
        </div>
    </div>

    <script>
        const PIN = "0508"; let currentPin = ""; let selectedCost = 0;

        // PIN PAD
        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++){
            let b = document.createElement('div'); b.className='num-key'; b.innerText=i;
            b.onclick=()=>pressPin(i); pad.appendChild(b);
        }
        let zero = document.createElement('div'); zero.className='num-key'; zero.innerText="0";
        zero.style.gridColumnStart = "2"; zero.onclick=()=>pressPin(0); pad.appendChild(zero);

        function showPin(){ document.getElementById('page-start').classList.remove('show'); document.getElementById('page-pin').classList.add('show'); }
        function pressPin(n){
            if(currentPin.length < 4) {
                currentPin += n;
                document.getElementById('dot-'+(currentPin.length-1)).style.background = "var(--ora)";
                if(currentPin === PIN) {
                    document.getElementById('page-pin').classList.remove('show');
                    document.getElementById('app-admin').style.display='block';
                    initApp();
                } else if(currentPin.length === 4) { alert("PIN ERRATO!"); resetPin(); }
            }
        }
        function resetPin(){ currentPin = ""; for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background="none"; }

        function showTab(n){
            document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show'));
            document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('tab'+n).classList.add('show');
            document.getElementById('btn-t'+n).classList.add('active');
        }

        function initApp(){
            const cq=document.getElementById('cq'), cg=document.getElementById('cg'), cp=document.getElementById('cp');
            if(cq.children.length > 0) return;
            for(let i=0; i<18; i++){
                let q=document.createElement('input'); q.className='line-input'; q.type='number'; q.id=`q-${i}`;
                q.onkeydown=(e)=>{if(e.key===' '){e.preventDefault(); document.getElementById(`g-${i}`).focus();}};
                let g=document.createElement('input'); g.className='line-input'; g.id=`g-${i}`;
                g.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault(); if(i<17) document.getElementById(`q-${i+1}`).focus();}};
                let p=document.createElement('input'); p.className='line-input'; p.type='number'; p.id=`p-${i}`;
                p.oninput=updateTotals;
                p.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault(); if(i<17) document.getElementById(`p-${i+1}`).focus();}};
                cq.appendChild(q); cg.appendChild(g); cp.appendChild(p);
            }
            let sel=document.getElementById('o-orario');
            sel.onmousedown=()=>{ if(sel.options.length<=1){
                let now=new Date(); let m = Math.ceil((now.getHours()*60+now.getMinutes()+15)/15)*15;
                for(let t=Math.max(m,1080); t<=1320; t+=15){
                    let time=`${Math.floor(t/60)}:${t%60===0?'00':t%60}`;
                    let opt=document.createElement('option'); opt.value=time; opt.innerText=time; sel.appendChild(opt);
                }
            }};
        }

        function setCost(v){
            selectedCost = v;
            document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white');
            document.getElementById('cost'+v).style.background='var(--ora)';
            document.getElementById('cost'+v).style.color='white';
            updateTotals();
        }

        function skipTel(){ document.getElementById('o-tel').value="INTERNO"; validate(); }

        function insertGF(){
            let a=document.activeElement;
            if(a.id && a.id.startsWith('g-')){
                let idx = a.id.split('-')[1];
                if(!a.value.includes("[GF]")) a.value += " [GF]";
                a.classList.add('is-gf');
                document.getElementById('p-'+idx).classList.add('is-gf');
            }
        }

        function updateTotals(){
            let pTot=0; for(let i=0; i<18; i++) pTot+=parseFloat(document.getElementById(`p-${i}`).value)||0;
            document.getElementById('tot-pizze-val').innerText = pTot.toFixed(2).replace('.',',') + " €";
            let total = pTot + selectedCost;
            document.getElementById('main-total').innerText = total.toFixed(2).replace('.',',') + " €";
            validate();
        }

        function validate(){
            let ok = document.getElementById('o-cognome').value && document.getElementById('o-tel').value && 
                     document.getElementById('o-indirizzo').value && document.getElementById('o-orario').value && selectedCost > 0;
            let btn = document.getElementById('btn-invia');
            if(ok){ btn.style.background='var(--ver)'; btn.disabled=false; }
            else { btn.style.background='#ccc'; btn.disabled=true; }
        }

        function verifyMaps(){
            let a=document.getElementById('o-indirizzo').value; if(!a) return alert("INSERISCI L'INDIRIZZO!");
            window.open(`comgooglemaps://?q=${encodeURIComponent(a)}`);
        }
    </script>
</body>
</html>
