<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SAVERIO DELIVERY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Barlow',sans-serif;background:#fff;color:#1A3A5C;font-weight:700;-webkit-text-size-adjust:100%}
button{font-family:'Barlow',sans-serif;font-weight:800;cursor:pointer;-webkit-appearance:none;border:none}
input,select,textarea{font-family:'Barlow',sans-serif;font-weight:700;-webkit-appearance:none}
.page{padding:16px;max-width:680px;margin:0 auto;padding-bottom:60px}
.card{background:#fff;border:2px solid #EBF3FA;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(43,95,142,.06)}
.inp{width:100%;padding:11px 13px;border-radius:10px;border:2px solid #EBF3FA;font-size:15px;color:#1A3A5C;outline:none;background:#fff}
.inp:focus{border-color:#2B5F8E}
.lbl{font-size:11px;font-weight:900;color:#B0BEC5;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;display:block}
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;display:inline-flex;align-items:center;gap:6px;font-family:'Barlow',sans-serif;font-weight:800}
.bsm{padding:7px 12px;font-size:12px;border-radius:8px}
.bfull{width:100%;justify-content:center;font-size:16px;padding:14px}
.stit{font-size:11px;font-weight:900;color:#B0BEC5;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;margin-top:16px}
.divl{height:1px;background:#EBF3FA;margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.ovl{position:fixed;inset:0;background:rgba(26,58,92,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-weight:800;font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2);white-space:nowrap;color:#fff}
.hdr{background:#fff;border-bottom:3px solid #2B5F8E;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(43,95,142,.1)}
.nav{display:flex;gap:4px;background:#F4F6F8;padding:10px 12px;overflow-x:auto;border-bottom:2px solid #EBF3FA;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nb{padding:8px 14px;border-radius:10px;border:none;font-size:13px;white-space:nowrap;font-weight:800;font-family:'Barlow',sans-serif}
.nb.act{background:#2B5F8E;color:#fff}
.nb:not(.act){background:#fff;color:#1A3A5C}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto}
.pbtn{aspect-ratio:1;border-radius:14px;border:2px solid #EBF3FA;background:#fff;font-size:22px;font-weight:900;color:#1A3A5C;font-family:'Barlow',sans-serif}
.pdots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid #2B5F8E;transition:background .15s}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spin{display:inline-block;width:28px;height:28px;border:3px solid #EBF3FA;border-top-color:#2B5F8E;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px">
  <div class="spin"></div>
  <div style="font-weight:900;color:#1A3A5C;font-size:15px">Caricamento...</div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════
// COLORI
// ═══════════════════════════════════════════════════════════════════
var BL='#2B5F8E',BD='#1A3A5C',LL='#EBF3FA',OR='#E8600A',OL='#FFF0E6';
var GR='#1B8A4A',GL='#E6F6ED',RE='#C0392B',RL='#FDEDEC';
var YE='#D4A017',YL='#FEF9E7',GY='#F4F6F8',GM='#B0BEC5';
var STATI={
  nuovo:{label:'Nuovo',emoji:'🆕',bg:LL,text:BL,border:BL},
  cucina:{label:'In Cucina',emoji:'👨‍🍳',bg:YL,text:YE,border:YE},
  pronto:{label:'Pronto',emoji:'✅',bg:GL,text:GR,border:GR},
  consegna:{label:'In Consegna',emoji:'🛵',bg:OL,text:OR,border:OR},
  pagato:{label:'Pagato',emoji:'💰',bg:GL,text:GR,border:GR},
  nonpagato:{label:'Non Pagato',emoji:'❌',bg:RL,text:RE,border:RE}
};

// ═══════════════════════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════════════════════
firebase.initializeApp({
apiKey:“AIzaSyAo035WkqlCOjkS8FeZSIQ-ZNIG5olL_Nw”,
authDomain:“saverio-delivery.firebaseapp.com”,
databaseURL:“https://saverio-delivery-default-rtdb.europe-west1.firebasedatabase.app”,
projectId:“saverio-delivery”,
storageBucket:“saverio-delivery.firebasestorage.app”,
messagingSenderId:“913928598350”,
appId:“1:913928598350:web:98489624879baabe27241f”
});
var db=firebase.database();
function fset(p,v){return db.ref(p).set(v)}
function fupd(p,v){return db.ref(p).update(v)}
function frem(p){return db.ref(p).remove()}
function fget(p){return db.ref(p).get()}

// ═══════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function nowISO(){return new Date().toISOString()}
function fmt(iso){return iso?new Date(iso).toLocaleTimeString(‘it-IT’,{hour:‘2-digit’,minute:‘2-digit’}):’’}
function oggiStr(){return new Date().toDateString()}
function oggiKey(){var d=new Date();return d.getFullYear()+’-’+(d.getMonth()+1)+’-’+d.getDate()}
function esc(s){return String(s||’’).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’).replace(/”/g,’"’)}
function el(id){return document.getElementById(id)}
function on(id,ev,fn){var e=el(id);if(e)e.addEventListener(ev,fn)}
function each(sel,fn){document.querySelectorAll(sel).forEach(fn)}

// ═══════════════════════════════════════════════════════════════════
// STATO
// ═══════════════════════════════════════════════════════════════════
var DB={utenti:{},ordini:{},clienti:{},zone:{},presenti:{}};
var READY=false;
var USER=null,SC=‘dashboard’,MODAL=null;
var TOAST=null,TTIMER=null;
var LFASE=‘ruoli’,LSEL=null,LPIN=’’,LERR=false;
var FILTRO=‘tutti’,DSEL={};
var FORM=null,RCLI=’’,RCLIP=’’;

function initForm(){
return{clienteId:’’,nomeM:’’,telM:’’,indirM:’’,zonaId:’’,note:’’,fonte:‘telefono’,
prodotti:[{id:uid(),nome:’’,qty:1,prezzo:’’}]};
}

function ordOggi(){
return Object.values(DB.ordini).filter(function(o){
return new Date(o.data).toDateString()===oggiStr();
});
}
function getPresenti(){return DB.presenti[oggiKey()]||{}}
function getRiders(){return Object.values(DB.utenti).filter(function(u){return u.ruolo===‘rider’&&u.attivo!==false})}
function getRidersPresenti(){var pr=getPresenti();return getRiders().filter(function(r){return pr[r.id]})}

// ═══════════════════════════════════════════════════════════════════
// FIREBASE LISTENERS
// ═══════════════════════════════════════════════════════════════════
function startListeners(){
// Timeout di sicurezza: se dopo 5 secondi non arriva nulla, mostra login con dati vuoti
var timeout=setTimeout(function(){
if(!READY){READY=true;R();}
},5000);

// Utenti: appena arrivano, mostra il login
db.ref(‘utenti’).on(‘value’,function(s){
DB.utenti=s.val()||{};
if(!READY){
READY=true;
clearTimeout(timeout);
// Se non ci sono utenti, crea i default
if(Object.keys(DB.utenti).length===0){
fset(‘utenti’,{
admin:{id:‘admin’,nome:‘Saverio’,cognome:’’,ruolo:‘admin’,pin:‘1234’,softpos:false,attivo:true},
dispatch:{id:‘dispatch’,nome:‘Dispatch’,cognome:’’,ruolo:‘dispatch’,pin:‘0000’,softpos:false,attivo:true}
});
}
}
R();
});

db.ref(‘ordini’).on(‘value’,function(s){DB.ordini=s.val()||{};if(READY)R()});
db.ref(‘clienti’).on(‘value’,function(s){DB.clienti=s.val()||{};if(READY)R()});
db.ref(‘zone’).on(‘value’,function(s){
DB.zone=s.val()||{};
if(READY&&Object.keys(DB.zone).length===0){
fset(‘zone’,{
z1:{id:‘z1’,nome:‘Centro / Zona Rossa’,costo:1,orariLiberi:true,orari:’’},
z2:{id:‘z2’,nome:‘Altarello / Zisa / Bonagia’,costo:2,orariLiberi:false,orari:‘18:30-19:00, 21:15-21:45’},
z3:{id:‘z3’,nome:‘Ficarazzi / Villabate / Cannita’,costo:3,orariLiberi:false,orari:‘18:30-19:00, 21:15-21:45’}
});
}
if(READY)R();
});
db.ref(‘presenti’).on(‘value’,function(s){DB.presenti=s.val()||{};if(READY)R()});
}

// ═══════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════
function toast(msg,tipo){
if(TTIMER)clearTimeout(TTIMER);
TOAST={msg:msg,tipo:tipo||‘ok’};
TTIMER=setTimeout(function(){TOAST=null;R()},2800);
R();
}

// ═══════════════════════════════════════════════════════════════════
// RENDER PRINCIPALE
// ═══════════════════════════════════════════════════════════════════
function R(){
var app=el(‘app’);
if(!app)return;
if(!READY){
app.innerHTML=’<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px"><div class="spin"></div><div style="font-weight:900;color:'+BD+';font-size:15px">Caricamento…</div></div>’;
return;
}
if(!USER){app.innerHTML=rLogin();bLogin();return;}
app.innerHTML=rShell();bShell();
}

// ═══════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════
function rLogin(){
var utenti=Object.values(DB.utenti);
var rds=utenti.filter(function(u){return u.ruolo===‘rider’&&u.attivo!==false});
var body=’’;

if(LFASE===‘ruoli’){
var adm=utenti.filter(function(u){return u.ruolo===‘admin’});
var dis=utenti.filter(function(u){return u.ruolo===‘dispatch’});
body=
adm.map(function(u){
return ‘<button class="lrb" data-id="'+esc(u.id)+'" style="width:100%;margin-bottom:12px;padding:20px;border-radius:16px;background:'+BD+';display:flex;align-items:center;gap:16px">’+
‘<span style="font-size:30px">🔑</span><span style="font-size:24px;font-weight:900;color:#fff;letter-spacing:2px">ADMIN</span></button>’;
}).join(’’)+
dis.map(function(u){
return ‘<button class="lrb" data-id="'+esc(u.id)+'" style="width:100%;margin-bottom:12px;padding:20px;border-radius:16px;background:'+BL+';display:flex;align-items:center;gap:16px">’+
‘<span style="font-size:30px">📦</span><span style="font-size:24px;font-weight:900;color:#fff;letter-spacing:2px">DISPATCH</span></button>’;
}).join(’’)+
(rds.length>0?
‘<button id="b-riders" style="width:100%;padding:20px;border-radius:16px;background:'+OR+';display:flex;align-items:center;gap:16px">’+
‘<span style="font-size:30px">🛵</span><span style="font-size:24px;font-weight:900;color:#fff;letter-spacing:2px">RIDERS</span></button>’:’’);

} else if(LFASE===‘listaRider’){
body=’<p style="font-size:13px;font-weight:800;color:'+GM+';text-align:center;margin-bottom:20px;letter-spacing:1px">QUAL È IL TUO NOME?</p>’+
rds.map(function(u){
return ‘<button class="lrb" data-id="'+esc(u.id)+'" style="width:100%;margin-bottom:10px;padding:16px 20px;border-radius:14px;border:2px solid '+OR+';background:#fff;display:flex;align-items:center;gap:14px">’+
‘<div style="width:44px;height:44px;border-radius:12px;background:'+OR+';display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🛵</div>’+
‘<span style="font-size:18px;font-weight:900;color:'+BD+'">’+esc(u.nome)+’ ‘+esc(u.cognome||’’)+’</span></button>’;
}).join(’’)+
‘<button id="b-back" class="btn bfull" style="background:'+GY+';color:'+BD+';margin-top:8px">← Indietro</button>’;

} else if(LFASE===‘pin’){
var dots=[0,1,2,3].map(function(i){
return ‘<div class="pdot" style="background:'+(LPIN.length>i?BL:LL)+'"></div>’;
}).join(’’);
body=’<p style="font-size:18px;font-weight:900;color:'+BD+';margin-bottom:4px;text-align:center">Ciao, ‘+esc(LSEL.nome)+’!</p>’+
‘<p style="font-size:13px;font-weight:700;color:'+GM+';margin-bottom:8px;text-align:center">Inserisci il tuo PIN</p>’+
‘<div class="pdots">’+dots+’</div>’+
(LERR?’<p style="color:'+RE+';font-weight:800;font-size:13px;margin-bottom:8px;text-align:center">PIN errato, riprova</p>’:’’)+
‘<div class="pgrid">’+
[‘1’,‘2’,‘3’,‘4’,‘5’,‘6’,‘7’,‘8’,‘9’,’’,‘0’,‘⌫’].map(function(d){
return ‘<button class="pbtn" data-d="'+d+'" style="'+
(d==='⌫'?'background:'+RL+';color:'+RE+';border-color:'+RL:'')+
(d===''?';visibility:hidden':'')+'">’+d+’</button>’;
}).join(’’)+’</div>’+
‘<button id="b-back" class="btn bfull" style="background:'+GY+';color:'+BD+';margin-top:16px">← Indietro</button>’;
}

return ‘<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:#fff">’+
(TOAST?’<div class="toast" style="background:'+(TOAST.tipo==='err'?RE:GR)+'">’+esc(TOAST.msg)+’</div>’:’’)+
‘<div style="text-align:center;margin-bottom:36px">’+
‘<div style="font-size:28px;font-weight:900;color:'+BD+';letter-spacing:3px">SAVERIO DELIVERY</div></div>’+
‘<div style="width:100%;max-width:360px">’+body+’</div></div>’;
}

function bLogin(){
each(’.lrb’,function(b){
b.addEventListener(‘click’,function(){
var u=DB.utenti[this.dataset.id];
if(!u)return;
LSEL=u;LFASE=‘pin’;LPIN=’’;LERR=false;R();
});
});
on(‘b-riders’,‘click’,function(){LFASE=‘listaRider’;R()});
on(‘b-back’,‘click’,function(){
LFASE=LSEL&&LSEL.ruolo===‘rider’?‘listaRider’:‘ruoli’;
LPIN=’’;LERR=false;R();
});
each(’.pbtn’,function(b){
b.addEventListener(‘click’,function(){
var d=this.dataset.d;
if(!d||d===’’)return;
if(d===‘⌫’){LPIN=LPIN.slice(0,-1);LERR=false;R();return}
LPIN+=d;
if(LPIN.length===4){
if(LSEL.pin===LPIN){
USER=LSEL;
SC=LSEL.ruolo===‘rider’?‘miei’:LSEL.ruolo===‘dispatch’?‘dispatch’:‘dashboard’;
LFASE=‘ruoli’;LPIN=’’;LERR=false;R();
} else {
LERR=true;
setTimeout(function(){LPIN=’’;LERR=false;R()},700);
R();
}
} else R();
});
});
}

// ═══════════════════════════════════════════════════════════════════
// SHELL
// ═══════════════════════════════════════════════════════════════════
function rShell(){
var isA=USER.ruolo===‘admin’,isD=USER.ruolo===‘dispatch’,isR=USER.ruolo===‘rider’;
var nav=[];
if(isA)nav.push({id:‘dashboard’,label:‘🏠 Dashboard’});
if(isA||isD)nav.push({id:‘nuovo’,label:‘➕ Ordine’},{id:‘ordini’,label:‘📋 Ordini’},{id:‘dispatch’,label:‘📦 Dispatch’});
if(isR)nav.push({id:‘miei’,label:‘🛵 Le Mie’});
if(isA)nav.push({id:‘appello’,label:‘👥 Appello’},{id:‘clienti’,label:‘👤 Clienti’},{id:‘team’,label:‘⚙️ Team’},{id:‘report’,label:‘📊 Report’});

var pg=’’;
var pgs={dashboard:rDash,nuovo:rNuovo,ordini:rOrdini,dispatch:rDispatch,miei:rMiei,appello:rAppello,clienti:rClienti,team:rTeam,report:rReport};
if(pgs[SC])pg=pgs[SC]();

return (TOAST?’<div class="toast" style="background:'+(TOAST.tipo==='err'?RE:GR)+'">’+esc(TOAST.msg)+’</div>’:’’)+
‘<header class="hdr">’+
‘<div style="font-size:17px;font-weight:900;color:'+BD+';letter-spacing:2px">SAVERIO DELIVERY</div>’+
‘<div style="display:flex;align-items:center;gap:8px">’+
‘<span style="font-size:12px;font-weight:800;color:'+GM+'">’+esc(USER.nome)+’</span>’+
‘<button id="b-out" class="btn bsm" style="background:'+RL+';color:'+RE+'">Esci</button></div></header>’+
‘<nav class="nav">’+nav.map(function(n){return ‘<button class="nb'+(SC===n.id?' act':'')+'" data-sc="'+n.id+'">’+n.label+’</button>’}).join(’’)+’</nav>’+
‘<div class="page" id="pg">’+pg+’</div>’+
(MODAL?rModal():’’);
}

function bShell(){
on(‘b-out’,‘click’,function(){USER=null;R()});
each(’.nb’,function(b){b.addEventListener(‘click’,function(){SC=this.dataset.sc;R()})});
on(‘ovl-bg’,‘click’,closeM);
bPage();bModal();
}

function goTo(s){SC=s;R()}
function closeM(){MODAL=null;R()}
function rePg(){
var p=el(‘pg’);if(!p)return;
var pgs={dashboard:rDash,nuovo:rNuovo,ordini:rOrdini,dispatch:rDispatch,miei:rMiei,appello:rAppello,clienti:rClienti,team:rTeam,report:rReport};
if(pgs[SC]){p.innerHTML=pgs[SC]();bPage();}
}

// ═══════════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════════
function rDash(){
var ord=ordOggi(),pr=getPresenti();
var cnt={};Object.keys(STATI).forEach(function(s){cnt[s]=ord.filter(function(o){return o.stato===s}).length});
var tot=ord.filter(function(o){return o.stato===‘pagato’}).reduce(function(s,o){return s+(o.totale||0)},0);
var rp=getRidersPresenti();
return ‘<div style="font-size:22px;font-weight:900;color:'+BD+';margin-bottom:4px">Dashboard</div>’+
‘<div style="font-size:13px;font-weight:700;color:'+GM+';margin-bottom:16px">’+new Date().toLocaleDateString(‘it-IT’,{weekday:‘long’,day:‘numeric’,month:‘long’})+’</div>’+
‘<div class="g3" style="margin-bottom:16px">’+
Object.entries(cnt).map(function(e){var s=e[0],n=e[1];
return ‘<div style="background:'+STATI[s].bg+';border:2px solid '+STATI[s].border+';border-radius:12px;padding:12px 8px;text-align:center">’+
‘<div style="font-size:20px">’+STATI[s].emoji+’</div>’+
‘<div style="font-size:26px;font-weight:900;color:'+STATI[s].text+'">’+n+’</div>’+
‘<div style="font-size:9px;font-weight:800;color:'+STATI[s].text+';text-transform:uppercase">’+STATI[s].label+’</div></div>’;
}).join(’’)+’</div>’+
‘<div style="background:'+GL+';border:2px solid '+GR+';border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">’+
‘<span style="font-weight:800;color:'+GR+'">💰 Totale Incassato</span>’+
‘<span style="font-size:24px;font-weight:900;color:'+GR+'">€’+tot.toFixed(2)+’</span></div>’+
(cnt.nonpagato>0?’<div style="background:'+RL+';border:2px solid '+RE+';border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:900;color:'+RE+'">⚠️ ‘+cnt.nonpagato+’ consegne NON PAGATE</div>’:’’)+
(cnt.pronto>0?’<div style="background:'+YL+';border:2px solid '+YE+';border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:900;color:'+YE+'">📦 ‘+cnt.pronto+’ ordini pronti</div>’:’’)+
‘<div class="stit">Riders presenti (’+rp.length+’)</div>’+
rp.map(function(r){
var sue=ord.filter(function(o){return o.fattorinoId===r.id&&o.stato===‘consegna’});
return ‘<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">’+
‘<div style="font-weight:900">🛵 ‘+esc(r.nome)+’ ‘+esc(r.cognome||’’)+(r.softpos?’ <span style="font-size:11px;background:'+LL+';color:'+BL+';border-radius:6px;padding:2px 6px">SoftPOS</span>’:’’)+’</div>’+
‘<div style="font-weight:900;color:'+OR+'">’+sue.length+’ in giro</div></div>’+

// ═══════════════════════════════════════════════════════════════════
// REPORT
// ═══════════════════════════════════════════════════════════════════
function rReport(){
var ord=ordOggi(),rds=Object.values(DB.utenti).filter(function(u){return u.ruolo===‘rider’});
var tot=ord.filter(function(o){return o.stato===‘pagato’}).reduce(function(s,o){return s+(o.totale||0)},0);
var np=ord.filter(function(o){return o.stato===‘nonpagato’});
return ‘<div style="font-size:22px;font-weight:900;color:'+BD+';margin-bottom:16px">📊 Report Serata</div>’+
‘<div style="background:'+GL+';border:2px solid '+GR+';border-radius:14px;padding:16px;margin-bottom:16px">’+
‘<div style="font-weight:800;color:'+GR+';margin-bottom:4px">💰 Totale Incassato</div>’+
‘<div style="font-size:32px;font-weight:900;color:'+GR+'">€’+tot.toFixed(2)+’</div>’+
‘<div style="font-size:13px;color:'+GR+'">’+ord.filter(function(o){return o.stato===‘pagato’}).length+’ ordini pagati</div></div>’+
(np.length>0?’<div style="background:'+RL+';border:2px solid '+RE+';border-radius:14px;padding:14px;margin-bottom:16px">’+
‘<div style="font-weight:900;color:'+RE+';margin-bottom:8px">❌ Non Pagati (’+np.length+’)</div>’+
np.map(function(o){return ‘<div style="display:flex;justify-content:space-between;padding:6px 0"><span>’+esc(o.nomeCliente)+’</span><strong style="color:'+RE+'">€’+(o.totale||0).toFixed(2)+’</strong></div>’}).join(’’)+’</div>’:’’)+
‘<div class="stit">Per rider</div>’+
rds.map(function(r){
var suoi=ord.filter(function(o){return o.fattorinoId===r.id});
var pag=suoi.filter(function(o){return o.stato===‘pagato’});
var npp=suoi.filter(function(o){return o.stato===‘nonpagato’});
var cont=pag.filter(function(o){return o.metodoPagamento===‘Contanti’}).reduce(function(s,o){return s+(o.totale||0)},0);
var cart=pag.filter(function(o){return o.metodoPagamento===‘Carta’}).reduce(function(s,o){return s+(o.totale||0)},0);
var totR=pag.reduce(function(s,o){return s+(o.totale||0)},0);
return ‘<div class="card" style="border:2px solid '+BL+'">’+
‘<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">’+
‘<div style="font-weight:900;font-size:16px">🛵 ‘+esc(r.nome)+’ ‘+esc(r.cognome||’’)+’</div>’+
‘<div style="font-size:22px;font-weight:900;color:'+BL+'">€’+totR.toFixed(2)+’</div></div>’+
‘<div class="divl"></div>’+
‘<div class="g2" style="font-size:13px">’+
‘<div>✅ Pagate: <strong>’+pag.length+’</strong></div>’+
‘<div>❌ Non pagate: <strong style="color:'+RE+'">’+npp.length+’</strong></div>’+
‘<div>📦 Totali: <strong>’+suoi.length+’</strong></div>’+
(cont>0?’<div>💵 Contanti: <strong>€’+cont.toFixed(2)+’</strong></div>’:’’)+
(cart>0?’<div>💳 Carta: <strong>€’+cart.toFixed(2)+’</strong></div>’:’’)+’</div>’+
(npp.length>0?’<div style="margin-top:8px;padding:8px;background:'+RL+';border-radius:8px">’+npp.map(function(o){return ‘<div style="font-size:12px;color:'+RE+'">• ‘+esc(o.nomeCliente)+’ — €’+(o.totale||0).toFixed(2)+’</div>’}).join(’’)+’</div>’:’’)+
‘</div>’;
}).join(’’);
}

// MODAL
// ═══════════════════════════════════════════════════════════════════
function rModal(){
var m=MODAL,body=’’;
if(m.tipo===‘pagamento’){
body=’<div style="font-size:18px;font-weight:900;color:'+BD+';margin-bottom:4px">💰 Come ha pagato?</div>’+
‘<div style="font-weight:700;color:'+GM+';margin-bottom:16px">’+esc(m.data.nomeCliente)+’ — €’+(m.data.totale||0).toFixed(2)+’</div>’+
‘<button class="btn bfull" id="m-cont" style="background:'+GR+';color:#fff;margin-bottom:10px">💵 Contanti</button>’+
(USER.softpos?’<button class="btn bfull" id="m-carta" style="background:'+BL+';color:#fff;margin-bottom:10px">💳 Carta (SoftPOS)</button>’:’’)+
‘<button class="btn bfull" id="m-cls" style="background:'+GY+';color:'+BD+'">Annulla</button>’;

var rp=getRidersPresenti().filter(function(r){return r.id!==m.data.fattorinoId});
body=’<div style="font-size:18px;font-weight:900;color:'+BD+';margin-bottom:16px">🔄 Riassegna Consegna</div>’+
rp.map(function(r){
return ‘<button class="btn card rab" data-rid="'+r.id+'" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:8px;border:2px solid '+OR+'">’+
‘<div style="width:40px;height:40px;border-radius:10px;background:'+OR+';display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🛵</div>’+
‘<div style="font-weight:900">’+esc(r.nome)+’ ‘+esc(r.cognome||’’)+(r.softpos?’ 💳’:’’)+’</div></button>’;

(rp.length===0?’<div style="color:'+GM+';font-weight:700;margin-bottom:16px">Nessun altro rider presente</div>’:’’)+

} else if(m.tipo===‘nuovoCliente’||m.tipo===‘editCliente’){
var c=m.data||{};
body=’<div style="font-size:18px;font-weight:900;color:'+BD+';margin-bottom:16px">’+(m.tipo===‘editCliente’?‘Modifica’:‘Nuovo’)+’ Cliente</div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Cognome *</label><input class="inp" id="mc-cog" value="'+esc(c.cognome||'')+'"/></div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Nome</label><input class="inp" id="mc-nom" value="'+esc(c.nome||'')+'"/></div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Telefono</label><input class="inp" id="mc-tel" value="'+esc(c.telefono||'')+'"/></div>’+
‘<div style="margin-bottom:16px"><label class="lbl">Indirizzo</label><input class="inp" id="mc-ind" value="'+esc(c.indirizzo||'')+'"/></div>’+
‘<div style="display:flex;gap:10px">’+
‘<button class="btn" id="m-savcl" style="flex:1;justify-content:center;background:'+BL+';color:#fff">Salva</button>’+
‘<button class="btn" id="m-cls" style="flex:1;justify-content:center;background:'+GY+';color:'+BD+'">Annulla</button></div>’;
} else if(m.tipo===‘nuovoMembro’||m.tipo===‘editMembro’){
var u=m.data||{};
body=’<div style="font-size:18px;font-weight:900;color:'+BD+';margin-bottom:16px">’+(m.tipo===‘editMembro’?‘Modifica’:‘Nuovo’)+’ membro</div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Nome *</label><input class="inp" id="mm-nom" value="'+esc(u.nome||'')+'"/></div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Cognome</label><input class="inp" id="mm-cog" value="'+esc(u.cognome||'')+'"/></div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Telefono</label><input class="inp" id="mm-tel" value="'+esc(u.telefono||'')+'"/></div>’+
‘<div style="margin-bottom:10px"><label class="lbl">Ruolo</label>’+
‘<select class="inp" id="mm-ruo">’+
‘<option value=“rider” ‘+((u.ruolo||‘rider’)===‘rider’?‘selected’:’’)+’>🛵 Rider</option>’+
‘<option value=“dispatch” ‘+(u.ruolo===‘dispatch’?‘selected’:’’)+’>📦 Dispatch</option>’+
‘<option value=“admin” ‘+(u.ruolo===‘admin’?‘selected’:’’)+’>🔑 Admin</option>’+
‘</select></div>’+
‘<div style="margin-bottom:10px"><label class="lbl">PIN (4 cifre) *</label><input class="inp" id="mm-pin" type="number" value="'+esc(u.pin||'')+'" placeholder="0000"/></div>’+
‘<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">’+
‘<input type=“checkbox” id=“mm-sp” ‘+(u.softpos?‘checked’:’’)+’/><label for="mm-sp" style="font-weight:800;cursor:pointer">💳 Accetta SoftPOS</label></div>’+
‘<div style="display:flex;gap:10px">’+
‘<button class="btn" id="m-savmb" style="flex:1;justify-content:center;background:'+BL+';color:#fff">Salva</button>’+
‘<button class="btn" id="m-cls" style="flex:1;justify-content:center;background:'+GY+';color:'+BD+'">Annulla</button></div>’;
}
return ‘<div class="ovl" id="ovl-bg"><div class="mdl" onclick="event.stopPropagation()">’+body+’</div></div>’;
}

// ═══════════════════════════════════════════════════════════════════
// BIND PAGE
// ═══════════════════════════════════════════════════════════════════
function bPage(){
each(’[data-sc]’,function(b){b.addEventListener(‘click’,function(){SC=this.dataset.sc;R()})});

if(SC===‘nuovo’){
if(!FORM)FORM=initForm();
var f=FORM;
each(’.fb’,function(b){b.addEventListener(‘click’,function(){f.fonte=this.dataset.f;rePg()})});
on(‘b-rmcl’,‘click’,function(){f.clienteId=’’;RCLI=’’;rePg()});
on(‘f-rcl’,‘input’,function(){
RCLI=this.value;
var q=this.value.toLowerCase(),div=el(‘res-cl’);
if(div&&q.length>0){
var res=Object.values(DB.clienti).filter(function(c){return (c.cognome+’ ‘+c.nome+’ ‘+c.telefono).toLowerCase().includes(q)}).slice(0,6);
div.innerHTML=’<div style="border:2px solid '+LL+';border-radius:10px;margin-bottom:8px;max-height:180px;overflow-y:auto">’+
res.map(function(c){return ‘<div class="sccl" data-id="'+c.id+'" style="padding:10px 12px;border-bottom:1px solid '+LL+';cursor:pointer"><div style="font-weight:900">’+esc(c.cognome)+’ ‘+esc(c.nome)+’</div><div style="font-size:12px;color:'+GM+'">’+esc(c.telefono||’’)+’ · ‘+esc(c.indirizzo||’’)+’</div></div>’}).join(’’)+
(res.length===0?’<div style="padding:12px;color:'+GM+'">Nessun cliente trovato</div>’:’’)+’</div>’;
each(’.sccl’,function(e){e.addEventListener(‘click’,function(){f.clienteId=this.dataset.id;RCLI=’’;rePg()})});
} else if(div)div.innerHTML=’’;
});
on(‘f-nomM’,‘input’,function(){f.nomeM=this.value});
on(‘f-telM’,‘input’,function(){f.telM=this.value});
on(‘f-indM’,‘input’,function(){f.indirM=this.value});
on(‘f-note’,‘input’,function(){f.note=this.value});
on(‘sel-zona’,‘change’,function(){f.zonaId=this.value;rePg()});
each(’.pn’,function(i){i.addEventListener(‘input’,function(){var p=f.prodotti.find(function(x){return x.id===i.dataset.pid});if(p)p.nome=this.value})});
each(’.pq’,function(i){i.addEventListener(‘input’,function(){var p=f.prodotti.find(function(x){return x.id===i.dataset.pid});if(p){p.qty=this.value;rePg()}})});
each(’.pp’,function(i){i.addEventListener(‘input’,function(){var p=f.prodotti.find(function(x){return x.id===i.dataset.pid});if(p){p.prezzo=this.value;rePg()}})});
each(’.pr’,function(b){b.addEventListener(‘click’,function(){f.prodotti=f.prodotti.filter(function(p){return p.id!==b.dataset.pid});rePg()})});
on(‘b-addp’,‘click’,function(){f.prodotti.push({id:uid(),nome:’’,qty:1,prezzo:’’});rePg()});
on(‘b-ncl’,‘click’,function(){MODAL={tipo:‘nuovoCliente’,data:null};R()});
on(‘b-conf’,‘click’,function(){
var cl=f.clienteId?DB.clienti[f.clienteId]:null;
if(!cl&&!f.nomeM)return toast(‘Scegli o inserisci un cliente’,‘err’);
if(f.prodotti.some(function(p){return !p.nome}))return toast(‘Inserisci nome ad ogni prodotto’,‘err’);
var zona=Object.values(DB.zone).find(function(z){return z.id===f.zonaId});
var tp=f.prodotti.reduce(function(s,p){return s+(parseFloat(p.prezzo)||0)*(parseInt(p.qty)||1)},0);
var ordine={id:uid(),data:nowISO(),stato:‘nuovo’,clienteId:f.clienteId||’’,
nomeCliente:cl?(cl.cognome+’ ‘+cl.nome).trim():f.nomeM,
telefono:cl?cl.telefono||’’:f.telM,indirizzo:cl?cl.indirizzo||’’:f.indirM,
zona:zona?zona.nome:’’,zonaId:f.zonaId||’’,costoConsegna:zona?zona.costo:0,
note:f.note,fonte:f.fonte,prodotti:f.prodotti,totale:tp+(zona?zona.costo:0),
fattorinoId:null,pagato:false,metodoPagamento:null};
fset(‘ordini/’+ordine.id,ordine).then(function(){toast(‘Ordine creato ✓’);FORM=initForm();RCLI=’’;SC=‘ordini’;R()});
});
}

if(SC===‘ordini’){
each(’.fb2’,function(b){b.addEventListener(‘click’,function(){FILTRO=this.dataset.f;rePg()})});
each(’.sb’,function(b){b.addEventListener(‘click’,function(){fupd(‘ordini/’+this.dataset.id,{stato:this.dataset.s}).then(function(){toast(‘Stato aggiornato ✓’)})})});
each(’.rbn’,function(b){b.addEventListener(‘click’,function(){var o=ordOggi().find(function(x){return x.id===b.dataset.id});MODAL={tipo:‘riassegna’,data:o};R()})});
}

if(SC===‘dispatch’){
each(’.dcard’,function(c){c.addEventListener(‘click’,function(){var id=this.dataset.id;if(DSEL[id])delete DSEL[id];else DSEL[id]=true;rePg()})});
each(’.arb’,function(b){b.addEventListener(‘click’,function(){
var rid=this.dataset.rid,ids=Object.keys(DSEL);
if(ids.length===0)return toast(‘Seleziona almeno un ordine’,‘err’);
Promise.all(ids.map(function(id){return fupd(‘ordini/’+id,{fattorinoId:rid,stato:‘consegna’,oraUscita:nowISO(),riassegnaRichiesta:false})}))
.then(function(){DSEL={};toast(ids.length+’ consegne assegnate ✓’);rePg()});
})});
each(’.rbn’,function(b){b.addEventListener(‘click’,function(){var o=ordOggi().find(function(x){return x.id===b.dataset.id});MODAL={tipo:‘riassegna’,data:o};R()})});
}

if(SC===‘miei’){
each(’.ib’,function(b){b.addEventListener(‘click’,function(){var o=ordOggi().find(function(x){return x.id===b.dataset.id});MODAL={tipo:‘pagamento’,data:o};R()})});
each(’.npb’,function(b){b.addEventListener(‘click’,function(){fupd(‘ordini/’+this.dataset.id,{stato:‘nonpagato’,oraRientro:nowISO()}).then(function(){toast(‘Segnato ✓’)})})});
each(’.pb’,function(b){b.addEventListener(‘click’,function(){fupd(‘ordini/’+this.dataset.id,{riassegnaRichiesta:true}).then(function(){toast(‘Richiesta inviata ✓’)})})});
}

if(SC===‘appello’){
each(’.tpb’,function(b){b.addEventListener(‘click’,function(){
var rid=this.dataset.rid,pr=this.dataset.pr===‘1’,key=oggiKey();
if(pr)frem(‘presenti/’+key+’/’+rid);else fset(‘presenti/’+key+’/’+rid,true);
})});
on(‘b-addr’,‘click’,function(){MODAL={tipo:‘nuovoMembro’,data:{ruolo:‘rider’}};R()});
}

if(SC===‘clienti’){
on(‘b-nc’,‘click’,function(){MODAL={tipo:‘nuovoCliente’,data:null};R()});
on(‘rcl-inp’,‘input’,function(){RCLIP=this.value;rePg()});
each(’.ecl’,function(b){b.addEventListener(‘click’,function(){MODAL={tipo:‘editCliente’,data:Object.assign({},DB.clienti[this.dataset.id])};R()})});
each(’.dcl’,function(b){b.addEventListener(‘click’,function(){frem(‘clienti/’+this.dataset.id).then(function(){toast(‘Cliente eliminato’)})})});
}

if(SC===‘team’){
on(‘b-nm’,‘click’,function(){MODAL={tipo:‘nuovoMembro’,data:null};R()});
each(’.emb’,function(b){b.addEventListener(‘click’,function(){MODAL={tipo:‘editMembro’,data:Object.assign({},DB.utenti[this.dataset.id])};R()})});
each(’.tmb’,function(b){b.addEventListener(‘click’,function(){var att=this.dataset.att===‘1’;fupd(‘utenti/’+this.dataset.id,{attivo:!att}).then(function(){toast(att?‘Disattivato’:‘Riattivato’)})})});
}
}

function bModal(){
var m=MODAL;if(!m)return;
on(‘m-cls’,‘click’,closeM);
on(‘ovl-bg’,‘click’,closeM);
on(‘m-cont’,‘click’,function(){fupd(‘ordini/’+m.data.id,{stato:‘pagato’,metodoPagamento:‘Contanti’,oraRientro:nowISO()}).then(function(){toast(‘Incasso registrato ✓’);closeM()})});
on(‘m-carta’,‘click’,function(){fupd(‘ordini/’+m.data.id,{stato:‘pagato’,metodoPagamento:‘Carta’,oraRientro:nowISO()}).then(function(){toast(‘Incasso registrato ✓’);closeM()})});
each(’.rab’,function(b){b.addEventListener(‘click’,function(){fupd(‘ordini/’+m.data.id,{fattorinoId:this.dataset.rid,riassegnaRichiesta:false,oraUscita:nowISO()}).then(function(){toast(‘Riassegnato ✓’);DSEL={};closeM()})})});
on(‘m-savcl’,‘click’,function(){
var cog=(el(‘mc-cog’)||{}).value||’’;
if(!cog.trim())return toast(‘Inserisci il cognome’,‘err’);
var data={cognome:cog.trim(),nome:(el(‘mc-nom’)||{}).value||’’,telefono:(el(‘mc-tel’)||{}).value||’’,indirizzo:(el(‘mc-ind’)||{}).value||’’};
if(m.tipo===‘editCliente’){fupd(‘clienti/’+m.data.id,data).then(function(){toast(‘Aggiornato ✓’);closeM()})}
else{var id=uid();fset(‘clienti/’+id,Object.assign({id:id},data)).then(function(){if(FORM&&SC===‘nuovo’)FORM.clienteId=id;toast(‘Salvato ✓’);closeM()})}
});
on(‘m-savmb’,‘click’,function(){
var nom=((el(‘mm-nom’)||{}).value||’’).trim();
var pin=String((el(‘mm-pin’)||{}).value||’’);
if(!nom)return toast(‘Inserisci il nome’,‘err’);
if(pin.length!==4)return toast(‘PIN deve essere 4 cifre’,‘err’);
var data={nome:nom,cognome:(el(‘mm-cog’)||{}).value||’’,telefono:(el(‘mm-tel’)||{}).value||’’,ruolo:(el(‘mm-ruo’)||{}).value||‘rider’,pin:pin,softpos:!!(el(‘mm-sp’)||{}).checked,attivo:true};
if(m.tipo===‘editMembro’){fupd(‘utenti/’+m.data.id,data).then(function(){toast(‘Aggiornato ✓’);closeM()})}
else{var id=uid();fset(‘utenti/’+id,Object.assign({id:id},data)).then(function(){toast(‘Aggiunto ✓’);closeM()})}
});
}
