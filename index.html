<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; --ver: #1B8A4A; --link: #007AFF; --bibite: #007AFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; font-weight: 900; }
        body { background: var(--blu); color: white; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
        .header-main { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--blu); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000; }
        #main-total { color: var(--giallo); font-size: 2.2rem; }
        .nav-bar { position: fixed; top: 75px; left: 0; right: 0; height: 60px; background: #f4f7f9; display: flex; padding: 5px; gap: 5px; z-index: 999; }
        .nav-btn { flex: 1; border: none; border-radius: 8px; background: #D0DCE8; color: var(--blu); font-size: 0.75rem; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { background: var(--ora); color: white; }
        .content-area { position: absolute; top: 135px; bottom: 0; left: 0; right: 0; overflow-y: auto; background: #f4f7f9; color: var(--blu); padding: 15px; }
        .tab-content { display: none; }
        .tab-content.show { display: block; }
        .input-big { width: 100%; padding: 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1.1rem; margin-bottom: 12px; outline: none; text-transform: uppercase; color: var(--blu); background: white; font-weight: 900; }
        .comanda-paper { background: #FFF9E5; border: 2px solid var(--blu); border-radius: 10px; overflow: hidden; width: 100%; display: table; border-collapse: collapse; }
        .row-piz { display: table-row; border-bottom: 1px solid #F0E6BC; }
        .cell-piz { display: table-cell; vertical-align: middle; padding: 5px; min-height: 50px; }
        .c-gf { width: 35px; text-align: center; background: #eee; }
        .c-tipo { width: 28px; text-align: center; background: #e5e5e5; border-left: 1px solid #ccc; }
        .c-qty { width: 50px; border-left: 1px solid #F0E6BC; border-right: 1px solid #F0E6BC; }
        .c-gusto { border-right: 2px solid var(--blu); }
        .c-prezzo { width: 65px; background: white; }
        .tipo-polleria { color: var(--rosso) !important; }
        .tipo-bibite { color: var(--bibite) !important; }
        .tipo-banco { color: #8B6914 !important; }
        .tipo-coscia { color: #CC5500 !important; }
        .row-is-gf { background-color: #e8fff5 !important; color: #00E676 !important; }
        .gf-text { color: var(--ver) !important; }
        .area-gusto { width: 100%; border: none; background: transparent; outline: none; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; color: inherit; resize: none; overflow: hidden; display: block; line-height: 1.2; }
        .input-piz { width: 100%; border: none; background: transparent; outline: none; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; color: inherit; text-align: center; }
        .input-prezzo { width: 100%; border: none; background: transparent; outline: none; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; color: inherit; text-align: right; }
        .rip-row-top { font-size: 1.6rem; color: var(--ora); margin-bottom: 10px; display: flex; gap: 20px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .rip-row-client { font-size: 1.3rem; color: var(--blu); margin-bottom: 15px; line-height: 1.4; }
        .pizza-item { display: flex; align-items: flex-start; margin-bottom: 6px; font-size: 1.2rem; }
        .pizza-qty { width: 40px; color: var(--blu); flex-shrink: 0; }
        .pizza-desc { flex-grow: 1; text-transform: uppercase; line-height: 1.1; }
        .pizza-price { width: 80px; text-align: right; color: #555; flex-shrink: 0; }
        .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .note-field { border-left: 5px solid var(--ora) !important; background: #fffcf0 !important; }
        .card-consegna { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 10px solid var(--blu); box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: var(--blu); transition: all 0.3s ease; }
        .card-consegna.stato-pronto { border-left-color: #D4A017; }
        .card-consegna.stato-assegnato { border-left-color: var(--ora); }
        .card-consegna.stato-consegnato { border-left-color: var(--ver); opacity: 0.55; }
        .card-consegna.selezionata { border: 3px solid var(--ora); background: #fffbf5; }
        .stato-badge { font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; margin-bottom: 6px; }
        .badge-attesa { background: #eee; color: #888; }
        .badge-pronto { background: #FFF9C4; color: #8B6914; }
        .badge-assegnato { background: #FEE5D4; color: var(--ora); }
        .badge-consegnato { background: #D4EDDA; color: var(--ver); }
        .card-header-main { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .card-num-big { font-size: 1.8rem; color: var(--blu); }
        .card-ora-big { font-size: 1.8rem; color: var(--ora); }
        .card-actions-top { display: flex; gap: 8px; align-items: center; }
        .act-btn-small { border: none; padding: 5px 10px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; color: white; }
        .btn-mod { background: var(--blu); }
        .btn-del { background: var(--rosso); }
        .card-body-main { font-size: 1.3rem; margin-bottom: 10px; line-height: 1.3; }
        .card-link-tel { color: var(--link); text-decoration: none; display: inline-block; }
        .card-link-ind { color: var(--ora); text-decoration: none; display: inline-block; }
        .card-list-wrapper { background: #f9f9f9; padding: 6px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid #eee; }
        .card-list-wrapper.expanded { background: white; padding: 15px; border: 2px solid var(--ora); }
        .card-list-text { font-size: 0.9rem; color: #555; display: flex; flex-direction: column; gap: 2px; }
        .card-prod-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 1px 0; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .card-prod-desc { flex-grow: 1; text-transform: uppercase; white-space: normal; word-wrap: break-word; }
        .card-prod-val { width: 65px; text-align: right; color: #666; flex-shrink: 0; font-weight: 700; margin-left: 5px; }
        .expanded .card-prod-val { display: none; }
        .expanded .card-list-text { font-size: 1.6rem; color: var(--blu); line-height: 1.2; gap: 5px; }
        .expanded .card-prod-row { border-bottom: 1px solid #eee; padding: 4px 0; }
        .card-footer-big { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #eee; padding-top: 10px; }
        .pay-label-big { font-size: 1.3rem; font-weight: 900; }
        .tot-label-big { font-size: 1.8rem; color: var(--ora); }
        .autocomplete-wrap { position: relative; margin-bottom: 12px; }
        .autocomplete-wrap .input-big { margin-bottom: 0; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid var(--ora); border-radius: 0 0 10px 10px; z-index: 500; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .autocomplete-item { padding: 12px; font-size: 1.1rem; color: var(--blu); cursor: pointer; border-bottom: 1px solid #eee; }
        .autocomplete-item:active { background: #eee; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-input { flex: 1; padding: 10px 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1rem; outline: none; color: var(--blu); background: white; font-weight: 900; text-transform: uppercase; }
        .orario-block { background: white; border-radius: 12px; margin-bottom: 10px; overflow: hidden; border-left: 8px solid #ccc; }
        .orario-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; cursor: pointer; }
        .orario-ora { font-size: 1.6rem; color: var(--blu); }
        .orario-detail { display: none; border-top: 2px solid #eee; padding: 10px 15px; }
        .orario-detail.open { display: block; }
        #barra-stampa { position: fixed; bottom: 0; left: 0; right: 0; background: var(--blu); padding: 12px 15px; display: none; align-items: center; justify-content: space-between; z-index: 500; border-top: 3px solid var(--ora); }
        #fb-status { position: fixed; bottom: 8px; right: 10px; font-size: 0.65rem; color: rgba(255,255,255,0.4); z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>
 
<div id="app-admin">
    <div class="header-main">
        <span style="font-size:0.8rem;">SAVERIO DELIVERY</span>
        <div id="main-total">0,00 €</div>
        <div class="order-tag" id="header-tag">#01</div>
    </div>
    <div class="nav-bar">
        <button class="nav-btn active" id="btn-t1" onclick="showTab(1)">CLIENTE</button>
        <button class="nav-btn" id="btn-t2" onclick="showTab(2)">ORDINE</button>
        <button class="nav-btn" id="btn-t4" onclick="showTab(4)">RIEPILOGO</button>
        <button class="nav-btn" id="btn-t5" onclick="showTab(5)">CONSEGNE</button>
        <button class="nav-btn" id="btn-t6" onclick="showTab(6)">ORARI</button>
    </div>
    <div class="content-area">
        <div id="tab1" class="tab-content show">
            <div class="autocomplete-wrap">
                <input type="text" id="o-cognome" class="input-big" placeholder="👤 COGNOME" oninput="onCognomeInput()" autocomplete="off">
                <div id="autocomplete-list" class="autocomplete-list" style="display:none;"></div>
            </div>
            <div style="display:flex; gap:5px; margin-bottom:12px;">
                <input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;" placeholder="📞 TELEFONO">
                <button style="width:50px; background:var(--rosso); color:white; border:none; border-radius:10px;" onclick="skipTel()">X</button>
            </div>
            <input type="text" id="o-indirizzo" class="input-big" placeholder="📍 INDIRIZZO" oninput="updateRiepilogo()">
            <input type="text" id="o-nota-cons" class="input-big note-field" placeholder="📝 NOTA CONSEGNA (ES. CITOFONO/PIANO)" oninput="updateRiepilogo()">
            <button id="btn-maps" style="width:100%; padding:15px; background:#4285F4; color:white; border:none; border-radius:10px; margin-bottom:12px;" onclick="verifyMaps()">📍 VERIFICA POSIZIONE</button>
            <div style="display:grid; grid-template-columns: repeat(5,1fr); gap:5px; margin-bottom:12px;">
                <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost1" onclick="setCost(1)">1€</button>
                <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost2" onclick="setCost(2)">2€</button>
                <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost3" onclick="setCost(3)">3€</button>
                <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost4" onclick="setCost(4)">4€</button>
                <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost5" onclick="setCost(5)">5€</button>
            </div>
            <select id="o-orario" class="input-big" onchange="updateRiepilogo()"><option value="">🕒 ORARIO CONSEGNA</option></select>
        </div>
 
        <div id="tab2" class="tab-content">
            <h2 style="color:var(--blu); margin-bottom:10px;">LISTA ORDINE</h2>
            <div class="comanda-paper" id="comanda-root"></div>
        </div>
 
        <div id="tab4" class="tab-content">
            <h2>RIEPILOGO</h2>
            <div id="riepilogo-box" style="background:white; padding:15px; border-radius:10px; margin-bottom:15px; color:var(--blu);"></div>
            <input type="text" id="o-nota-rip" class="input-big note-field" placeholder="📝 NOTA ORDINE (ES. AGGIUNTE PARTICOLARI)" oninput="updateRiepilogo()">
            <div class="pay-grid">
                <button class="nav-btn" id="p-cont" onclick="setPay('CONTANTI')">CONTANTI</button>
                <button class="nav-btn" id="p-pos" onclick="setPay('POS')">POS</button>
                <button class="nav-btn" id="p-pag" onclick="setPay('PAGATO')">PAGATO</button>
            </div>
            <div id="resto-box" style="display:none; margin-top:10px;">
                <input type="text" id="o-resto" class="input-big" placeholder="ES: RESTO DA 50€" oninput="updateRiepilogo()">
            </div>
            <button id="btn-invia" style="width:100%; height:70px; background:#ccc; border:none; border-radius:15px; color:white; margin-top:15px;" disabled onclick="inviaOrdine()">INVIA ORDINE</button>
        </div>
 
        <div id="tab5" class="tab-content">
            <h2 style="color:var(--blu); margin-bottom:10px;">STATO CONSEGNE</h2>
            <div class="search-bar">
                <input type="text" id="search-consegne" class="search-input" placeholder="🔍 CERCA COGNOME O INDIRIZZO" oninput="renderConsegne()">
            </div>
            <div id="consegne-lista"></div>
            <div style="height:70px;"></div>
        </div>
 
        <div id="tab6" class="tab-content">
            <h2 style="color:var(--blu); margin-bottom:15px;">ORARI</h2>
            <div id="orari-lista"></div>
        </div>
    </div>
</div>
 
<div id="barra-stampa">
    <button onclick="annullaStampa()" style="padding:8px 14px; background:none; border:2px solid rgba(255,255,255,0.3); color:white; border-radius:8px; font-weight:900; font-size:0.85rem; cursor:pointer;">✕ ANNULLA</button>
    <span id="stampa-count" style="color:var(--giallo); font-size:0.95rem;"></span>
    <button onclick="stampaSelezionati()" style="padding:10px 20px; background:var(--ora); color:white; border:none; border-radius:8px; font-weight:900; font-size:1rem; cursor:pointer;">🖨️ STAMPA</button>
</div>
 
<div id="fb-status">⚪ connecting...</div>
 
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
 
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBvQVRAkkyO00yttmQuoZiAohM2P44gY1Y",
        authDomain: "saverio-delivery-29387.firebaseapp.com",
        databaseURL: "https://saverio-delivery-29387-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "saverio-delivery-29387",
        storageBucket: "saverio-delivery-29387.firebasestorage.app",
        messagingSenderId: "1023327240106",
        appId: "1:1023327240106:web:203ace4347a69a038ab5d3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ordiniRef = db.ref('ordini');
    const contatoreRef = db.ref('contatore');
    const clientiRef = db.ref('clienti');
 
    let sCost = 0; let sPay = ""; let currentOrderNum = 1;
    let ordiniSalvati = []; let editKey = null;
    let riders = {}; let clienti = {}; let listino = {};
    let selezionatiStampa = new Set();
    const coloriTipo = {'0':'#E8600A','1':'#FF4444','2':'#007AFF','3':'#8B6914','4':'#CC5500'};
    const classiTipo = {'0':'','1':'tipo-polleria','2':'tipo-bibite','3':'tipo-banco','4':'tipo-coscia'};
 
    window.addEventListener('load', () => initApp());
 
    function showTab(n){ 
        document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show')); 
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); 
        document.getElementById('tab'+n).classList.add('show'); 
        let btnId = n === 4 ? 'btn-t4' : n === 5 ? 'btn-t5' : n === 6 ? 'btn-t6' : 'btn-t'+n;
        document.getElementById(btnId).classList.add('active'); 
        updateRiepilogo();
        if(n===5) renderConsegne();
        if(n===6) renderOrari();
        if(n!==5) { selezionatiStampa.clear(); aggiornaBarra(); }
    }
 
    function initApp(){
        const root = document.getElementById('comanda-root');
        if(root.children.length > 0) return;
        for(let i=0; i<25; i++){
            let row = document.createElement('div'); row.className = 'row-piz'; row.id = `row-${i}`;
            row.innerHTML = `
                <div class="cell-piz c-gf"><input type="checkbox" class="check-gf" id="f-${i}" onchange="toggleGF(${i})"></div>
                <div class="cell-piz c-tipo" style="cursor:pointer;" onclick="cicloTipo(${i})" title="Tocca per cambiare tipo"><div id="bt-${i}" data-tipo="0" style="width:10px; height:10px; border-radius:50%; background:#ccc; margin:auto;"></div></div>
                <div class="cell-piz c-qty"><input type="text" class="input-piz" id="q-${i}" onkeydown="goGusto(event, ${i})" oninput="onQtaInput(${i})"></div>
                <div class="cell-piz c-gusto"><textarea class="area-gusto" id="g-${i}" rows="1" oninput="autoExpand(this); onGustoInput(${i})" onkeydown="goNext(event, ${i})"></textarea></div>
                <div class="cell-piz c-prezzo"><input type="number" class="input-prezzo" id="p-${i}" oninput="updateRiepilogo()" onkeydown="goPrezzoNext(event, ${i})"></div>
                <div id="sug-${i}" style="display:none; position:absolute; left:0; right:0; background:white; border:2px solid var(--ora); border-radius:0 0 8px 8px; z-index:500; max-height:150px; overflow-y:auto;"></div>`;
            row.style.position = 'relative';
            root.appendChild(row);
        }
        updateTimeSelect();
        db.ref('listino').on('value', snap => { listino = snap.val() || {}; });
        ordiniRef.on('value', (snapshot) => {
            ordiniSalvati = [];
            snapshot.forEach((child) => { let o = child.val(); o._key = child.key; ordiniSalvati.push(o); });
            ordiniSalvati.sort((a,b) => (a.ora || "").localeCompare(b.ora || ""));
            if(document.getElementById('tab5').classList.contains('show')) renderConsegne();
            document.getElementById('fb-status').textContent = '🟢 sync';
        });
        contatoreRef.on('value', (snapshot) => { if(snapshot.val() !== null) currentOrderNum = snapshot.val() + 1; });
        db.ref('riders').on('value', snap => { riders = snap.val() || {}; });
        clientiRef.on('value', snap => { clienti = snap.val() || {}; });
        db.ref('.info/connected').on('value', (snap) => {
            document.getElementById('fb-status').textContent = snap.val() ? '🟢 sync' : '🔴 offline';
        });
    }
 
    function cicloTipo(i) {
        let dot = document.getElementById(`bt-${i}`);
        let attuale = parseInt(dot.getAttribute('data-tipo')); let prossimo = (attuale + 1) % 5;
        setTipo(i, prossimo.toString()); updateRiepilogo();
    }
 
    function setTipo(i, tipo) {
        let dot = document.getElementById(`bt-${i}`); let row = document.getElementById(`row-${i}`);
        dot.setAttribute('data-tipo', tipo);
        row.classList.remove('tipo-polleria','tipo-bibite','tipo-banco','tipo-coscia');
        if(classiTipo[tipo]) row.classList.add(classiTipo[tipo]);
        dot.style.background = coloriTipo[tipo] || '#ccc';
    }
 
    function onGustoInput(i) {
        autoExpand(document.getElementById(`g-${i}`)); updateRiepilogo();
        let val = document.getElementById(`g-${i}`).value.trim().toUpperCase();
        let sug = document.getElementById(`sug-${i}`);
        if(val.length < 2 || !listino) { sug.style.display='none'; return; }
        let matches = Object.entries(listino).filter(([k,p]) => p.nome.includes(val));
        if(matches.length === 0) { sug.style.display='none'; return; }
        sug.innerHTML = matches.slice(0,5).map(([k,p]) => {
            let priceLabel = p.modalita==='qta' ? '(prezzo da qtà)' : p.modalita==='kg' ? `${p.prezzo.toFixed(2).replace('.',',')}€/kg` : `${p.prezzo.toFixed(2).replace('.',',')}€`;
            return `<div style="padding:8px 10px; font-size:0.9rem; color:var(--blu); cursor:pointer; border-bottom:1px solid #eee;" 
                onclick="selezionaProdotto(${i},'${p.nome.replace(/'/g, "\\'")}','${p.tipo}',${p.prezzo},'${p.modalita}')">
                <span style="color:${coloriTipo[p.tipo]||'inherit'};">●</span> ${p.nome} <span style="color:#aaa; font-size:0.8rem;">${priceLabel}</span>
            </div>`;
        }).join('');
        sug.style.display = 'block';
    }
 
    function selezionaProdotto(i, nome, tipo, prezzo, modalita) {
        document.getElementById(`g-${i}`).value = nome; setTipo(i, tipo);
        let qta = document.getElementById(`q-${i}`).value.trim();
        if(modalita === 'fisso') { let q = parseQtaKg(qta) || 1; document.getElementById(`p-${i}`).value = (q * prezzo).toFixed(2); }
        else if(modalita === 'kg') { let q = parseQtaKg(qta); if(q > 0) document.getElementById(`p-${i}`).value = (q * prezzo).toFixed(2); }
        else if(modalita === 'qta') { let q = parseFloat(qta.replace(',','.')); if(q > 0) document.getElementById(`p-${i}`).value = q.toFixed(2); }
        document.getElementById(`sug-${i}`).style.display = 'none'; updateRiepilogo();
    }
 
    function parseQtaKg(q) {
        let s = (q||'').toString().trim().replace(',','.');
        if(s.includes('/')) { let p=s.split('/'); return parseFloat(p[0])/parseFloat(p[1]); }
        return parseFloat(s) || 0;
    }
 
    function onQtaInput(i) {
        let nome = document.getElementById(`g-${i}`).value.trim().toUpperCase();
        let match = Object.values(listino||{}).find(p => p.nome === nome);
        if(!match) return;
        let qta = document.getElementById(`q-${i}`).value.trim();
        if(match.modalita === 'fisso') { let q = parseQtaKg(qta) || 1; if(q > 0) document.getElementById(`p-${i}`).value = (q * match.prezzo).toFixed(2); }
        else if(match.modalita === 'kg') { let q = parseQtaKg(qta); if(q > 0) document.getElementById(`p-${i}`).value = (q * match.prezzo).toFixed(2); }
        else if(match.modalita === 'qta') { let q = parseFloat(qta.replace(',','.')); if(q > 0) document.getElementById(`p-${i}`).value = q.toFixed(2); }
        updateRiepilogo();
    }
 
    function updateTimeSelect() {
        let sel=document.getElementById('o-orario'); sel.innerHTML = '<option value="">🕒 ORARIO CONSEGNA</option>';
        for(let t = 1080; t <= 1350; t += 15) {
            let hh = Math.floor(t / 60); let mm = t % 60; let timeStr = `${hh}:${mm === 0 ? '00' : mm}`;
            let opt = document.createElement('option'); opt.value = timeStr; opt.innerText = timeStr; sel.appendChild(opt);
        }
    }
 
    function autoExpand(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; updateRiepilogo(); }
    function goGusto(e, i) { 
        if(e.key === ' ') { e.preventDefault(); document.getElementById(`g-${i}`).focus(); }
        if(e.key === 'Backspace' && document.getElementById(`q-${i}`).value === '' && i > 0) { e.preventDefault(); document.getElementById(`g-${i-1}`).focus(); }
    }
    function goNext(e, i) { 
        if(e.key === 'Enter') { e.preventDefault(); if(i<24) document.getElementById(`q-${i+1}`).focus(); }
        if(e.key === 'Backspace' && document.getElementById(`g-${i}`).value === '') { e.preventDefault(); document.getElementById(`q-${i}`).focus(); }
    }
    function goPrezzoNext(e, i) { 
        if(e.key === 'Enter') { e.preventDefault(); if(i<24) document.getElementById(`p-${i+1}`).focus(); }
        if(e.key === 'Backspace' && document.getElementById(`p-${i}`).value === '' && i > 0) { e.preventDefault(); document.getElementById(`p-${i-1}`).focus(); }
    }
 
    function toggleGF(i){ document.getElementById(`row-${i}`).classList.toggle('row-is-gf', document.getElementById(`f-${i}`).checked); updateRiepilogo(); }
    function setCost(v){ sCost=v; document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white'); if(v>0) document.getElementById('cost'+v).style.background='var(--ora)'; updateRiepilogo(); }
    function setPay(t){ sPay=t; document.querySelectorAll('[id^="p-"]').forEach(b=>b.style.background='#D0DCE8'); if(t){ let k = t==='PAGATO'?'pag':t==='CONTANTI'?'cont':'pos'; document.getElementById('p-'+k).style.background='var(--ora)'; } document.getElementById('resto-box').style.display=(t==='CONTANTI')?'block':'none'; updateRiepilogo(); }
    function skipTel(){ document.getElementById('o-tel').value="INTERNO"; updateRiepilogo(); }
 
    function updateRiepilogo(){
        let rawItems = [];
        for(let i=0; i<25; i++){
            let v=parseFloat(document.getElementById(`p-${i}`).value)||0; let g=document.getElementById(`g-${i}`).value; 
            let q=document.getElementById(`q-${i}`).value||"0"; let isGf=document.getElementById(`f-${i}`).checked;
            let tipo=document.getElementById(`bt-${i}`).getAttribute('data-tipo');
            if(v>0||g.trim()!=="") rawItems.push({q,g:g.toUpperCase(),v,isGf,tipo});
        }
        let items=rawItems.sort((a,b)=>a.tipo-b.tipo);
        let pt=rawItems.reduce((acc,curr)=>acc+curr.v,0);
        let tot=pt+sCost; document.getElementById('main-total').innerText=tot.toFixed(2).replace('.',',')+' €';
        let nOrd=(editKey!==null)?ordiniSalvati.find(o=>o._key===editKey)?.num||('#'+currentOrderNum.toString().padStart(2,'0')):'#'+currentOrderNum.toString().padStart(2,'0');
        document.getElementById('header-tag').innerText=nOrd;
        document.getElementById('btn-invia').innerText=(editKey!==null)?`AGGIORNA ORDINE ${nOrd}`:'INVIA ORDINE';
        let cog=document.getElementById('o-cognome').value.toUpperCase(); 
        let ind=document.getElementById('o-indirizzo').value.toUpperCase(); 
        let ora=document.getElementById('o-orario').value; 
        let lHtml=items.map(item=>{
            let colorClass=item.isGf?'gf-text':(item.tipo==='1'?'tipo-polleria':(item.tipo==='2'?'tipo-bibite':(item.tipo==='3'?'tipo-banco':(item.tipo==='4'?'tipo-coscia':''))));
            return `<div class="pizza-item ${colorClass}"><div class="pizza-qty">${item.q}</div><div class="pizza-desc">${item.isGf?'[GF] ':''}${item.g}</div><div class="pizza-price">${item.v.toFixed(2)}€</div></div>`;
        }).join('');
        document.getElementById('riepilogo-box').innerHTML=`
            <div class="rip-row-top"><span>🏷️ ${nOrd}</span> <span>🕒 ${ora||'--:--'}</span></div>
            <div class="rip-row-client">👤 <b>${cog||'---'}</b><br>📍 <b>${ind||'---'}</b></div>
            <div style="margin-top:10px; border-top:2px solid #333; padding-top:10px;">${lHtml}</div>
            <div class="rip-delivery-row"><span style="width:80px; text-align:right; font-size:1.2rem;">🛵 <b>${sCost.toFixed(2)}€</b></span></div>
            <div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;"><div style="text-align:right; color:var(--ora); font-size:1.6rem;"><b>TOTALE: ${tot.toFixed(2)}€</b></div></div>`;
        let ok=cog&&ind&&ora&&sCost>0&&pt>0&&sPay;
        document.getElementById('btn-invia').style.background=ok?'var(--ver)':'#ccc'; document.getElementById('btn-invia').disabled=!ok;
    }
 
    function inviaOrdine() {
        let rawItems=[];
        for(let i=0;i<25;i++){
            let v=parseFloat(document.getElementById(`p-${i}`).value)||0; let g=document.getElementById(`g-${i}`).value; 
            let q=document.getElementById(`q-${i}`).value||"0"; let isGf=document.getElementById(`f-${i}`).checked;
            let tipo=document.getElementById(`bt-${i}`).getAttribute('data-tipo');
            if(v>0||g.trim()!=="") rawItems.push({q,g:g.toUpperCase(),v,isGf,tipo});
        }
        let items=rawItems.sort((a,b)=>a.tipo-b.tipo);
        let ordine={
            num:(editKey!==null)?ordiniSalvati.find(o=>o._key===editKey)?.num||('#'+currentOrderNum.toString().padStart(2,'0')):'#'+currentOrderNum.toString().padStart(2,'0'),
            ora:document.getElementById('o-orario').value,
            cog:document.getElementById('o-cognome').value.toUpperCase(),
            ind:document.getElementById('o-indirizzo').value.toUpperCase(),
            tel:document.getElementById('o-tel').value.toUpperCase(),
            nota:document.getElementById('o-nota-cons').value.toUpperCase(),
            notaRip:document.getElementById('o-nota-rip').value.toUpperCase(),
            tot:document.getElementById('main-total').innerText,
            costoCons:sCost,pay:sPay,resto:document.getElementById('o-resto').value.toUpperCase(),
            prodotti:items
        };
        if(editKey!==null){let k=editKey;editKey=null;ordiniRef.child(k).set(ordine);}
        else{ordiniRef.push(ordine);contatoreRef.set(currentOrderNum);salvaCliente(ordine.cog,ordine.tel,ordine.ind,ordine.nota);}
        resetForm(); showTab(5);
    }
 
    function resetForm() {
        document.getElementById('o-cognome').value=""; document.getElementById('o-tel').value=""; document.getElementById('o-indirizzo').value="";
        document.getElementById('o-nota-cons').value=""; document.getElementById('o-nota-rip').value=""; document.getElementById('o-orario').value=""; document.getElementById('o-resto').value="";
        sPay=""; sCost=0; document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white'); document.querySelectorAll('[id^="p-"]').forEach(b=>b.style.background='#D0DCE8');
        for(let i=0;i<25;i++){
            document.getElementById(`q-${i}`).value=""; document.getElementById(`g-${i}`).value=""; document.getElementById(`g-${i}`).style.height="auto";
            document.getElementById(`p-${i}`).value=""; document.getElementById(`f-${i}`).checked=false; 
            document.getElementById(`bt-${i}`).setAttribute('data-tipo','0'); document.getElementById(`bt-${i}`).style.background='#ccc';
            document.getElementById(`row-${i}`).classList.remove('row-is-gf','tipo-polleria','tipo-bibite','tipo-banco','tipo-coscia');
            if(document.getElementById(`sug-${i}`)) document.getElementById(`sug-${i}`).style.display='none';
        }
        updateTimeSelect(); updateRiepilogo();
        document.getElementById('btn-maps').style.background='#4285F4';
        document.getElementById('btn-maps').innerText='📍 VERIFICA POSIZIONE';
    }
 
    function modificaOrdine(key) {
        let o=ordiniSalvati.find(ord=>ord._key===key);
        if(!o) return;
        editKey=key; resetForm();
        document.getElementById('o-cognome').value=o.cog; document.getElementById('o-tel').value=o.tel; document.getElementById('o-indirizzo').value=o.ind;
        document.getElementById('o-nota-cons').value=o.nota; document.getElementById('o-nota-rip').value=o.notaRip; 
        updateTimeSelect();
        let selOra=document.getElementById('o-orario');
        let hasTime=Array.from(selOra.options).some(opt=>opt.value===o.ora);
        if(!hasTime){let opt=document.createElement('option');opt.value=o.ora;opt.innerText=o.ora;selOra.appendChild(opt);}
        selOra.value=o.ora; document.getElementById('o-resto').value=o.resto;
        setCost(o.costoCons); setPay(o.pay);
        o.prodotti.forEach((prod,i)=>{
            if(i<25){
                document.getElementById(`q-${i}`).value=prod.q;
                document.getElementById(`g-${i}`).value=prod.g;
                document.getElementById(`p-${i}`).value=prod.v;
                document.getElementById(`f-${i}`).checked=prod.isGf;
                setTipo(i,prod.tipo||'0');
                let gInput=document.getElementById(`g-${i}`);
                gInput.style.height='auto'; gInput.style.height=(gInput.scrollHeight>0?gInput.scrollHeight:50)+'px';
            }
        });
        showTab(1);
    }
 
    function eliminaOrdine(key) {
        let o=ordiniSalvati.find(ord=>ord._key===key);
        if(o&&confirm(`Sei sicura di voler eliminare l'ordine ${o.num}?`)) ordiniRef.child(key).remove();
    }
 
    function toggleCardList(element) { element.classList.toggle('expanded'); }
 
    function toggleSelezioneStampa(key, event) {
        event.stopPropagation();
        if(selezionatiStampa.has(key)) selezionatiStampa.delete(key);
        else selezionatiStampa.add(key);
        aggiornaBarra();
        renderConsegne();
    }
 
    function aggiornaBarra() {
        let barra=document.getElementById('barra-stampa');
        let count=document.getElementById('stampa-count');
        if(selezionatiStampa.size>0){
            barra.style.display='flex';
            count.textContent=selezionatiStampa.size + (selezionatiStampa.size===1?' ordine':' ordini');
        } else {
            barra.style.display='none';
        }
    }
 
    function annullaStampa() {
        selezionatiStampa.clear(); aggiornaBarra(); renderConsegne();
    }
 
    function stampaSelezionati() {
        if(selezionatiStampa.size===0) return;
        let ordiniDaStampare=ordiniSalvati.filter(o=>selezionatiStampa.has(o._key));
        let testo=ordiniDaStampare.map(o=>{
            let tipoPrec='';
            let righe=o.prodotti.map(p=>{
                let sep=(tipoPrec!==''&&tipoPrec!==p.tipo)?'\n':'';
                tipoPrec=p.tipo;
                let riga=`${p.q}  ${p.isGf?'[GF] ':''}${p.g}`;
                let prezzo=p.v.toFixed(2)+'E';
                let spazi=' '.repeat(Math.max(1,30-riga.length-prezzo.length));
                return sep+riga+spazi+prezzo;
            }).join('\n');
            return `================================\n      SAVERIO DELIVERY\n================================\n${o.num}                    ${o.ora}\n${o.cog}\n${o.ind}\nTEL: ${o.tel}${o.nota?'\nNOTA: '+o.nota:''}\n--------------------------------\n${righe}\n--------------------------------\nCONSEGNA           ${o.costoCons.toFixed(2)}E\n================================\nTOTALE        ${o.tot}\n================================\n${o.pay}${o.pay==='CONTANTI'&&o.resto?' - '+o.resto:''}\n================================`;
        }).join('\n\n\n');
        window.location.href='rawbt:'+encodeURIComponent(testo);
        selezionatiStampa.clear(); aggiornaBarra(); renderConsegne();
    }
 
    function renderConsegne() {
        const container=document.getElementById('consegne-lista');
        let searchEl=document.getElementById('search-consegne');
        let search=searchEl?searchEl.value.trim().toUpperCase():'';
        let lista=search
            ?ordiniSalvati.filter(o=>(o.cog||'').includes(search)||(o.ind||'').includes(search)||(o.num||'').includes(search))
            :ordiniSalvati;
        if(lista.length===0){container.innerHTML='<div style="text-align:center;padding:30px;color:#aaa;">Nessun ordine trovato</div>';return;}
        container.innerHTML=lista.map((o)=>{
            let stato=o.stato||'attesa';
            let statoClass=stato==='pronto'?'stato-pronto':stato==='assegnato'?'stato-assegnato':stato==='consegnato'?'stato-consegnato':'';
            let badgeClass=stato==='pronto'?'badge-pronto':stato==='assegnato'?'badge-assegnato':stato==='consegnato'?'badge-consegnato':'badge-attesa';
            let badgeLabel=stato==='pronto'?'✅ PRONTO':stato==='assegnato'?'🛵 ASSEGNATO':stato==='consegnato'?'✔ CONSEGNATO':'⏳ IN ATTESA';
            let btnMod=stato==='consegnato'
                ?`<button class="act-btn-small btn-mod" style="opacity:0.3; cursor:default;">✏️</button>`
                :`<button class="act-btn-small btn-mod" onclick="modificaOrdine('${o._key}')">✏️</button>`;
            let isSelezionata=selezionatiStampa.has(o._key);
            return `<div class="card-consegna ${statoClass} ${isSelezionata?'selezionata':''}">
                <div class="card-header-main">
                    <span class="card-num-big">🏷️ ${o.num}</span>
                    <div class="card-actions-top">
                        <input type="checkbox" ${isSelezionata?'checked':''} onclick="toggleSelezioneStampa('${o._key}',event)" style="width:22px;height:22px;cursor:pointer;accent-color:var(--ora);">
                        ${btnMod}
                        <button class="act-btn-small btn-del" onclick="eliminaOrdine('${o._key}')">🗑️</button>
                    </div>
                    <span class="card-ora-big">🕒 ${o.ora}</span>
                </div>
                <span class="stato-badge ${badgeClass}">${badgeLabel}</span>
                <div class="card-body-main">
                    <b>👤 ${o.cog}</b><br>
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.ind)}" class="card-link-ind" target="_blank">📍 ${o.ind}</a><br>
                    <small>📞 <a href="tel:${o.tel}" class="card-link-tel">${o.tel}</a></small>
                </div>
                <div class="card-list-wrapper" onclick="toggleCardList(this)">
                    <div class="card-list-text">
                        ${o.prodotti.map(p=>{
                            let cClass=p.isGf?'var(--ver)':(p.tipo==='1'?'var(--rosso)':(p.tipo==='2'?'var(--bibite)':(p.tipo==='3'?'#8B6914':(p.tipo==='4'?'#CC5500':'inherit'))));
                            return `<div class="card-prod-row" style="color:${cClass}">
                                <span class="card-prod-desc">${p.isGf?'[GF] ':''}${p.q} ${p.g}</span>
                                <span class="card-prod-val">${p.v.toFixed(2)}€</span>
                            </div>`;
                        }).join('')}
                        <div class="card-prod-row" style="margin-top:2px;border-top:1px dashed #ddd;padding-top:2px;">
                            <span class="card-prod-desc">🛵 CONSEGNA</span>
                            <span class="card-prod-val">${o.costoCons.toFixed(2)}€</span>
                        </div>
                    </div>
                </div>
                <div class="card-footer-big">
                    <span class="pay-label-big" style="color:${o.pay==='POS'?'var(--rosso)':o.pay==='PAGATO'?'var(--ver)':'var(--blu)'}">
                        ${o.pay} ${o.pay==='CONTANTI'&&o.resto?'('+o.resto+')':''}
                    </span>
                    <b class="tot-label-big">${o.tot}</b>
                </div>
            </div>`;
        }).join('');
    }
 
    function renderOrari() {
        const container=document.getElementById('orari-lista');
        if(ordiniSalvati.length===0){container.innerHTML='<div style="text-align:center;padding:40px;color:#aaa;font-size:1.1rem;">Nessun ordine ancora</div>';return;}
        let fasce={};
        ordiniSalvati.forEach(o=>{if(!o.ora)return;if(!fasce[o.ora])fasce[o.ora]=[];fasce[o.ora].push(o);});
        let orariOrdinati=Object.keys(fasce).sort();
        container.innerHTML=orariOrdinati.map(ora=>{
            let ordini=fasce[ora],n=ordini.length;
            let dettagli=ordini.map(o=>{
                let prodTags=o.prodotti.map(p=>{
                    let cls=p.isGf?'is-gf':p.tipo==='1'?'is-pollo':p.tipo==='2'?'is-bibita':p.tipo==='3'?'is-banco':'';
                    return `<span class="orario-prod-tag ${cls}">${p.q} ${p.g}</span>`;
                }).join('');
                return `<div class="orario-ordine"><div class="orario-ordine-top"><span class="orario-cliente">👤 ${o.cog}</span><span class="orario-num">${o.num}</span></div><div class="orario-ind">📍 ${o.ind}</div><div class="orario-prodotti">${prodTags}</div></div>`;
            }).join('');
            return `<div class="orario-block"><div class="orario-header" onclick="toggleOrario(this)"><span class="orario-ora">🕒 ${ora}</span><span class="orario-badge badge-verde">${n} ordini</span></div><div class="orario-detail">${dettagli}</div></div>`;
        }).join('');
    }
 
    function toggleOrario(header) { header.nextElementSibling.classList.toggle('open'); }
 
    function onCognomeInput() {
        updateRiepilogo();
        let val=document.getElementById('o-cognome').value.trim().toUpperCase();
        let list=document.getElementById('autocomplete-list');
        if(val.length<2){list.style.display='none';return;}
        let matches=Object.values(clienti).filter(c=>c.cog.startsWith(val));
        if(matches.length===0){list.style.display='none';return;}
        
        list.innerHTML=matches.slice(0,5).map(c=> {
            // Prepariamo i dati in modo sicuro per il clic
            let safeCog = c.cog.replace(/'/g, "\\'");
            let safeInd = (c.ind || "").replace(/'/g, "\\'");
            let safeTel = (c.tel || "").replace(/'/g, "\\'");
            let safeNota = (c.nota || "").replace(/'/g, "\\'");
            
            return `<div class="autocomplete-item" onclick="selezionaCliente('${safeCog}','${safeTel}','${safeInd}','${safeNota}')">
                <b>${c.cog}</b> — ${c.ind}<br><small style="color:#888;">${c.tel||''}</small>
            </div>`;
        }).join('');
        list.style.display='block';
    }
 
    function selezionaCliente(cog, tel, ind, nota) {
        document.getElementById('o-cognome').value = cog;
        document.getElementById('o-tel').value = tel || "";
        document.getElementById('o-indirizzo').value = ind || "";
        document.getElementById('o-nota-cons').value = nota || "";
        document.getElementById('autocomplete-list').style.display = 'none';
        updateRiepilogo();
    }
 
    function salvaCliente(cog,tel,ind,nota) {
        if(!cog||!ind) return;
        let esistente=Object.entries(clienti).find(([k,c])=>c.cog===cog&&c.ind===ind);
        if(esistente) clientiRef.child(esistente[0]).update({cog,tel,ind,nota});
        else clientiRef.push({cog,tel,ind,nota});
    }
 
    function verifyMaps() {
        let a=document.getElementById('o-indirizzo').value;
        if(!a) return alert("METTI INDIRIZZO");
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}`);
        document.getElementById('btn-maps').style.background='var(--ver)';
        document.getElementById('btn-maps').innerText='✅ POSIZIONE VERIFICATA';
    }
</script>
</body>
</html>
