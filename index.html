<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --bor: #D0DCE8; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; }
        body { background: var(--blu); color: white; height: 100vh; overflow: hidden; }

        /* Schermata Iniziale Blu */
        .page { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .page.show { display: flex; }
        #title-main { font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 50px; text-align: center; }
        
        /* Bottoni */
        .btn-main { width: 100%; max-width: 300px; padding: 20px; background: var(--ora); border: none; border-radius: 15px; color: white; font-weight: 900; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; }
        .btn-sub { background: #2B5F8E; margin-top: 15px; padding: 12px; font-size: 0.9rem; }

        /* PIN Pad */
        .pin-container { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; }
        .dot.active { background: var(--ora); border-color: var(--ora); }
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { width: 75px; height: 75px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.8rem; font-weight: 900; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* App Admin */
        #app-admin { display: none; background: #f4f7f9; color: var(--blu); position: fixed; inset: 0; flex-direction: column; }
        #app-admin.show { display: flex; }
        .header-admin { background: var(--blu); color: white; padding: 15px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
        .content { flex: 1; overflow-y: auto; padding: 20px; }

        /* Form Nuovo Ordine */
        .form-group { margin-bottom: 15px; }
        .label { display: block; font-weight: 900; font-size: 0.8rem; margin-bottom: 5px; color: #666; }
        .input-big { width: 100%; padding: 15px; border: 2px solid var(--bor); border-radius: 12px; font-size: 1.4rem; font-weight: 700; outline: none; color: var(--blu); }
        .input-big:focus { border-color: var(--ora); }
        
        .btn-maps { background: #4285F4; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 900; width: 100%; margin-top: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .saved-map-link { color: #4285F4; font-weight: 700; font-size: 0.8rem; margin-top: 5px; display: none; text-decoration: none; }
    </style>
</head>
<body>

    <div id="page-start" class="page show">
        <h1 id="title-main">SAVERIO DELIVERY</h1>
        <button class="btn-main" onclick="openPinPad()">ADMIN</button>
    </div>

    <div id="page-pin" class="page">
        <h2 style="color:white; margin-bottom:20px; font-weight:900;">INSERISCI PIN</h2>
        <div class="pin-container">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
        <button class="btn-main btn-sub" onclick="resetPin()">CANCELLA</button>
    </div>

    <div id="app-admin">
        <div class="header-admin">
            <span>SAVERIO DELIVERY - ADMIN</span>
            <button onclick="location.reload()" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:8px; font-size:0.7rem; font-weight:900;">LOGOUT</button>
        </div>
        
        <div class="content">
            <h2 style="margin-bottom:20px; font-weight:900; border-bottom:3px solid var(--ora); display:inline-block;">NUOVO ORDINE</h2>
            
            <div class="form-group">
                <span class="label">COGNOME</span>
                <input type="text" id="o-cognome" class="input-big" placeholder="ES: ROSSI">
            </div>

            <div class="form-group">
                <span class="label">INDIRIZZO</span>
                <input type="text" id="o-indirizzo" class="input-big" placeholder="VIA E CIVICO">
                <button class="btn-maps" onclick="verifyAddress()">
                    📍 VERIFICA SU MAPS
                </button>
                <a id="saved-map-url" class="saved-map-link" target="_blank">✅ POSIZIONE MEMORIZZATA (CLICCA PER APRIRE)</a>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div class="form-group">
                    <span class="label">CELLULARE</span>
                    <input type="tel" id="o-cell" class="input-big" placeholder="333...">
                </div>
                <div class="form-group">
                    <span class="label">ORARIO</span>
                    <input type="time" id="o-orario" class="input-big">
                </div>
            </div>

            <p style="margin-top:20px; font-size:0.8rem; color:#888;">FASE 1: DATI ANAGRAFICI COMPLETATI. PRONTO PER I PRODOTTI?</p>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "0508";
        let currentPin = "";
        let savedMapLink = "";

        // Generatore PIN Pad
        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++) {
            let btn = document.createElement('div');
            btn.className = 'num-key';
            btn.innerText = i;
            btn.onclick = () => pressKey(i.toString());
            pad.appendChild(btn);
        }
        let empty = document.createElement('div');
        pad.appendChild(empty);
        let zero = document.createElement('div');
        zero.className = 'num-key';
        zero.innerText = "0";
        zero.onclick = () => pressKey("0");
        pad.appendChild(zero);

        function openPinPad() {
            document.getElementById('page-start').classList.remove('show');
            document.getElementById('page-pin').classList.add('show');
        }

        function pressKey(num) {
            if(currentPin.length < 4) {
                currentPin += num;
                updateDots();
            }
            if(currentPin.length === 4) {
                if(currentPin === ADMIN_PIN) {
                    document.getElementById('page-pin').classList.remove('show');
                    document.getElementById('app-admin').classList.add('show');
                } else {
                    alert("PIN ERRATO!");
                    resetPin();
                }
            }
        }

        function updateDots() {
            for(let i=0; i<4; i++) {
                document.getElementById('dot-'+i).classList.toggle('active', i < currentPin.length);
            }
        }

        function resetPin() {
            currentPin = "";
            updateDots();
        }

        function verifyAddress() {
            const addr = document.getElementById('o-indirizzo').value;
            if(!addr) {
                alert("Inserisci prima l'indirizzo!");
                return;
            }
            // Genera il link di ricerca Maps
            savedMapLink = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
            
            // Mostra il link salvato cliccabile
            const linkEl = document.getElementById('saved-map-url');
            linkEl.href = savedMapLink;
            linkEl.style.display = "block";
            
            // Apre Maps in una nuova scheda per la verifica
            window.open(savedMapLink, '_blank');
        }
    </script>
</body>
</html>
