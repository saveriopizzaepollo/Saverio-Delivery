<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SAVERIO DELIVERY - GF FIXED</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--blu); position: fixed; }

        /* LOGIN */
        .page-login { position: fixed; inset: 0; background: var(--blu); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .pin-dot { width: 15px; height: 15px; border: 2px solid white; border-radius: 50%; margin: 0 10px; }
        .pin-dot.active { background: var(--ora); border-color: var(--ora); }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }

        /* HEADER */
        .header-fixed { height: 75px; background: var(--blu); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000; position: relative; }
        #main-total { color: var(--giallo); font-weight: 900; font-size: 2rem; }
        .order-tag { background: var(--ora); padding: 5px 12px; border-radius: 8px; font-weight: 900; color: white; }

        /* SLIDER */
        .slider-wrapper { flex: 1; display: flex; height: calc(100% - 75px); overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .section { flex: 0 0 100vw; width: 100vw; height: 100%; scroll-snap-align: start; padding: 15px; overflow-y: auto; background: #f4f7f9; color: var(--blu); }

        /* INPUTS */
        .label { display: block; font-weight: 900; font-size: 0.75rem; color: #666; margin-bottom: 4px; text-transform: uppercase; }
        .input-big { width: 100%; padding: 14px; border: 2px solid var(--bor); border-radius: 12px; font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; outline: none; background: white; }
        .btn-x { background: var(--rosso); color: white; border: none; width: 50px; height: 50px; border-radius: 10px; font-weight: 900; }
        .btn-cost, .btn-pay { padding: 12px; background: white; border: 2px solid var(--blu); border-radius: 10px; font-weight: 900; cursor: pointer; color: var(--blu); }
        .btn-cost.active, .btn-pay.active { background: var(--blu); color: white; }

        /* QUADERNO */
        .comanda-paper { background: #FFF9E5; border: 2px solid var(--blu); border-radius: 10px; display: grid; grid-template-columns: 45px 1fr 85px; overflow: hidden; }
        .line-input { height: 42px; border: none; border-bottom: 1px solid #F0E6BC; background: transparent; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; padding: 0 8px; outline: none; }
        .col-prezzo .line-input { text-align: right; border-left: 1px solid #F0E6BC; background: white; }

        /* RIEPILOGO */
        .summary-box { background: white; padding: 15px; border-radius: 15px; border: 2px dashed var(--ora); margin-bottom: 15px; }
        .summary-line { border-bottom: 1px solid #eee; padding: 8px 0; font-weight: 700; display: flex; justify-content: space-between; font-size: 0.9rem; }
        
        .nav-dots { position: fixed; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 1000; pointer-events: none; }
        .dot { width: 8px; height: 8px; background: rgba(0,0,0,0.2); border-radius: 50%; }
        .dot.active { background: var(--ora); width: 20px; border-radius: 10px; }
    </style>
</head>
<body onclick="if(event.target.className === 'section') document.activeElement.blur()">

    <div id="login-screen" class="page-login">
        <h1 style="margin-bottom:20px;">ADMIN LOGIN</h1>
        <div style="display:flex;"><div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div><div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div></div>
        <div class="numpad" id="numpad"></div>
    </div>

    <div id="app-main" style="display:none; flex-direction:column; height:100%;">
        <div class="header-fixed">
            <span style="font-weight:900; font-size:0.7rem; color:white;">SAVERIO DELIVERY</span>
            <div id="main-total">0,00€</div>
            <div class="order-tag" id="order-num">#01</div>
        </div>

        <div class="slider-wrapper" id="slider">
            <div class="section">
                <span class="label">Cognome *</span><input type="text" id="o-cognome" class="input-big" oninput="updateSummary()">
                <span class="label">Cellulare *</span>
                <div style="display:flex; gap:10px; margin-bottom:12px;"><input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;"><button class="btn-x" onclick="document.getElementById('o-tel').value='NON RICHIESTO';updateSummary()">X</button></div>
                <span class="label">Indirizzo *</span><input type="text" id="o-indirizzo" class="input-big" oninput="updateSummary()">
                <span class="label">Costo Consegna *</span>
                <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:12px;">
                    <button class="btn-cost" onclick="setCost(1, this)">1€</button><button class="btn-cost" onclick="setCost(2, this)">2€</button><button class="btn-cost" onclick="setCost(3, this)">3€</button><button class="btn-cost" onclick="setCost(4, this)">4€</button><button class="btn-cost" onclick="setCost(5, this)">5€</button>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><input type="text" id="o-scala" class="input-big" placeholder="SCALA" oninput="updateSummary()"><input type="text" id="o-piano" class="input-big" placeholder="PIANO" oninput="updateSummary()"></div>
                <span class="label">Orario *</span><select id="o-orario" class="input-big" onchange="updateSummary()"><option value="">-- : --</option></select>
                <span class="label">Rider</span>
                <div style="display:flex; gap:10px;"><button class="btn-pay" id="r-porpe" onclick="setRider('PORPE')">PORPE</button><button class="btn-pay" id="r-gaspare" onclick="setRider('GASPARE')">GASPARE</button></div>
            </div>

            <div class="section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h2>PIZZE</h2>
                    <button style="background:var(--neon); border:none; padding:10px 20px; border-radius:10px; font-weight:900; box-shadow: 0 0 10px rgba(57,255,20,0.4);" onclick="makeGF()">+ GLUTEN FREE</button>
                </div>
                <div class="comanda-paper" id="comanda-rows"></div>
                <div style="text-align:right; font-weight:900; font-size:1.4rem; margin-top:8px;">Tot. Pizze ➔ <span id="tot-pizze-val">0,00 €</span></div>
            </div>

            <div class="section"><h2>CUCINA / ALTRO</h2></div>

            <div class="section">
                <h2 style="margin-bottom:10px;">RIEPILOGO</h2>
                <div class="summary-box" id="final-summary"></div>
                <span class="label">PAGAMENTO *</span>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px;">
                    <button class="btn-pay pay-opt" onclick="setPay('CONTANTI', this)">CONTANTI</button>
                    <button class="btn-pay pay-opt" onclick="setPay('POS', this)">POS</button>
                    <button class="btn-pay pay-opt" onclick="setPay('PAGATO', this)">PAGATO</button>
                </div>
                <div id="resto-box" style="display:none;"><input type="text" id="o-resto" class="input-big" placeholder="RESTO DA..." oninput="updateSummary()"></div>
                <button id="btn-invia" style="width:100%; height:70px; background:#ccc; color:white; border:none; border-radius:12px; font-weight:900; margin-top:10px;" disabled>INVIA ORDINE</button>
            </div>
        </div>
        <div class="nav-dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <script>
        let pin = ""; let selectedCost = 0; let rider = ""; let payMeth = "";
        let lastFocusedGustoId = null; // Memoria per il tasto GF

        // LOGIN
        const np = document.getElementById('numpad');
        for(let i=1; i<=9; i++) { let b = document.createElement('div'); b.className='num-btn'; b.innerText=i; b.onclick=()=>press(i); np.appendChild(b); }
        let b0 = document.createElement('div'); b0.className='num-btn'; b0.innerText="0"; b0.style.gridColumn="2"; b0.onclick=()=>press(0); np.appendChild(b0);
        function press(n) { pin+=n; document.getElementById('dot-'+(pin.length-1)).classList.add('active'); if(pin==="0508"){ document.getElementById('login-screen').style.display='none'; document.getElementById('app-main').style.display='flex'; } else if(pin.length===4){ pin=""; document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('active')); } }

        // GENERAZIONE RIGHE
        const rows = document.getElementById('comanda-rows');
        function addR(i) {
            const q = document.createElement('input'); q.className='line-input'; q.type='number'; q.id=`q-${i}`; q.placeholder="0"; 
            q.onkeydown=(e)=>{if(e.key===' '){e.preventDefault(); document.getElementById(`g-${i}`).focus();}};
            
            const g = document.createElement('input'); g.className='line-input'; g.id=`g-${i}`; g.placeholder="..."; 
            g.onfocus = () => { lastFocusedGustoId = `g-${i}`; }; // Ricorda la riga
            g.oninput = updateSummary;
            g.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault(); if(document.getElementById(`q-${i+1}`)) document.getElementById(`q-${i+1}`).focus(); else addR(i+1);}};
            
            const p = document.createElement('input'); p.className='line-input col-prezzo'; p.type='number'; p.id=`p-${i}`; p.placeholder="0.00"; 
            p.oninput = updateSummary; 
            p.onkeydown=(e)=>{if(e.key==='Enter' && document.getElementById(`p-${i+1}`)) document.getElementById(`p-${i+1}`).focus();};
            
            rows.append(q,g,p);
        }
        for(let i=0; i<12; i++) addR(i);

        function makeGF() {
            if(lastFocusedGustoId) {
                let el = document.getElementById(lastFocusedGustoId);
                let idNum = lastFocusedGustoId.split('-')[1];
                if(!el.value.includes("[GF]")) {
                    el.value += " [GF]";
                    el.style.color = "var(--neon)";
                    document.getElementById('p-'+idNum).style.color = "var(--neon)";
                    updateSummary();
                }
            } else {
                alert("Tocca prima la riga della pizza!");
            }
        }

        function setCost(v, b) { selectedCost=v; document.querySelectorAll('.btn-cost').forEach(x=>x.classList.remove('active')); b.classList.add('active'); updateSummary(); }
        function setRider(n) { rider=n; document.querySelectorAll('#r-porpe, #r-gaspare').forEach(x=>x.classList.remove('active')); document.getElementById('r-'+n.toLowerCase()).classList.add('active'); updateSummary(); }
        function setPay(m, b) { payMeth=m; document.querySelectorAll('.pay-opt').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.getElementById('resto-box').style.display = (m==='CONTANTI') ? 'block' : 'none'; updateSummary(); }

        function updateSummary() {
            let sum = 0; let pList = "";
            const allGusti = document.querySelectorAll('[id^="g-"]');
            allGusti.forEach((gInput) => {
                let i = gInput.id.split('-')[1];
                let qty = document.getElementById(`q-${i}`).value || "1";
                let gst = gInput.value.trim().toUpperCase();
                let prz = parseFloat(document.getElementById(`p-${i}`).value) || 0;
                if(gst) { 
                    sum += prz; 
                    let color = (gInput.style.color === "var(--neon)") ? 'style="color:#00E676"' : '';
                    pList += `<div class="summary-line" ${color}><span>${qty}x ${gst}</span><span>${prz.toFixed(2)}€</span></div>`; 
                }
            });

            let tot = sum + selectedCost;
            document.getElementById('main-total').innerText = tot.toFixed(2).replace('.', ',') + "€";
            document.getElementById('tot-pizze-val').innerText = sum.toFixed(2).replace('.', ',') + " €";
            
            let resto = document.getElementById('o-resto').value;
            document.getElementById('final-summary').innerHTML = `
                <div class="summary-line" style="color:var(--ora)"><span>CLIENTE:</span> <span>${document.getElementById('o-cognome').value.toUpperCase()}</span></div>
                <div class="summary-line"><span>TEL:</span> <span>${document.getElementById('o-tel').value}</span></div>
                <div class="summary-line"><span>VIA:</span> <span>${document.getElementById('o-indirizzo').value.toUpperCase()} ${document.getElementById('o-scala').value?' S.'+document.getElementById('o-scala').value.toUpperCase():''} ${document.getElementById('o-piano').value?' P.'+document.getElementById('o-piano').value.toUpperCase():''}</span></div>
                <div class="summary-line" style="color:var(--ora)"><span>ORARIO:</span> <span>${document.getElementById('o-orario').value || '--:--'}</span></div>
                <div style="margin:8px 0; border-top:1px solid #ddd; padding-top:8px;">${pList}</div>
                <div class="summary-line"><span>DOMICILIO:</span> <span>${selectedCost.toFixed(2)}€</span></div>
                <div class="summary-line" style="font-size:1.3rem; color:var(--blu)"><span>TOTALE:</span> <span>${tot.toFixed(2)}€</span></div>
                <div class="summary-line" style="color:var(--ora)"><span>RIDER:</span> <span>${rider || '---'}</span></div>
                <div class="summary-line"><span>PAGAMENTO:</span> <span>${payMeth} ${resto ? '('+resto+')' : ''}</span></div>
            `;
            
            let ok = document.getElementById('o-cognome').value && document.getElementById('o-tel').value && document.getElementById('o-indirizzo').value && selectedCost>0 && sum>0 && document.getElementById('o-orario').value && payMeth;
            let btn = document.getElementById('btn-invia');
            btn.disabled = !ok; btn.style.background = ok ? "#1B8A4A" : "#ccc";
        }

        const sel = document.getElementById('o-orario');
        sel.onfocus = () => {
            if(sel.options.length>1) return;
            let n=new Date(); let m=Math.ceil((n.getHours()*60+n.getMinutes()+15)/15)*15;
            for(let t=Math.max(1080,m); t<=1320; t+=15) {
                let h=Math.floor(t/60); let mm=t%60;
                let o=document.createElement('option'); o.value=o.text=`${h}:${mm==0?'00':mm}`; sel.add(o);
            }
        };

        const s = document.getElementById('slider');
        s.onscroll = () => { let i = Math.round(s.scrollLeft / window.innerWidth); document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', i === idx)); };
    </script>
</body>
</html>
