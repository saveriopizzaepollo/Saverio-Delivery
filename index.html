<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; }
        body { background: var(--blu); color: white; height: 100vh; overflow: hidden; }

        /* PAGINE */
        .page { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .page.show { display: flex; }

        /* PAGINA INIZIALE E PIN PAD */
        #title-main { font-size: 3rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 50px; text-align: center; }
        .btn-main { width: 100%; max-width: 300px; padding: 20px; background: var(--ora); border: none; border-radius: 15px; color: white; font-weight: 900; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; }
        .pin-container { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; }
        .dot.active { background: var(--ora); border-color: var(--ora); }
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { width: 75px; height: 75px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.8rem; font-weight: 900; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* APP ADMIN - HEADER FISSO */
        #app-admin { display: none; position: fixed; inset: 0; flex-direction: column; background: #f4f7f9; }
        #app-admin.show { display: flex; }
        .header-fixed { 
            background: var(--blu); height: 75px; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000;
        }
        #main-total { color: var(--giallo); font-weight: 900; font-size: 2rem; text-shadow: 0 0 10px rgba(255,239,0,0.5); }
        .order-tag { background: var(--ora); color: white; padding: 5px 12px; border-radius: 8px; font-weight: 900; font-size: 1.2rem; }

        /* SLIDER 4 PAGINE */
        .slider-container { display: flex; width: 400vw; height: calc(100vh - 75px); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .slider-container::-webkit-scrollbar { display: none; }
        .section { width: 100vw; height: 100%; scroll-snap-align: start; padding: 20px; overflow-y: auto; color: var(--blu); position: relative; }

        /* STILI INPUT (MAIUSCOLO + GRASSETTO FORZATO) */
        .label { display: block; font-weight: 900; font-size: 0.8rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .input-big { 
            width: 100%; padding: 15px; border: 2px solid var(--bor); border-radius: 12px; 
            font-size: 1.2rem; font-weight: 900; margin-bottom: 15px; outline: none; background: white;
            text-transform: uppercase; /* Scrive in maiuscolo visivamente */
        }
        .btn-x { background: var(--rosso); color: white; border: none; width: 55px; height: 58px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .cost-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-cost { padding: 15px 5px; background: white; border: 2px solid var(--blu); border-radius: 12px; font-weight: 900; cursor: pointer; }
        .btn-cost.active { background: var(--blu); color: white; }
        .btn-rider { flex: 1; padding: 15px; background: #D0DCE8; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; color: var(--blu); }
        .btn-rider.active { background: #4285F4; color: white; }

        /* QUADERNO PIZZE */
        .comanda-paper { background: #FFF9E5; border: 2px solid var(--blu); border-radius: 12px; display: grid; grid-template-columns: 60px 1fr 120px; overflow: hidden; }
        .col-qty, .col-gusto { border-right: 1px solid #F0E6BC; display: flex; flex-direction: column; }
        .col-prezzo { background: white; display: flex; flex-direction: column; border-left: 3px solid var(--blu); }
        .line-input {
            height: 45px; border: none; border-bottom: 1px solid #F0E6BC; background: transparent; 
            font-weight: 900; font-size: 1.2rem; text-transform: uppercase; padding: 5px 10px; outline: none;
        }
        .col-prezzo .line-input { text-align: right; font-size: 1.3rem; padding-right: 15px; color: var(--blu); }
        .btn-gf-neon { background: var(--neon); color: var(--blu); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 900; cursor: pointer; box-shadow: 0 0 15px rgba(57,255,20,0.4); }
        .is-gf { color: #00E676 !important; }
        .col-prezzo .line-input.is-gf { background: #e8fff5; color: #00E676 !important; }

        /* PALLINI NAVIGAZIONE */
        .nav-dots { position: fixed; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
        .dot { width: 10px; height: 10px; background: rgba(0,0,0,0.15); border-radius: 50%; }
        .dot.active { background: var(--ora); width: 25px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="page-start" class="page show">
        <h1 id="title-main">SAVERIO DELIVERY</h1>
        <button class="btn-main" onclick="openPinPad()">ADMIN LOGIN</button>
    </div>

    <div id="page-pin" class="page">
        <h2 style="margin-bottom:20px; font-weight:900;">INSERISCI PIN</h2>
        <div class="pin-container">
            <div class="dot" id="dot-0"></div><div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div><div class="dot" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
        <button class="btn-main" style="background:#2B5F8E; margin-top:20px; font-size:0.9rem;" onclick="resetPin()">CANCELLA</button>
    </div>

    <div id="app-admin">
        <div class="header-fixed">
            <span style="font-weight:900; font-size:0.9rem; color:white;">SAVERIO DELIVERY</span>
            <div id="main-total">0.00€</div>
            <div class="order-tag" id="order-num">#01</div>
        </div>

        <div class="slider-container" id="slider">
            
            <div class="section" id="p1">
                <span class="label">Cognome *</span>
                <input type="text" id="o-cognome" class="input-big" placeholder="OBBLIGATORIO" oninput="validate()">

                <span class="label">Cellulare *</span>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;" placeholder="NUMERO O 'X'">
                    <button class="btn-x" onclick="skipTel()">X</button>
                </div>

                <span class="label">Indirizzo *</span>
                <input type="text" id="o-indirizzo" class="input-big" placeholder="VIA E CIVICO" oninput="validate()">
                
                <span class="label">Costo Consegna *</span>
                <div class="cost-grid">
                    <button class="btn-cost" id="c1" onclick="setCost(1)">1€</button>
                    <button class="btn-cost" id="c2" onclick="setCost(2)">2€</button>
                    <button class="btn-cost" id="c3" onclick="setCost(3)">3€</button>
                    <button class="btn-cost" id="c4" onclick="setCost(4)">4€</button>
                    <button class="btn-cost" id="c5" onclick="setCost(5)">5€</button>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><span class="label">Scala</span><input type="text" id="o-scala" class="input-big"></div>
                    <div><span class="label">Piano</span><input type="text" id="o-piano" class="input-big"></div>
                </div>

                <span class="label">Orario Consegna *</span>
                <select id="o-orario" class="input-big" onchange="validate()">
                    <option value="">-- : --</option>
                </select>

                <span class="label">Rider Preferito</span>
                <div style="display:flex; gap:10px;">
                    <button class="btn-rider" id="r-porpe" onclick="setRider('PORPE')">PORPE</button>
                    <button class="btn-rider" id="r-gaspare" onclick="setRider('GASPARE')">GASPARE</button>
                </div>
            </div>

            <div class="section" id="p2">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2 style="font-weight:900;">PIZZE</h2>
                    <button class="btn-gf-neon" onclick="insertGF()">+ GLUTEN FREE</button>
                </div>
                <div class="comanda-paper" id="comanda-box">
                    <div class="col-qty" id="col-q"></div>
                    <div class="col-gusto" id="col-g"></div>
                    <div class="col-prezzo" id="col-p"></div>
                </div>
                <div style="text-align:right; font-weight:900; font-size:1.6rem; margin-top:10px;">
                    Tot. Pizze ➔ <span id="tot-pizze-val">0,00 €</span>
                </div>
            </div>

            <div class="section" id="p3">
                <h2 style="font-weight:900; margin-bottom:15px;">CUCINA / ALTRO</h2>
                <p style="color:#999;">In attesa del tuo disegno per questa pagina...</p>
            </div>

            <div class="section" id="p4">
                <h2 style="font-weight:900; margin-bottom:15px;">RIEPILOGO</h2>
                <div id="check-list" style="background:white; padding:20px; border-radius:15px; color:#333; min-height:200px; margin-bottom:20px; font-weight:900;">
                    COMPILA I DATI OBBLIGATORI...
                </div>
                <button id="btn-invia" class="btn-rider" style="width:100%; height:80px; background:#ccc; color:white; cursor:not-allowed;" disabled>INVIA ORDINE</button>
            </div>
        </div>

        <div class="nav-dots">
            <div class="dot active" id="d1"></div><div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div><div class="dot" id="d4"></div>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "0508";
        let currentPin = "";
        let selectedCost = 0;
        let selectedRider = "";

        // --- PIN PAD LOGIC ---
        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++) {
            let btn = document.createElement('div'); btn.className = 'num-key'; btn.innerText = i;
            btn.onclick = () => pressKey(i.toString()); pad.appendChild(btn);
        }
        let empty = document.createElement('div'); pad.appendChild(empty);
        let zero = document.createElement('div'); zero.className = 'num-key'; zero.innerText = "0";
        zero.onclick = () => pressKey("0"); pad.appendChild(zero);

        function openPinPad() { document.getElementById('page-start').classList.remove('show'); document.getElementById('page-pin').classList.add('show'); }
        function pressKey(num) {
            if(currentPin.length < 4) { currentPin += num; updateDots(); }
            if(currentPin.length === 4) {
                if(currentPin === ADMIN_PIN) {
                    document.getElementById('page-pin').classList.remove('show');
                    document.getElementById('app-admin').classList.add('show');
                } else { alert("PIN ERRATO!"); resetPin(); }
            }
        }
        function updateDots() { for(let i=0; i<4; i++) { document.getElementById('dot-'+i).classList.toggle('active', i < currentPin.length); } }
        function resetPin() { currentPin = ""; updateDots(); }

        // --- QUADERNO PIZZE (18 RIGHE) ---
        const cq = document.getElementById('col-q'); const cg = document.getElementById('col-g'); const cp = document.getElementById('col-p');
        for(let i=0; i<18; i++) {
            let q = document.createElement('input'); q.className = 'line-input'; q.type = 'number'; q.id = `q-${i}`; q.placeholder="0";
            q.onkeydown = (e) => { if(e.key === ' ') { e.preventDefault(); document.getElementById(`g-${i}`).focus(); } };
            
            let g = document.createElement('input'); g.className = 'line-input'; g.id = `g-${i}`; g.placeholder="GUSTO...";
            g.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); if(i<17) document.getElementById(`q-${i+1}`).focus(); } };

            let p = document.createElement('input'); p.className = 'line-input'; p.type = 'number'; p.step = '0.01'; p.id = `p-${i}`; p.placeholder="0.00";
            p.oninput = () => calcTot();
            p.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); if(i<17) document.getElementById(`p-${i+1}`).focus(); } };

            cq.appendChild(q); cg.appendChild(g); cp.appendChild(p);
        }

        // --- ORARIO DINAMICO ---
        const selOra = document.getElementById('o-orario');
        selOra.addEventListener('mousedown', () => {
            if(selOra.options.length <= 1) {
                let now = new Date(); let cur = now.getHours() * 60 + now.getMinutes();
                let start = Math.ceil((cur + 15) / 15) * 15;
                if(start < 1080) start = 1080;
                for(let t=start; t<=1320; t+=15) {
                    let h = Math.floor(t/60); let m = t%60;
                    let s = `${h}:${m===0?'00':m}`;
                    let opt = document.createElement('option'); opt.value = s; opt.innerText = s;
                    selOra.appendChild(opt);
                }
            }
        });

        // --- FUNZIONI CONTROLLO ---
        function skipTel() { document.getElementById('o-tel').value = "NON RICHIESTO"; validate(); }
        function setCost(v) {
            selectedCost = v;
            document.querySelectorAll('.btn-cost').forEach(b => b.classList.toggle('active', b.id === 'c'+v));
            calcTot(); validate();
        }
        function setRider(n) {
            selectedRider = (selectedRider === n) ? "" : n;
            document.querySelectorAll('.btn-rider').forEach(b => b.classList.toggle('active', b.id === 'r-'+n.toLowerCase()));
        }
        function insertGF() {
            let act = document.activeElement;
            if(act.id && act.id.startsWith('g-')) {
                let idx = act.id.split('-')[1];
                if(!act.value.includes("[GF]")) act.value += " [GF]";
                act.classList.add('is-gf');
                document.getElementById(`p-${idx}`).classList.add('is-gf');
            }
        }
        function calcTot() {
            let pTot = 0; for(let i=0; i<18; i++) { pTot += parseFloat(document.getElementById(`p-${i}`).value) || 0; }
            document.getElementById('tot-pizze-val').innerText = pTot.toFixed(2).replace('.', ',') + " €";
            let finale = pTot + selectedCost;
            document.getElementById('main-total').innerText = finale.toFixed(2) + " €";
            validate();
        }
        function validate() {
            const cog = document.getElementById('o-cognome').value;
            const tel = document.getElementById('o-tel').value;
            const ind = document.getElementById('o-indirizzo').value;
            const ora = document.getElementById('o-orario').value;
            let pTot = 0; for(let i=0; i<18; i++) { pTot += parseFloat(document.getElementById(`p-${i}`).value) || 0; }
            const btn = document.getElementById('btn-invia');
            const ok = cog && tel && ind && ora && selectedCost > 0 && pTot > 0;
            if(ok) { btn.style.background = "#1B8A4A"; btn.disabled = false; btn.style.cursor = "pointer"; }
            else { btn.style.background = "#ccc"; btn.disabled = true; }
        }

        // --- SWIPE LOGIC ---
        const slider = document.getElementById('slider');
        slider.addEventListener('scroll', () => {
            let index = Math.round(slider.scrollLeft / window.innerWidth) + 1;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i+1 === index));
        });
    </script>
</body>
</html>
