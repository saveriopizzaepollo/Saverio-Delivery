<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; --ver: #1B8A4A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; font-weight: 900; }
        
        body { background: var(--blu); color: white; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }

        /* SCHERMATA START - CENTRATURA ASSOLUTA */
        .page-init { 
            position: fixed; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
            z-index: 2000; background: var(--blu); text-align: center;
        }
        .page-init.show { display: flex; }
        #title-main { font-size: 3rem; margin-bottom: 40px; width: 100%; text-align: center; }

        /* HEADER FISSO */
        .header-main { 
            position: fixed; top: 0; left: 0; right: 0; height: 75px;
            background: var(--blu); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000;
        }
        #main-total { color: var(--giallo); font-size: 2.2rem; }
        .order-tag { background: var(--ora); color: white; padding: 5px 12px; border-radius: 8px; font-size: 1.2rem; }

        /* BARRA NAVIGAZIONE */
        .nav-bar { 
            position: fixed; top: 75px; left: 0; right: 0; height: 60px;
            background: #f4f7f9; display: flex; padding: 5px; gap: 5px; z-index: 999;
        }
        .nav-btn { flex: 1; border: none; border-radius: 8px; background: #D0DCE8; color: var(--blu); font-size: 0.75rem; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { background: var(--ora); color: white; }

        /* AREA CONTENUTO */
        .content-area { 
            position: absolute; top: 135px; bottom: 0; left: 0; right: 0;
            overflow-y: auto; background: #f4f7f9; color: var(--blu); padding: 15px;
        }
        .tab-content { display: none; }
        .tab-content.show { display: block; }

        /* INPUT */
        .label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .input-big { width: 100%; padding: 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1.1rem; margin-bottom: 12px; outline: none; text-transform: uppercase; color: var(--blu); background: white; font-weight: 900; }

        /* QUADERNO PIZZE */
        .comanda-paper { 
            background: #FFF9E5; border: 2px solid var(--blu); border-radius: 10px; 
            display: grid; grid-template-columns: 50px 1fr 90px; overflow: hidden; width: 100%;
        }
        .col-qty { border-right: 1px solid #F0E6BC; display: flex; flex-direction: column; }
        .col-gusto { border-right: 2px solid var(--blu); display: flex; flex-direction: column; }
        .col-prezzo { background: white; display: flex; flex-direction: column; }
        .line-input { 
            height: 45px; border: none; border-bottom: 1px solid #F0E6BC; 
            background: transparent; font-size: 1.1rem; text-transform: uppercase; 
            padding: 5px; outline: none; color: var(--blu); font-weight: 900; 
        }
        .col-prezzo .line-input { text-align: right; padding-right: 8px; font-size: 1.1rem; color: var(--blu); }
        
        /* CLASSE GF VERDE - APPLICATA DA JAVASCRIPT */
        .is-gf { color: #00E676 !important; }

        /* PIN PAD */
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; cursor: pointer; }

        #riepilogo-box div { border-bottom: 1px solid #eee; padding: 5px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="page-start" class="page-init show">
        <h1 id="title-main">SAVERIO DELIVERY</h1>
        <button onclick="showPin()" style="padding:20px 40px; background:var(--ora); color:white; border:none; border-radius:15px; font-size:1.5rem; font-weight:900;">ADMIN LOGIN</button>
    </div>

    <div id="page-pin" class="page-init">
        <h2 style="margin-bottom:20px;">INSERISCI PIN</h2>
        <div id="pin-dots" style="display:flex; gap:15px; margin-bottom:30px;">
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-0"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-1"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-2"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
    </div>

    <div id="app-admin" style="display:none;">
        <div class="header-main">
            <span style="font-size:0.8rem;">SAVERIO DELIVERY</span>
            <div id="main-total">0,00 €</div>
            <div class="order-tag">#01</div>
        </div>
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-t1" onclick="showTab(1)">CLIENTE</button>
            <button class="nav-btn" id="btn-t2" onclick="showTab(2)">PIZZE</button>
            <button class="nav-btn" id="btn-t3" onclick="showTab(3)">POLLO/ALTRO</button>
            <button class="nav-btn" id="btn-t4" onclick="showTab(4)">RIEPILOGO</button>
        </div>
        <div class="content-area">
            <div id="tab1" class="tab-content show">
                <span class="label">COGNOME *</span>
                <input type="text" id="o-cognome" class="input-big" oninput="updateRiepilogo()">
                <span class="label">CELLULARE *</span>
                <div style="display:flex; gap:5px; margin-bottom:12px;">
                    <input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;">
                    <button style="width:50px; background:var(--rosso); color:white; border:none; border-radius:10px; font-weight:900; font-size:1.2rem;" onclick="skipTel()">X</button>
                </div>
                <span class="label">INDIRIZZO *</span>
                <input type="text" id="o-indirizzo" class="input-big" oninput="updateRiepilogo()">
                <button style="width:100%; padding:15px; background:#4285F4; color:white; border:none; border-radius:10px; margin-bottom:12px; font-weight:900;" onclick="verifyMaps()">📍 VERIFICA POSIZIONE</button>
                <span class="label">CONSEGNA *</span>
                <div style="display:grid; grid-template-columns: repeat(5,1fr); gap:5px; margin-bottom:12px;">
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost1" onclick="setCost(1)">1€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost2" onclick="setCost(2)">2€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost3" onclick="setCost(3)">3€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost4" onclick="setCost(4)">4€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost5" onclick="setCost(5)">5€</button>
                </div>
                <span class="label">ORARIO *</span>
                <select id="o-orario" class="input-big" onchange="updateRiepilogo()"><option value="">-- : --</option></select>
            </div>
            <div id="tab2" class="tab-content">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                    <h2 style="color:var(--blu);">PIZZE</h2>
                    <button style="background:var(--neon); color:var(--blu); border:none; padding:10px 15px; border-radius:8px; font-weight:900;" onclick="insertGF()">+ GLUTEN FREE</button>
                </div>
                <div class="comanda-paper" id="comanda-root">
                    <div class="col-qty" id="cq"></div>
                    <div class="col-gusto" id="cg"></div>
                    <div class="col-prezzo" id="cp"></div>
                </div>
                <div style="text-align:right; font-weight:900; font-size:1.6rem; margin-top:10px; color:var(--blu);">
                    TOT. PIZZE ➔ <span id="tot-pizze-val">0,00 €</span>
                </div>
            </div>
            <div id="tab3" class="tab-content"><h2>CUCINA</h2></div>
            <div id="tab4" class="tab-content">
                <h2>RIEPILOGO</h2>
                <div id="riepilogo-box" style="background:white; padding:15px; border-radius:10px; margin:15px 0; color:var(--blu); font-weight:900;"></div>
                <button id="btn-invia" style="width:100%; height:70px; background:#ccc; border:none; border-radius:15px; color:white; font-size:1.5rem; font-weight:900;" disabled>INVIA ORDINE</button>
            </div>
        </div>
    </div>

    <script>
        const PIN = "0508"; let currentPin = ""; let sCost = 0; let lastGustoId = null;

        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++){ let b=document.createElement('div'); b.className='num-key'; b.innerText=i; b.onclick=()=>pressPin(i); pad.appendChild(b); }
        let z=document.createElement('div'); z.className='num-key'; z.innerText="0"; z.style.gridColumnStart="2"; z.onclick=()=>pressPin(0); pad.appendChild(z);

        function showPin(){ document.getElementById('page-start').classList.remove('show'); document.getElementById('page-pin').classList.add('show'); }
        function pressPin(n){
            if(currentPin.length<4){ currentPin+=n; document.getElementById('dot-'+(currentPin.length-1)).style.background="var(--ora)";
            if(currentPin===PIN){ document.getElementById('page-pin').classList.remove('show'); document.getElementById('app-admin').style.display='block'; initApp(); }
            else if(currentPin.length===4){ alert("PIN ERRATO"); resetPin(); } }
        }
        function resetPin(){ currentPin=""; for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background="none"; }
        function showTab(n){ document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show')); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('tab'+n).classList.add('show'); document.getElementById('btn-t'+n).classList.add('active'); }

        function initApp(){
            const cq=document.getElementById('cq'), cg=document.getElementById('cg'), cp=document.getElementById('cp');
            if(cq.children.length>0) return;
            for(let i=0; i<18; i++){
                let q=document.createElement('input'); q.className='line-input'; q.type='number'; q.id=`q-${i}`;
                q.onkeydown=(e)=>{if(e.key===' '){e.preventDefault(); document.getElementById(`g-${i}`).focus();}};
                
                let g=document.createElement('input'); g.className='line-input'; g.id=`g-${i}`;
                g.onfocus=() => { lastGustoId = `g-${i}`; }; // Ricorda l'ultima riga toccata
                g.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault(); if(i<17) document.getElementById(`q-${i+1}`).focus();}};
                
                let p=document.createElement('input'); p.className='line-input'; p.type='number'; p.id=`p-${i}`;
                p.oninput=updateRiepilogo;
                p.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault(); if(i<17) document.getElementById(`q-${i+1}`).focus();}};
                
                cq.appendChild(q); cg.appendChild(g); cp.appendChild(p);
            }
            let sel=document.getElementById('o-orario');
            let now=new Date(); let m = Math.ceil((now.getHours()*60+now.getMinutes()+15)/15)*15;
            for(let t=Math.max(m,1080); t<=1320; t+=15){
                let time=`${Math.floor(t/60)}:${t%60===0?'00':t%60}`;
                let opt=document.createElement('option'); opt.value=time; opt.innerText=time; sel.appendChild(opt);
            }
        }

        function setCost(v){ sCost=v; document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white'); document.getElementById('cost'+v).style.background='var(--ora)'; updateRiepilogo(); }
        function skipTel(){ document.getElementById('o-tel').value="INTERNO"; updateRiepilogo(); }
        
        // FUNZIONE GLUTEN FREE - SEMPLICE E DIRETTA
        function insertGF(){ 
            if(!lastGustoId) return alert("TOCCA PRIMA LA RIGA DELLA PIZZA!");
            let rigaIdx = lastGustoId.split('-')[1];
            let inputGusto = document.getElementById(`g-${rigaIdx}`);
            let inputPrezzo = document.getElementById(`p-${rigaIdx}`);
            
            if(!inputGusto.value.includes("[GF]")) {
                inputGusto.value += " [GF]";
            }
            inputGusto.classList.add('is-gf');
            inputPrezzo.classList.add('is-gf');
            updateRiepilogo();
        }

        function updateRiepilogo(){
            let pt=0; let listHtml = "";
            for(let i=0; i<18; i++){
                let v = parseFloat(document.getElementById(`p-${i}`).value)||0;
                let g = document.getElementById(`g-${i}`).value;
                let q = document.getElementById(`q-${i}`).value;
                if(v>0 || g){ 
                    pt+=v; 
                    let coloreGf = document.getElementById(`g-${i}`).classList.contains('is-gf') ? 'color:#00E676;' : '';
                    listHtml += `<div style="${coloreGf}">${q}x ${g} - ${v.toFixed(2)}€</div>`; 
                }
            }
            let tot = pt + sCost;
            document.getElementById('main-total').innerText = tot.toFixed(2).replace('.',',') + " €";
            document.getElementById('tot-pizze-val').innerText = pt.toFixed(2).replace('.',',') + " €";
            
            let cog = document.getElementById('o-cognome').value;
            let ind = document.getElementById('o-indirizzo').value;
            let ora = document.getElementById('o-orario').value;
            
            document.getElementById('riepilogo-box').innerHTML = `
                <p>CLIENTE: ${cog}</p>
                <p>INDIRIZZO: ${ind}</p>
                <p>ORARIO: ${ora}</p><hr>
                ${listHtml} <hr>
                <p style="font-size:1.2rem; text-align:right;">TOTALE: ${tot.toFixed(2)}€</p>
            `;
            
            let ok = cog && ind && ora && sCost>0 && pt>0;
            let btn = document.getElementById('btn-invia');
            if(ok){ btn.style.background='var(--ver)'; btn.disabled=false; } else { btn.style.background='#ccc'; btn.disabled=true; }
        }

        function verifyMaps(){ let a=document.getElementById('o-indirizzo').value; if(!a) return alert("INSERISCI INDIRIZZO"); window.open(`comgooglemaps://?q=${encodeURIComponent(a)}`); }
    </script>
</body>
</html>
