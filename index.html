<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; --ver: #1B8A4A; --link: #007AFF; --bibite: #007AFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; font-weight: 900; }
        body { background: var(--blu); color: white; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
        .page-init { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 2000; background: var(--blu); text-align: center; }
        .page-init.show { display: flex; }
        .header-main { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--blu); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000; }
        #main-total { color: var(--giallo); font-size: 2.2rem; }
        .nav-bar { position: fixed; top: 75px; left: 0; right: 0; height: 60px; background: #f4f7f9; display: flex; padding: 5px; gap: 3px; z-index: 999; }
        .nav-btn { flex: 1; border: none; border-radius: 8px; background: #D0DCE8; color: var(--blu); font-size: 0.65rem; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { background: var(--ora); color: white; }
        .content-area { position: absolute; top: 135px; bottom: 0; left: 0; right: 0; overflow-y: auto; background: #f4f7f9; color: var(--blu); padding: 15px; }
        .tab-content { display: none; }
        .tab-content.show { display: block; }
        .input-big { width: 100%; padding: 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1.1rem; margin-bottom: 12px; outline: none; text-transform: uppercase; color: var(--blu); background: white; font-weight: 900; }
        .comanda-paper { background: #FFF9E5; border: 2px solid var(--blu); border-radius: 10px; overflow: hidden; width: 100%; display: table; border-collapse: collapse; }
        .row-piz { display: table-row; border-bottom: 1px solid #F0E6BC; }
        .cell-piz { display: table-cell; vertical-align: middle; padding: 5px; min-height: 50px; }
        .c-gf { width: 35px; text-align: center; }
        .c-tipo { width: 40px; text-align: center; border-left: 1px solid #ccc; }
        .c-qty { width: 50px; border-left: 1px solid #F0E6BC; border-right: 1px solid #F0E6BC; }
        .c-gusto { border-right: 2px solid var(--blu); }
        .c-prezzo { width: 90px; background: white; }
        .tipo-polleria { color: var(--rosso) !important; }
        .tipo-bibite { color: var(--bibite) !important; }
        .row-is-gf { background-color: #e8fff5 !important; color: #00E676 !important; }
        .gf-text { color: var(--ver) !important; }
        .btn-tipo-ciclo { width: 30px; height: 30px; border-radius: 5px; border: 2px solid #999; background: white; }
        .area-gusto { width: 100%; border: none; background: transparent; outline: none; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; color: inherit; resize: none; overflow: hidden; display: block; }
        .card-consegna { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 10px solid var(--blu); box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: var(--blu); }
        .card-header-main { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .card-list-wrapper.expanded .card-prod-row { font-size: 1.6rem; border-bottom: 1px solid #eee; padding: 4px 0; }
        .card-prod-row { display: flex; justify-content: space-between; font-size: 0.9rem; }
        .card-prod-desc { flex-grow: 1; text-transform: uppercase; white-space: normal; }
        .card-prod-val { width: 65px; text-align: right; font-weight: 700; }
        #map-container { width: 100%; height: calc(100vh - 220px); border-radius: 15px; border: 3px solid var(--blu); }
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="page-start" class="page-init show">
        <h1 style="font-size:3rem; margin-bottom:40px;">SAVERIO DELIVERY PRO</h1>
        <button onclick="showPin()" style="padding:20px 40px; background:var(--ora); color:white; border:none; border-radius:15px; font-size:1.5rem;">ADMIN LOGIN</button>
    </div>

    <div id="page-pin" class="page-init">
        <h2 style="margin-bottom:20px;">INSERISCI PIN</h2>
        <div id="pin-dots" style="display:flex; gap:15px; margin-bottom:30px;">
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-0"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-1"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-2"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
    </div>

    <div id="app-admin" style="display:none;">
        <div class="header-main">
            <span style="font-size:0.7rem;">SAVERIO PRO</span>
            <div id="main-total">0,00 €</div>
            <div id="header-tag">#01</div>
        </div>
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-t1" onclick="showTab(1)">CLIENTE</button>
            <button class="nav-btn" id="btn-t2" onclick="showTab(2)">ORDINE</button>
            <button class="nav-btn" id="btn-t4" onclick="showTab(4)">RIEPILOGO</button>
            <button class="nav-btn" id="btn-t5" onclick="showTab(5)">CONSEGNE</button>
            <button class="nav-btn" id="btn-t6" onclick="showTab(6)">MAPPA</button>
        </div>
        <div class="content-area">
            <div id="tab1" class="tab-content show">
                <input type="text" id="o-cognome" class="input-big" placeholder="👤 COGNOME" oninput="updateRiepilogo()">
                <div style="display:flex; gap:5px; margin-bottom:12px;">
                    <input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;" placeholder="📞 TELEFONO">
                    <button style="width:50px; background:var(--rosso); color:white; border:none; border-radius:10px;" onclick="document.getElementById('o-tel').value='INTERNO'">X</button>
                </div>
                <input type="text" id="o-indirizzo" class="input-big" placeholder="📍 INDIRIZZO" oninput="updateRiepilogo()">
                <input type="text" id="o-nota-cons" class="input-big" style="border-left:5px solid var(--ora)" placeholder="📝 NOTA CONSEGNA">
                <div style="display:grid; grid-template-columns: repeat(5,1fr); gap:5px; margin-bottom:12px;">
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost1" onclick="setCost(1)">1€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost2" onclick="setCost(2)">2€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost3" onclick="setCost(3)">3€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost4" onclick="setCost(4)">4€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost5" onclick="setCost(5)">5€</button>
                </div>
                <select id="o-orario" class="input-big" onchange="updateRiepilogo()"><option value="">🕒 ORARIO</option></select>
            </div>

            <div id="tab2" class="tab-content">
                <div class="comanda-paper" id="comanda-root"></div>
            </div>

            <div id="tab4" class="tab-content">
                <div id="riepilogo-box" style="background:white; padding:15px; border-radius:10px; margin-bottom:15px; color:var(--blu);"></div>
                <input type="text" id="o-nota-rip" class="input-big" style="border-left:5px solid var(--ora)" placeholder="📝 NOTA ORDINE">
                <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
                    <button class="nav-btn" id="p-cont" onclick="setPay('CONTANTI')">CONTANTI</button>
                    <button class="nav-btn" id="p-pos" onclick="setPay('POS')">POS</button>
                    <button class="nav-btn" id="p-pag" onclick="setPay('PAGATO')">PAGATO</button>
                </div>
                <input type="text" id="o-resto" class="input-big" style="margin-top:10px; display:none;" placeholder="RESTO DA...">
                <button id="btn-invia" style="width:100%; height:70px; background:#ccc; border:none; border-radius:15px; color:white; margin-top:15px;" disabled onclick="inviaOrdine()">INVIA ORDINE</button>
            </div>

            <div id="tab5" class="tab-content">
                <div id="consegne-lista"></div>
            </div>

            <div id="tab6" class="tab-content">
                <div id="map-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8sLce14ziVue7xxNKMB-biEqigutExwg",
            authDomain: "saverio-delivery-4c08d.firebaseapp.com",
            projectId: "saverio-delivery-4c08d",
            storageBucket: "saverio-delivery-4c08d.firebasestorage.app",
            messagingSenderId: "934725171509",
            appId: "1:934725171509:web:ca90ec436d96951e78f47c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // VARIABILI APP
        const PIN = "0508"; let cPin = ""; let sCost = 0; let sPay = ""; let editId = null;
        let ordiniLocali = []; let map = null; let markers = [];

        // PIN PAD
        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++){ let b=document.createElement('div'); b.className='num-key'; b.innerText=i; b.onclick=()=>pressPin(i); pad.appendChild(b); }
        let z=document.createElement('div'); z.className='num-key'; z.innerText="0"; z.style.gridColumnStart="2"; z.onclick=()=>pressPin(0); pad.appendChild(z);

        window.showPin = () => { document.getElementById('page-start').classList.remove('show'); document.getElementById('page-pin').classList.add('show'); };
        function pressPin(n){
            if(cPin.length<4){ cPin+=n; document.getElementById('dot-'+(cPin.length-1)).style.background="var(--ora)";
            if(cPin===PIN){ document.getElementById('page-pin').classList.remove('show'); document.getElementById('app-admin').style.display='block'; initApp(); }
            else if(cPin.length===4){ alert("PIN ERRATO"); cPin=""; for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background="none"; } }
        }

        // TABS
        window.showTab = (n) => {
            document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show'));
            document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('tab'+n).classList.add('show');
            document.getElementById('btn-t'+n).classList.add('active');
            if(n===6) loadMap();
        };

        // INIT APP
        function initApp(){
            const root = document.getElementById('comanda-root');
            if(root.children.length > 0) return;
            for(let i=0; i<25; i++){
                let row = document.createElement('div'); row.className = 'row-piz'; row.id = `row-${i}`;
                row.innerHTML = `<div class="cell-piz c-gf"><input type="checkbox" id="f-${i}" onchange="toggleGF(${i})"></div>
                    <div class="cell-piz c-tipo"><button class="btn-tipo-ciclo" id="bt-${i}" onclick="cicloTipo(${i})" data-tipo="0"></button></div>
                    <div class="cell-piz c-qty"><input type="text" style="width:100%; border:none; text-align:center;" id="q-${i}"></div>
                    <div class="cell-piz c-gusto"><textarea class="area-gusto" id="g-${i}" rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';updateRiepilogo()"></textarea></div>
                    <div class="cell-piz c-prezzo"><input type="number" style="width:100%; border:none; text-align:right;" id="p-${i}" oninput="updateRiepilogo()"></div>`;
                root.appendChild(row);
            }
            updateTimeSelect();
            listenOrders();
        }

        window.cicloTipo = (i) => {
            let b = document.getElementById(`bt-${i}`); let r = document.getElementById(`row-${i}`);
            let t = (parseInt(b.dataset.tipo) + 1) % 3; b.dataset.tipo = t;
            r.classList.remove('tipo-polleria', 'tipo-bibite'); b.style.background = 'white';
            if(t===1){ r.classList.add('tipo-polleria'); b.style.background = 'var(--rosso)'; }
            if(t===2){ r.classList.add('tipo-bibite'); b.style.background = 'var(--bibite)'; }
            updateRiepilogo();
        };

        function updateTimeSelect() {
            let sel=document.getElementById('o-orario'); sel.innerHTML = '<option value="">🕒 ORARIO</option>';
            for(let h=18; h<=22; h++) for(let m=0; m<60; m+=15) {
                let ts = `${h}:${m===0?'00':m}`; let opt = document.createElement('option'); opt.value=ts; opt.innerText=ts; sel.appendChild(opt);
            }
        }

        window.toggleGF = (i) => { document.getElementById(`row-${i}`).classList.toggle('row-is-gf'); updateRiepilogo(); };
        window.setCost = (v) => { sCost=v; document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white'); document.getElementById('cost'+v).style.background='var(--ora)'; updateRiepilogo(); };
        window.setPay = (t) => { sPay=t; document.querySelectorAll('[id^="p-"]').forEach(b=>b.style.background='#D0DCE8'); let k = t==='PAGATO'?'pag':t==='POS'?'pos':'cont'; document.getElementById('p-'+k).style.background='var(--ora)'; document.getElementById('o-resto').style.display = t==='CONTANTI'?'block':'none'; updateRiepilogo(); };

        window.updateRiepilogo = () => {
            let items = []; let pt = 0;
            for(let i=0; i<25; i++){
                let v = parseFloat(document.getElementById(`p-${i}`).value)||0; let g = document.getElementById(`g-${i}`).value;
                if(v>0 || g){ 
                    items.push({q:document.getElementById(`q-${i}`).value, g:g.toUpperCase(), v, gf:document.getElementById(`f-${i}`).checked, t:document.getElementById(`bt-${i}`).dataset.tipo});
                    pt += v;
                }
            }
            items.sort((a,b) => a.t - b.t);
            let tot = pt + sCost; document.getElementById('main-total').innerText = tot.toFixed(2) + " €";
            let cog = document.getElementById('o-cognome').value.toUpperCase();
            let ora = document.getElementById('o-orario').value;
            let ok = cog && ora && sCost>0 && pt>0 && sPay;
            document.getElementById('btn-invia').disabled = !ok; document.getElementById('btn-invia').style.background = ok ? 'var(--ver)' : '#ccc';
            
            document.getElementById('riepilogo-box').innerHTML = `<b>${ora} - ${cog}</b><br>${document.getElementById('o-indirizzo').value.toUpperCase()}<hr>` + 
                items.map(it => `<div style="color:${it.gf?'var(--ver)':it.t==='1'?'var(--rosso)':it.t==='2'?'var(--bibite)':'inherit'}">${it.gf?'[GF] ':''}${it.q} ${it.g} - ${it.v}€</div>`).join('') + `<hr>TOT: ${tot.toFixed(2)}€`;
        };

        // FIREBASE ACTIONS
        window.inviaOrdine = async () => {
            let items = []; let pt = 0;
            for(let i=0; i<25; i++){
                let v = parseFloat(document.getElementById(`p-${i}`).value)||0; let g = document.getElementById(`g-${i}`).value;
                if(v>0 || g) items.push({q:document.getElementById(`q-${i}`).value, g:g.toUpperCase(), v, gf:document.getElementById(`f-${i}`).checked, t:document.getElementById(`bt-${i}`).dataset.tipo});
            }
            items.sort((a,b) => a.t - b.t);
            const ord = {
                cog: document.getElementById('o-cognome').value.toUpperCase(),
                ind: document.getElementById('o-indirizzo').value.toUpperCase(),
                tel: document.getElementById('o-tel').value,
                ora: document.getElementById('o-orario').value,
                nota: document.getElementById('o-nota-cons').value.toUpperCase(),
                notaRip: document.getElementById('o-nota-rip').value.toUpperCase(),
                pay: sPay, resto: document.getElementById('o-resto').value,
                cost: sCost, items: items, tot: document.getElementById('main-total').innerText
            };

            // Geocoding
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ord.ind + ", Palermo")}`);
                const data = await res.json();
                if(data[0]) { ord.lat = data[0].lat; ord.lng = data[0].lon; }
            } catch(e){}

            if(editId) { await updateDoc(doc(db, "ordini", editId), ord); editId = null; }
            else { await addDoc(collection(db, "ordini"), ord); }
            resetForm(); showTab(5);
        };

        function resetForm(){
            document.getElementById('o-cognome').value=""; document.getElementById('o-indirizzo').value=""; document.getElementById('o-tel').value="";
            document.getElementById('o-nota-cons').value=""; document.getElementById('o-nota-rip').value=""; document.getElementById('o-orario').value="";
            sCost=0; sPay=""; editId=null; document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white');
            for(let i=0; i<25; i++){ 
                document.getElementById(`q-${i}`).value=""; document.getElementById(`g-${i}`).value=""; document.getElementById(`p-${i}`).value="";
                document.getElementById(`f-${i}`).checked=false; document.getElementById(`row-${i}`).className='row-piz';
                document.getElementById(`bt-${i}`).dataset.tipo="0"; document.getElementById(`bt-${i}`).style.background='white';
            }
            updateRiepilogo();
        }

        function listenOrders(){
            onSnapshot(query(collection(db, "ordini"), orderBy("ora")), (snap) => {
                ordiniLocali = [];
                const list = document.getElementById('consegne-lista'); list.innerHTML = "";
                snap.forEach(docSnap => {
                    const o = docSnap.data(); o.id = docSnap.id; ordiniLocali.push(o);
                    list.innerHTML += `
                        <div class="card-consegna">
                            <div class="card-header-main"><span class="card-ora-big">${o.ora}</span> <b>${o.cog}</b> 
                                <div><button onclick="editOrd('${o.id}')">✏️</button> <button onclick="delOrd('${o.id}')">🗑️</button></div>
                            </div>
                            <div style="font-size:1.1rem; margin:5px 0;">📍 ${o.ind} <br> 📞 ${o.tel}</div>
                            <div class="card-list-wrapper" onclick="this.classList.toggle('expanded')">
                                ${o.items.map(it => `<div class="card-prod-row" style="color:${it.gf?'var(--ver)':it.t==='1'?'var(--rosso)':it.t==='2'?'var(--bibite)':'inherit'}">
                                    <span class="card-prod-desc">${it.gf?'[GF] ':''}${it.q} ${it.g}</span><span class="card-prod-val">${it.v}€</span>
                                </div>`).join('')}
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:1.3rem;">
                                <span style="color:var(--ora)">${o.pay} ${o.resto?('('+o.resto+')'):''}</span> <b>${o.tot}</b>
                            </div>
                        </div>`;
                });
                if(map) updateMarkers();
            });
        }

        window.delOrd = async (id) => { if(confirm("Eliminare ordine?")) await deleteDoc(doc(db, "ordini", id)); };
        window.editOrd = (id) => {
            const o = ordiniLocali.find(x => x.id === id); editId = id; resetForm();
            document.getElementById('o-cognome').value = o.cog; document.getElementById('o-indirizzo').value = o.ind;
            document.getElementById('o-tel').value = o.tel; document.getElementById('o-orario').value = o.ora;
            document.getElementById('o-nota-cons').value = o.nota; document.getElementById('o-nota-rip').value = o.notaRip;
            setCost(o.cost); setPay(o.pay); document.getElementById('o-resto').value = o.resto||"";
            o.items.forEach((it, i) => {
                document.getElementById(`q-${i}`).value = it.q; document.getElementById(`g-${i}`).value = it.g;
                document.getElementById(`p-${i}`).value = it.v; document.getElementById(`f-${i}`).checked = it.gf;
                let b = document.getElementById(`bt-${i}`); b.dataset.tipo = it.t;
                let r = document.getElementById(`row-${i}`);
                if(it.t==='1'){ r.classList.add('tipo-polleria'); b.style.background = 'var(--rosso)'; }
                if(it.t==='2'){ r.classList.add('tipo-bibite'); b.style.background = 'var(--bibite)'; }
                if(it.gf) r.classList.add('row-is-gf');
            });
            showTab(1); updateRiepilogo();
        };

        // MAPPA
        function loadMap(){
            if(!map){
                map = L.map('map-container').setView([38.1157, 13.3615], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            }
            setTimeout(() => { map.invalidateSize(); updateMarkers(); }, 300);
        }

        function updateMarkers(){
            markers.forEach(m => map.removeLayer(m)); markers = [];
            ordiniLocali.forEach(o => {
                if(o.lat && o.lng){
                    let m = L.circleMarker([o.lat, o.lng], {radius:10, color: o.pay==='PAGATO'?'green':'red', fillOpacity:0.8})
                        .addTo(map).bindPopup(`<b>${o.ora} - ${o.cog}</b><br>${o.ind}`);
                    markers.push(m);
                }
            });
        }
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
