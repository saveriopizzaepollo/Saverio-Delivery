<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saverio Delivery Pro - FASE 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --ver: #1B8A4A; --ros: #C0392B; --gri: #F0F4F8; --bor: #D0DCE8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; }
        body { background: var(--gri); color: var(--blu); height: 100vh; overflow: hidden; }

        /* Schermate */
        .page { position: fixed; inset: 0; background: var(--blu); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .page.show { display: flex; }
        #app { display: none; flex-direction: column; height: 100vh; background: white; }
        #app.show { display: flex; }
        
        .hdr { background: var(--blu); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .cnt { flex: 1; overflow-y: auto; padding: 15px 15px 120px; }
        
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid var(--bor); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 99; }
        .ni { flex: 1; padding: 15px 5px; text-align: center; background: none; border: none; color: #aaa; font-weight: 900; font-size: 0.7rem; text-transform: uppercase; }
        .ni.active { color: var(--blu); border-top: 5px solid var(--ora); }

        /* Card con Testo Grande */
        .card { background: white; border: 2px solid var(--bor); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .c-cog { font-size: 2.2rem; font-weight: 900; display: block; line-height: 1; text-transform: uppercase; }
        .c-ind { font-size: 1.5rem; font-weight: 700; color: #555; display: block; margin-top: 5px; }
        .stit { font-size: 0.8rem; font-weight: 900; color: var(--blu); margin: 20px 0 10px; border-left: 5px solid var(--ora); padding-left: 10px; text-transform: uppercase; }

        /* Bottoni */
        .btn-act { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; color: white; margin-top: 10px; }
        .btn-ora { background: var(--ora); }
        .btn-ver { background: var(--ver); }
    </style>
</head>
<body>

<div id="loading" class="page show">
    <div style="font-size:2.5rem; font-weight:900; color:white; text-align:center">SAVERIO<br>DELIVERY PRO</div>
</div>

<div id="login" class="page">
    <button class="btn-act btn-ora" style="max-width:300px" onclick="login('admin')">ENTRA COME ADMIN</button>
    <button class="btn-act" style="background:#2B5F8E; max-width:300px" onclick="login('dispatch')">ENTRA COME BANCO</button>
</div>

<div id="app">
    <div class="hdr">
        <span id="user-role" style="font-weight:900">SAVERIO DELIVERY</span>
        <button onclick="location.reload()" style="background:none; border:1px solid white; color:white; padding:4px 10px; border-radius:10px; font-size:0.7rem">ESCI</button>
    </div>

    <div class="cnt">
        <div id="sec-ordine" class="section">
            <h2 style="margin-bottom:15px">NUOVO ORDINE</h2>
            <input type="text" id="o-cog" style="width:100%; padding:15px; font-size:1.5rem; margin-bottom:10px; border-radius:10px; border:2px solid #ccc" placeholder="COGNOME">
            <input type="text" id="o-ind" style="width:100%; padding:15px; font-size:1.2rem; margin-bottom:10px; border-radius:10px; border:2px solid #ccc" placeholder="INDIRIZZO">
            <button class="btn-act btn-ora" onclick="inviaTest()">PROVA INVIO IN PREPARAZIONE</button>
        </div>

        <div id="sec-ordini" class="section" style="display:none">
            <div class="stit">1. In Preparazione</div>
            <div id="l-preparazione"></div>
            <div class="stit">2. Pronti</div>
            <div id="l-pronto"></div>
            <div class="stit">3. In Consegna</div>
            <div id="l-viaggio"></div>
            <div class="stit">4. Consegnati</div>
            <div id="l-consegnati"></div>
        </div>
    </div>

    <nav class="nav" id="main-nav"></nav>
</div>

<script>
    // Configurazione Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAo035WkqlCOjkS8FeZSIQ-ZNIG5olL_Nw",
        databaseURL: "https://saverio-delivery-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "saverio-delivery",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let userRole = '';

    window.onload = () => {
        setTimeout(() => { document.getElementById('loading').classList.remove('show'); document.getElementById('login').classList.add('show'); }, 1000);
    };

    function login(role) {
        userRole = role;
        document.getElementById('login').classList.remove('show');
        document.getElementById('app').classList.add('show');
        document.getElementById('user-role').innerText = role.toUpperCase();
        
        const nav = document.getElementById('main-nav');
        nav.innerHTML = `
            <button class="ni active" id="n-ordine" onclick="vai('ordine')">NUOVO ORDINE</button>
            <button class="ni" id="n-ordini" onclick="vai('ordini')">ORDINI</button>
        `;
        ascoltaDatabase();
    }

    function vai(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById('sec-' + id).style.display = 'block';
        document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
        document.getElementById('n-' + id).classList.add('active');
    }

    function inviaTest() {
        const cog = document.getElementById('o-cog').value;
        const ind = document.getElementById('o-ind').value;
        if(!cog || !ind) return alert("Inserisci i dati!");
        
        db.ref('ordini').push({
            cognome: cog.toUpperCase(),
            indirizzo: ind.toUpperCase(),
            stato: 'preparazione',
            timestamp: Date.now()
        });
        document.getElementById('o-cog').value = '';
        document.getElementById('o-ind').value = '';
        alert("Ordine inviato!");
    }

    function ascoltaDatabase() {
        db.ref('ordini').on('value', snap => {
            const data = snap.val();
            const lists = { preparazione: 'l-preparazione', pronto: 'l-pronto', viaggio: 'l-viaggio', consegnati: 'l-consegnati' };
            Object.values(lists).forEach(id => document.getElementById(id).innerHTML = '');

            for(let id in data) {
                const o = data[id];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span class="c-cog">${o.cognome}</span><span class="c-ind">${o.indirizzo}</span>`;
                
                if(o.stato === 'preparazione') {
                    card.innerHTML += `<button class="btn-act btn-ver" onclick="cambiaStato('${id}', 'pronto')">PRONTO ✅</button>`;
                    document.getElementById('l-preparazione').appendChild(card);
                } else if(o.stato === 'pronto') {
                    card.innerHTML += `<button class="btn-act" style="background:var(--blu2)" onclick="cambiaStato('${id}', 'viaggio')">AFFIDA A RIDER 🛵</button>`;
                    document.getElementById('l-pronto').appendChild(card);
                } else if(o.stato === 'viaggio') {
                    card.innerHTML += `<button class="btn-act btn-ora" onclick="cambiaStato('${id}', 'consegnati')">CONSEGNATO 🏁</button>`;
                    document.getElementById('l-viaggio').appendChild(card);
                } else {
                    document.getElementById('l-consegnati').appendChild(card);
                }
            }
        });
    }

    function cambiaStato(id, nuovo) { db.ref('ordini/' + id).update({ stato: nuovo }); }
</script>
</body>
</html>
