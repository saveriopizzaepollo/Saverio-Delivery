<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --neon: #39FF14; --bor: #D0DCE8; --rosso: #FF4444; --ver: #1B8A4A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; font-weight: 900; }
        body { background: var(--blu); color: white; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
        .page-init { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 2000; background: var(--blu); text-align: center; }
        .page-init.show { display: flex; }
        .header-main { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--blu); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000; }
        #main-total { color: var(--giallo); font-size: 2.2rem; }
        .nav-bar { position: fixed; top: 75px; left: 0; right: 0; height: 60px; background: #f4f7f9; display: flex; padding: 5px; gap: 5px; z-index: 999; }
        .nav-btn { flex: 1; border: none; border-radius: 8px; background: #D0DCE8; color: var(--blu); font-size: 0.9rem; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { background: var(--ora); color: white; }
        .content-area { position: absolute; top: 135px; bottom: 0; left: 0; right: 0; overflow-y: auto; background: #f4f7f9; color: var(--blu); padding: 15px; }
        .tab-content { display: none; }
        .tab-content.show { display: block; }
        .input-big { width: 100%; padding: 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1.1rem; margin-bottom: 12px; outline: none; text-transform: uppercase; color: var(--blu); background: white; font-weight: 900; }
        .comanda-paper { background: #FFF9E5; border: 2px solid var(--blu); border-radius: 10px; overflow: hidden; width: 100%; display: table; border-collapse: collapse; }
        .row-piz { display: table-row; border-bottom: 1px solid #F0E6BC; }
        .cell-piz { display: table-cell; vertical-align: middle; padding: 5px; min-height: 50px; }
        .c-gf { width: 40px; text-align: center; background: #eee; }
        .c-qty { width: 50px; border-left: 1px solid #F0E6BC; border-right: 1px solid #F0E6BC; }
        .c-gusto { border-right: 2px solid var(--blu); }
        .c-prezzo { width: 90px; background: white; }
        .area-gusto { width: 100%; border: none; background: transparent; outline: none; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; color: inherit; resize: none; overflow: hidden; display: block; line-height: 1.2; }
        .input-piz { width: 100%; border: none; background: transparent; outline: none; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; color: inherit; text-align: center; }
        .input-prezzo { width: 100%; border: none; background: transparent; outline: none; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; color: inherit; text-align: right; }
        .row-is-gf { background-color: #e8fff5 !important; color: #00E676 !important; }
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; cursor: pointer; }
        .rip-row-top { font-size: 1.6rem; color: var(--ora); margin-bottom: 10px; display: flex; gap: 20px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .rip-row-client { font-size: 1.3rem; color: var(--blu); margin-bottom: 15px; line-height: 1.4; }
        .pizza-item { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 1.2rem; }
        .pizza-qty { width: 40px; color: var(--blu); flex-shrink: 0; }
        .pizza-desc { flex-grow: 1; text-transform: uppercase; line-height: 1.1; }
        .pizza-price { width: 80px; text-align: right; color: #555; flex-shrink: 0; }
        .gf-text { color: var(--ver); }
        .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .pay-note-big { font-size: 1.6rem; font-weight: 900; text-align: right; margin-top: 8px; text-transform: uppercase; }
        .note-field { border-left: 5px solid var(--ora) !important; background: #fffcf0 !important; }
        
        /* Allineamento motorino a destra */
        .rip-costo-riga { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div id="page-start" class="page-init show">
        <h1 style="font-size:3.5rem; margin-bottom:40px;">SAVERIO DELIVERY</h1>
        <button onclick="showPin()" style="padding:20px 40px; background:var(--ora); color:white; border:none; border-radius:15px; font-size:1.5rem;">ADMIN LOGIN</button>
    </div>

    <div id="page-pin" class="page-init">
        <h2 style="margin-bottom:20px;">INSERISCI PIN</h2>
        <div id="pin-dots" style="display:flex; gap:15px; margin-bottom:30px;">
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-0"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-1"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-2"></div>
            <div style="width:18px; height:18px; border:2px solid white; border-radius:50%;" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
    </div>

    <div id="app-admin" style="display:none;">
        <div class="header-main">
            <span style="font-size:0.8rem;">SAVERIO DELIVERY</span>
            <div id="main-total">0,00 €</div>
            <div class="order-tag" id="header-tag">#01</div>
        </div>
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-t1" onclick="showTab(1)">CLIENTE</button>
            <button class="nav-btn" id="btn-t2" onclick="showTab(2)">ORDINE</button>
            <button class="nav-btn" id="btn-t4" onclick="showTab(4)">RIEPILOGO</button>
        </div>
        <div class="content-area">
            <div id="tab1" class="tab-content show">
                <input type="text" id="o-cognome" class="input-big" placeholder="👤 COGNOME" oninput="updateRiepilogo()">
                <div style="display:flex; gap:5px; margin-bottom:12px;">
                    <input type="text" id="o-tel" class="input-big" style="flex:1; margin-bottom:0;" placeholder="📞 TELEFONO">
                    <button style="width:50px; background:var(--rosso); color:white; border:none; border-radius:10px;" onclick="skipTel()">X</button>
                </div>
                <input type="text" id="o-indirizzo" class="input-big" placeholder="📍 INDIRIZZO" oninput="updateRiepilogo()">
                <input type="text" id="o-nota-cons" class="input-big note-field" placeholder="📝 NOTA CONSEGNA (ES. CITOFONO/PIANO)" oninput="updateRiepilogo()">
                <button id="btn-maps" style="width:100%; padding:15px; background:#4285F4; color:white; border:none; border-radius:10px; margin-bottom:12px;" onclick="verifyMaps()">📍 VERIFICA POSIZIONE</button>
                <div style="display:grid; grid-template-columns: repeat(5,1fr); gap:5px; margin-bottom:12px;">
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost1" onclick="setCost(1)">1€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost2" onclick="setCost(2)">2€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost3" onclick="setCost(3)">3€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost4" onclick="setCost(4)">4€</button>
                    <button class="nav-btn" style="background:white; border:2px solid var(--blu);" id="cost5" onclick="setCost(5)">5€</button>
                </div>
                <select id="o-orario" class="input-big" onchange="updateRiepilogo()"><option value="">🕒 ORARIO CONSEGNA</option></select>
            </div>

            <div id="tab2" class="tab-content">
                <h2 style="color:var(--blu); margin-bottom:10px;">LISTA ORDINE</h2>
                <div class="comanda-paper" id="comanda-root"></div>
            </div>

            <div id="tab4" class="tab-content">
                <h2>RIEPILOGO</h2>
                <div id="riepilogo-box" style="background:white; padding:15px; border-radius:10px; margin-bottom:15px; color:var(--blu);"></div>
                <input type="text" id="o-nota-rip" class="input-big note-field" placeholder="📝 NOTA ORDINE (ES. AGGIUNTE PARTICOLARI)" oninput="updateRiepilogo()">
                <div class="pay-grid">
                    <button class="nav-btn" id="p-cont" onclick="setPay('CONTANTI')">CONTANTI</button>
                    <button class="nav-btn" id="p-pos" onclick="setPay('POS')">POS</button>
                    <button class="nav-btn" id="p-pag" onclick="setPay('PAGATO')">PAGATO</button>
                </div>
                <div id="resto-box" style="display:none; margin-top:10px;">
                    <input type="text" id="o-resto" class="input-big" placeholder="ES: RESTO DA 50€" oninput="updateRiepilogo()">
                </div>
                <button id="btn-invia" style="width:100%; height:70px; background:#ccc; border:none; border-radius:15px; color:white; margin-top:15px;" disabled>INVIA ORDINE</button>
            </div>
        </div>
    </div>

    <script>
        const PIN = "0508"; let cPin = ""; let sCost = 0; let sPay = "";
        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++){ let b=document.createElement('div'); b.className='num-key'; b.innerText=i; b.onclick=()=>pressPin(i); pad.appendChild(b); }
        let z=document.createElement('div'); z.className='num-key'; z.innerText="0"; z.style.gridColumnStart="2"; z.onclick=()=>pressPin(0); pad.appendChild(z);

        function showPin(){ document.getElementById('page-start').classList.remove('show'); document.getElementById('page-pin').classList.add('show'); }
        function pressPin(n){
            if(cPin.length<4){ cPin+=n; document.getElementById('dot-'+(cPin.length-1)).style.background="var(--ora)";
            if(cPin===PIN){ document.getElementById('page-pin').classList.remove('show'); document.getElementById('app-admin').style.display='block'; initApp(); }
            else if(cPin.length===4){ alert("PIN ERRATO"); resetPin(); } }
        }
        function resetPin(){ cPin=""; for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background="none"; }
        function showTab(n){ document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show')); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('tab'+n).classList.add('show'); document.getElementById('btn-t'+n).classList.add('active'); updateRiepilogo(); }

        function initApp(){
            const root = document.getElementById('comanda-root');
            if(root.children.length > 0) return;
            for(let i=0; i<25; i++){
                let row = document.createElement('div'); row.className = 'row-piz'; row.id = `row-${i}`;
                row.innerHTML = `<div class="cell-piz c-gf"><input type="checkbox" class="check-gf" id="f-${i}" onchange="toggleGF(${i})"></div><div class="cell-piz c-qty"><input type="text" class="input-piz" id="q-${i}" onkeydown="goGusto(event, ${i})"></div><div class="cell-piz c-gusto"><textarea class="area-gusto" id="g-${i}" rows="1" oninput="autoExpand(this)" onkeydown="goNext(event, ${i})"></textarea></div><div class="cell-piz c-prezzo"><input type="number" class="input-prezzo" id="p-${i}" oninput="updateRiepilogo()" onkeydown="goPrezzoNext(event, ${i})"></div>`;
                root.appendChild(row);
            }
            let sel=document.getElementById('o-orario');
            let now=new Date(); let m = Math.ceil((now.getHours()*60+now.getMinutes()+15)/15)*15;
            for(let t=Math.max(m,1080); t<=1320; t+=15){
                let opt=document.createElement('option'); let time=`${Math.floor(t/60)}:${t%60===0?'00':t%60}`; opt.value=time; opt.innerText=time; sel.appendChild(opt);
            }
        }

        function autoExpand(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; updateRiepilogo(); }
        function goGusto(e, i) { if(e.key === ' ') { e.preventDefault(); document.getElementById(`g-${i}`).focus(); } }
        function goNext(e, i) { if(e.key === 'Enter') { e.preventDefault(); if(i<24) document.getElementById(`q-${i+1}`).focus(); } }
        function goPrezzoNext(e, i) { if(e.key === 'Enter') { e.preventDefault(); if(i<24) document.getElementById(`p-${i+1}`).focus(); } }

        function toggleGF(i){ let isChecked = document.getElementById(`f-${i}`).checked; document.getElementById(`row-${i}`).classList.toggle('row-is-gf', isChecked); updateRiepilogo(); }
        function setCost(v){ sCost=v; document.querySelectorAll('[id^="cost"]').forEach(b=>b.style.background='white'); document.getElementById('cost'+v).style.background='var(--ora)'; updateRiepilogo(); }
        function setPay(t){ sPay=t; document.querySelectorAll('[id^="p-"]').forEach(b=>b.style.background='#D0DCE8'); let k = t === 'PAGATO' ? 'pag' : t === 'CONTANTI' ? 'cont' : 'pos'; document.getElementById('p-'+k).style.background='var(--ora)'; document.getElementById('resto-box').style.display = (t==='CONTANTI') ? 'block' : 'none'; updateRiepilogo(); }
        function skipTel(){ document.getElementById('o-tel').value="INTERNO"; updateRiepilogo(); }

        function updateRiepilogo(){
            let pt=0; let lHtml = "";
            for(let i=0; i<25; i++){
                let v = parseFloat(document.getElementById(`p-${i}`).value)||0; let g = document.getElementById(`g-${i}`).value; let q = document.getElementById(`q-${i}`).value || "0"; let isGf = document.getElementById(`f-${i}`).checked;
                if(v>0 || g.trim() !== ""){ pt+=v; let gfTag = isGf ? '<span class="gf-text">GLUTEN FREE </span>' : ''; let itemClass = isGf ? 'gf-text' : '';
                    lHtml += `<div class="pizza-item ${itemClass}"><div class="pizza-qty">${q}</div><div class="pizza-desc">${gfTag}${g.toUpperCase()}</div><div class="pizza-price">${v.toFixed(2)}€</div></div>`;
                }
            }
            let tot = pt + sCost; document.getElementById('main-total').innerText = tot.toFixed(2).replace('.',',') + " €";
            let nOrd = document.getElementById('header-tag').innerText;
            let cog = document.getElementById('o-cognome').value.toUpperCase(); 
            let ind = document.getElementById('o-indirizzo').value.toUpperCase(); 
            let tel = document.getElementById('o-tel').value.toUpperCase();
            let nCo = document.getElementById('o-nota-cons').value.toUpperCase();
            let nRi = document.getElementById('o-nota-rip').value.toUpperCase();
            let ora = document.getElementById('o-orario').value; 
            let res = document.getElementById('o-resto').value.toUpperCase();
            
            let pL = ""; 
            if(sPay === 'CONTANTI' && res) { pL = `<div class="pay-note-big" style="color:var(--blu);">${res}</div>`; } 
            else if(sPay === 'POS') { pL = `<div class="pay-note-big" style="color:var(--rosso);">POS</div>`; } 
            else if(sPay === 'PAGATO') { pL = `<div class="pay-note-big" style="color:var(--ver);">PAGATO</div>`; }

            document.getElementById('riepilogo-box').innerHTML = `
                <div class="rip-row-top"><span>🏷️ ${nOrd}</span> <span>🕒 ${ora||"--:--"}</span></div>
                <div class="rip-row-client">
                    👤 <b>${cog||"---"}</b><br>
                    📍 <b>${ind||"---"}</b><br>
                    ${nCo ? `<small>📝 ${nCo}</small><br>` : ''}
                    📞 <b>${tel||"---"}</b><br>
                    <div class="rip-costo-riga"><span></span> <span style="width:80px; text-align:right;">🛵 <b>${sCost.toFixed(2)}€</b></span></div>
                </div>
                <div style="margin-top:10px; border-top:2px solid #333; padding-top:10px;">${lHtml}</div>
                ${nRi ? `<div style="background:#fff9e5; padding:8px; border-left:4px solid var(--ora); margin-top:10px; font-size:0.9rem;">📝 ${nRi}</div>` : ''}
                <div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                    <div style="text-align:right; color:var(--ora); font-size:1.6rem;"><b>TOTALE: ${tot.toFixed(2)}€</b></div>
                    ${pL}
                </div>`;
            let ok = cog && ind && ora && sCost>0 && pt>0 && sPay;
            document.getElementById('btn-invia').style.background = ok ? 'var(--ver)' : '#ccc'; document.getElementById('btn-invia').disabled = !ok;
        }

        function verifyMaps(){ let a=document.getElementById('o-indirizzo').value; if(!a) return alert("METTI INDIRIZZO"); window.open(`comgooglemaps://?q=${encodeURIComponent(a)}`); document.getElementById('btn-maps').style.background="var(--ver)"; document.getElementById('btn-maps').innerText="📍 POSIZIONE VERIFICATA"; }
    </script>
</body>
</html>
