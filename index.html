<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Saverio Delivery">
    <meta name="theme-color" content="#1A3A5C">
    <title>Saverio Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root{--blu:#1A3A5C;--blu2:#2B5F8E;--arancione:#E8600A;--verde:#1B8A4A;--rosso:#C0392B;--giallo:#D4A017;--grigio:#F0F4F8;--bordo:#D0DCE8;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;background:#fff;font-family:'Barlow',sans-serif;color:var(--blu);overflow:hidden;}
        
        /* Layout */
        #loading{position:fixed;inset:0;background:var(--blu);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
        .logo{font-size:2.2rem;font-weight:900;color:white;letter-spacing:.2em;text-align:center;line-height:1.2;}
        .spinner{width:44px;height:44px;border:5px solid rgba(255,255,255,.15);border-top-color:var(--arancione);border-radius:50%;animation:spin .8s linear infinite;margin-top:2rem;}
        @keyframes spin{to{transform:rotate(360deg);}}

        /* Login & UI */
        #login, #rider-lista, #pin, #primo{position:fixed;inset:0;background:var(--blu);display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;z-index:100;}
        #login.show, #rider-lista.show, #pin.show, #primo.show{display:flex;}
        .lbtn{width:100%;max-width:320px;padding:1.3rem;border-radius:18px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-size:1.15rem;font-weight:900;color:white;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:10px;}
        .ba{background:#1A3A5C;border:2px solid rgba(255,255,255,.2);}
        .bd{background:#2B5F8E;}
        .br{background:#E8600A;}
        
        /* App Structure */
        #app{display:none;height:100vh;flex-direction:column;}
        #app.show{display:flex;}
        .hdr{background:var(--blu);color:white;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;flex-shrink:0;}
        .cnt{flex:1;overflow-y:auto;padding:1rem 1rem 100px;}
        .section{display:none;}
        .section.active{display:block;}
        
        /* Forms */
        .form-group{margin-bottom:1rem;}
        .form-label{display:block;font-weight:900;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--blu2);margin-bottom:.4rem;}
        .form-input, .form-select{width:100%;padding:.85rem 1rem;background:var(--grigio);border:2px solid var(--bordo);border-radius:12px;font-family:'Barlow',sans-serif;font-size:.95rem;font-weight:700;color:var(--blu);outline:none;}
        .stit{font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--blu2);margin-bottom:.75rem;margin-top:1.2rem;}
        
        /* Cards & Lists */
        .ordine-card{background:white;border:2px solid var(--bordo);border-radius:16px;padding:1rem;margin-bottom:1rem;}
        .tag-stato{display:inline-block;padding:2px 8px;border-radius:6px;font-size:0.7rem;font-weight:900;text-transform:uppercase;margin-bottom:8px;}
        .s-cucina{background:#E8F4FD;color:#2B5F8E;}
        .s-pronto{background:#E8F8F0;color:#1B8A4A;}

        /* Nav */
        .nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid var(--bordo);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;}
        .ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px;border:none;background:none;color:#aaa;gap:2px;}
        .ni.active{color:var(--blu);}
        
        /* PIN & dots */
        .pdots{display:flex;gap:1rem;margin-bottom:2rem;}
        .dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);}
        .dot.on{background:var(--arancione);border-color:var(--arancione);}
        .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
        .key{width:70px;height:70px;border-radius:15px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;font-size:1.5rem;font-weight:900;}

        /* Utilities */
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--blu);color:white;padding:10px 20px;border-radius:20px;font-size:0.8rem;font-weight:900;opacity:0;transition:0.3s;z-index:1000;}
        .toast.show{opacity:1;}
        .btn-primary{width:100%;padding:1rem;background:var(--arancione);border:none;border-radius:14px;color:white;font-weight:900;margin-top:10px;}
        .autocomplete{background:white;border:2px solid var(--blu2);border-radius:12px;display:none;margin-top:-10px;margin-bottom:15px;z-index:10;}
        .ac-item{padding:10px;border-bottom:1px solid var(--bordo);font-size:0.9rem;}
    </style>
</head>
<body>

<div id="loading">
    <div class="logo">SAVERIO<br>DELIVERY</div>
    <div class="spinner"></div>
</div>

<div id="login">
    <div class="logo" style="margin-bottom:40px">SAVERIO<br>DELIVERY</div>
    <button class="lbtn ba" onclick="avviaLogin('admin','ADMIN')">🔑 ADMIN</button>
    <button class="lbtn bd" onclick="avviaLogin('dispatch','DISPATCH')">📦 DISPATCH</button>
    <button class="lbtn br" onclick="apriRider()">🛵 RIDERS</button>
</div>

<div id="pin">
    <div style="color:white;font-weight:900;margin-bottom:10px" id="pnome"></div>
    <div class="pdots">
        <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="kpad">
        <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button>
        <button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button>
        <button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button>
        <button class="key" style="background:none;border:none"></button><button class="key" onclick="k('0')">0</button><button class="key" onclick="kd()">⌫</button>
    </div>
    <button class="btn-primary" style="background:none; border:1px solid white; margin-top:20px" onclick="mostraLogin()">ANNULLA</button>
</div>

<div id="app">
    <div class="hdr">
        <div class="htit">SAVERIO DELIVERY</div>
        <button onclick="logout()" style="background:none; border:1px solid white; color:white; padding:4px 10px; border-radius:10px; font-size:0.6rem">ESCI</button>
    </div>

    <div class="cnt">
        <div id="sec-ordine" class="section active">
            <div class="stit">CLIENTE</div>
            <div class="form-group">
                <input class="form-input" type="text" id="cerca-cl" placeholder="Cerca cliente..." oninput="cercaCliente(this.value)">
                <div class="autocomplete" id="autocomplete"></div>
            </div>
            <div class="form-group"><input class="form-input" type="text" id="o-cognome" placeholder="Cognome"></div>
            <div class="form-group"><input class="form-input" type="text" id="o-indirizzo" placeholder="Indirizzo (Via e Civico)"></div>
            <button class="lbtn bd" style="padding:10px; font-size:0.8rem" onclick="apriMappaSupporto()">📍 VEDI SU MAPPA</button>
            
            <div class="stit">ZONA E CONSEGNA</div>
            <div class="form-group">
                <select class="form-select" id="o-zona" onchange="cambiaZona()">
                    <option value="" data-costo="0">-- SELEZIONA ZONA --</option>
                    <option value="centro" data-costo="1">🔴 CENTRO (€1.00)</option>
                    <option value="periferia" data-costo="2">🔵 PERIFERIA (€2.00)</option>
                    <option value="extra" data-costo="3">🔵 EXTRAURBANO (€3.00)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">COSTO DOMICILIO (€)</label>
                <input class="form-input" type="number" id="o-costo-dom" step="0.50" value="0.00" oninput="aggiornaTotali()">
            </div>

            <div class="stit">PRODOTTI</div>
            <div id="prodotti-box"></div>
            <button class="lbtn ba" style="padding:10px; font-size:0.8rem; margin-top:10px" onclick="aggiungiProdotto()">+ AGGIUNGI PRODOTTO</button>

            <div style="margin-top:20px; background:var(--grigio); padding:15px; border-radius:15px">
                <div style="display:flex; justify-content:space-between"><span>Prodotti:</span><span id="sub-prod">€0.00</span></div>
                <div style="display:flex; justify-content:space-between"><span>Consegna:</span><span id="sub-cons">€0.00</span></div>
                <hr style="margin:10px 0; border:0; border-top:1px solid #ccc">
                <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.2rem"><span>TOTALE:</span><span id="sub-tot">€0.00</span></div>
            </div>
            
            <button class="btn-primary" onclick="inviaOrdine()">📤 INVIA IN CUCINA</button>
        </div>

        <div id="sec-cucina" class="section">
            <div class="stit">ORDINI IN PREPARAZIONE</div>
            <div id="lista-cucina"></div>
        </div>

        <div id="sec-clienti" class="section">
            <div class="stit">RUBRICA CLIENTI</div>
            <div id="lista-clienti"></div>
        </div>
    </div>

    <nav class="nav" id="nav-bar">
        <button class="ni active" onclick="mostraSezione('ordine')"><span>🆕</span><br>ORDINE</button>
        <button class="ni" onclick="mostraSezione('cucina')"><span>🍳</span><br>CUCINA</button>
        <button class="ni" onclick="mostraSezione('clienti')"><span>👥</span><br>CLIENTI</button>
    </nav>
</div>

<div class="toast" id="toast"></div>

<script>
    // Configurazione Firebase (usa la tua)
    var cfg={apiKey:"AIzaSyAo035WkqlCOjkS8FeZSIQ-ZNIG5olL_Nw",authDomain:"saverio-delivery.firebaseapp.com",databaseURL:"https://saverio-delivery-default-rtdb.europe-west1.firebasedatabase.app",projectId:"saverio-delivery",storageBucket:"saverio-delivery.firebasestorage.app",messagingSenderId:"913928598350",appId:"1:913928598350:web:98489624879baabe27241f"};
    firebase.initializeApp(cfg);
    var db = firebase.database();

    var utenteCorrente = null;
    var pinBuf = "";
    var pinId = "";
    var prodotti = [];
    var cacheClienti = {};

    window.onload = function() {
        setTimeout(() => { document.getElementById('loading').style.display='none'; mostraLogin(); }, 1500);
        initOrdine();
    };

    function mostraLogin() {
        document.getElementById('login').classList.add('show');
        document.getElementById('pin').classList.remove('show');
        document.getElementById('app').classList.remove('show');
    }

    function avviaLogin(id, nome) {
        pinId = id;
        pinBuf = "";
        document.getElementById('pnome').innerText = "LOGIN " + nome;
        document.getElementById('login').classList.remove('show');
        document.getElementById('pin').classList.add('show');
        aggiornaDots();
    }

    function k(num) {
        if(pinBuf.length < 4) pinBuf += num;
        aggiornaDots();
        if(pinBuf.length === 4) verificaPin();
    }
    function kd() { pinBuf = pinBuf.slice(0,-1); aggiornaDots(); }
    function aggiornaDots() {
        for(let i=0; i<4; i++) document.getElementById('d'+i).classList.toggle('on', i < pinBuf.length);
    }

    function verificaPin() {
        // Qui andrebbe il controllo reale su Firebase, per ora semplifichiamo:
        if(pinBuf === "1234" || pinBuf === "0000") {
            document.getElementById('pin').classList.remove('show');
            document.getElementById('app').classList.add('show');
            toast("BENVENUTO");
        } else {
            toast("PIN ERRATO");
            pinBuf = "";
            aggiornaDots();
        }
    }

    function mostraSezione(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-'+id).classList.add('active');
        document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
        if(id === 'cucina') caricaCucina();
        if(id === 'clienti') caricaClienti();
    }

    // --- LOGICA ORDINI ---
    function initOrdine() {
        prodotti = [];
        document.getElementById('prodotti-box').innerHTML = "";
        document.getElementById('o-cognome').value = "";
        document.getElementById('o-indirizzo').value = "";
        document.getElementById('o-costo-dom').value = "0.00";
        aggiungiProdotto();
        aggiornaTotali();
    }

    function aggiungiProdotto() {
        let i = prodotti.length;
        prodotti.push({nome: "", prezzo: 0, qty: 1});
        let div = document.createElement('div');
        div.className = "prod-row";
        div.style = "display:flex; gap:5px; margin-bottom:5px";
        div.innerHTML = `
            <input type="number" value="1" style="width:40px" oninput="prodotti[${i}].qty=this.value; aggiornaTotali()">
            <input type="text" placeholder="Prodotto" style="flex:1" oninput="prodotti[${i}].nome=this.value">
            <input type="number" placeholder="€" style="width:60px" oninput="prodotti[${i}].prezzo=this.value; aggiornaTotali()">
        `;
        document.getElementById('prodotti-box').appendChild(div);
    }

    function cambiaZona() {
        let sel = document.getElementById('o-zona');
        let costo = sel.options[sel.selectedIndex].getAttribute('data-costo');
        document.getElementById('o-costo-dom').value = parseFloat(costo).toFixed(2);
        aggiornaTotali();
    }

    function aggiornaTotali() {
        let pTot = 0;
        prodotti.forEach(p => pTot += (p.prezzo * p.qty));
        let cTot = parseFloat(document.getElementById('o-costo-dom').value || 0);
        document.getElementById('sub-prod').innerText = "€" + pTot.toFixed(2);
        document.getElementById('sub-cons').innerText = "€" + cTot.toFixed(2);
        document.getElementById('sub-tot').innerText = "€" + (pTot + cTot).toFixed(2);
    }

    function apriMappaSupporto() {
        let ind = document.getElementById('o-indirizzo').value;
        if(!ind) return toast("INSERISCI INDIRIZZO");
        window.open("https://www.google.com/maps/search/" + encodeURIComponent(ind + " Palermo"), "_blank");
    }

    function inviaOrdine() {
        let cognome = document.getElementById('o-cognome').value;
        if(!cognome) return toast("MANCA COGNOME");
        
        let ordine = {
            cliente: cognome,
            indirizzo: document.getElementById('o-indirizzo').value,
            prodotti: prodotti,
            consegna: document.getElementById('o-costo-dom').value,
            stato: "in_cucina",
            timestamp: Date.now()
        };

        db.ref('ordini').push(ordine).then(() => {
            toast("ORDINE INVIATO!");
            initOrdine();
        });
    }

    function caricaCucina() {
        db.ref('ordini').orderByChild('stato').equalTo('in_cucina').on('value', snap => {
            let html = "";
            snap.forEach(child => {
                let o = child.val();
                html += `<div class="ordine-card">
                    <span class="tag-stato s-cucina">IN PREPARAZIONE</span>
                    <div style="font-weight:900">${o.cliente}</div>
                    <div style="font-size:0.8rem">${o.indirizzo}</div>
                    <button class="btn-primary" onclick="setPronto('${child.key}')">PRONTO ✅</button>
                </div>`;
            });
            document.getElementById('lista-cucina').innerHTML = html || "NESSUN ORDINE";
        });
    }

    function setPronto(id) {
        db.ref('ordini/' + id).update({stato: 'pronto'});
    }

    function toast(msg) {
        let t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function logout() { location.reload(); }
</script>

</body>
</html>
