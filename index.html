<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY - ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --bor: #D0DCE8; --ver: #1B8A4A; --grigio: #666; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; }
        body { background: var(--blu); color: white; height: 100vh; overflow: hidden; }

        /* PAGINE */
        .page { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .page.show { display: flex; }
        
        /* PIN PAD */
        #title-main { font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 50px; text-align: center; }
        .btn-main { width: 100%; max-width: 300px; padding: 20px; background: var(--ora); border: none; border-radius: 15px; color: white; font-weight: 900; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; }
        .pin-container { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; }
        .dot.active { background: var(--ora); border-color: var(--ora); }
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-key { width: 75px; height: 75px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.8rem; font-weight: 900; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* ADMIN INTERFACE */
        #app-admin { display: none; background: #f4f7f9; color: var(--blu); position: fixed; inset: 0; flex-direction: column; }
        #app-admin.show { display: flex; }
        .header-admin { background: var(--blu); color: white; padding: 15px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--ora); }
        .content { flex: 1; overflow-y: auto; padding: 15px; }

        /* FORM COMPONENTS */
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--bor); padding-bottom: 10px; }
        .order-num { background: var(--ora); color: white; padding: 5px 12px; border-radius: 8px; font-weight: 900; font-size: 1.2rem; }
        
        .form-group { margin-bottom: 12px; position: relative; }
        .label { display: block; font-weight: 900; font-size: 0.75rem; margin-bottom: 4px; color: var(--grigio); text-transform: uppercase; }
        .input-big { width: 100%; padding: 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1.2rem; font-weight: 700; color: var(--blu); outline: none; background: white; }
        
        /* SUGGERIMENTI RUBRICA */
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid var(--ora); border-radius: 0 0 10px 10px; z-index: 1000; display: none; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .suggestion-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.9rem; color: var(--blu); }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item b { color: var(--ora); }

        /* TASTI RAPIDI COSTO */
        .cost-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-cost { flex: 1; padding: 10px; background: white; border: 2px solid var(--blu); border-radius: 8px; color: var(--blu); font-weight: 900; cursor: pointer; }
        .btn-cost.active { background: var(--blu); color: white; }

        /* TASTI RIDER */
        .rider-row { display: flex; gap: 10px; margin-top: 5px; }
        .btn-rider { flex: 1; padding: 12px; background: #D0DCE8; border: none; border-radius: 10px; color: var(--blu); font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-rider.active { background: #4285F4; color: white; box-shadow: 0 4px 0 #2B5F8E; }

        /* MAPS BUTTON */
        .btn-maps { background: #4285F4; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 900; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }

        /* UPDATE SWITCH */
        .update-box { display: flex; align-items: center; gap: 10px; background: #eee; padding: 10px; border-radius: 10px; margin-top: 10px; }
        .update-box input { transform: scale(1.5); }
        .update-box label { font-weight: 900; font-size: 0.8rem; cursor: pointer; }

    </style>
</head>
<body>

    <div id="page-start" class="page show">
        <h1 id="title-main">SAVERIO DELIVERY</h1>
        <button class="btn-main" onclick="openPinPad()">ADMIN LOGIN</button>
    </div>

    <div id="page-pin" class="page">
        <h2 style="margin-bottom:20px; font-weight:900;">INSERISCI PIN</h2>
        <div class="pin-container">
            <div class="dot" id="dot-0"></div><div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div><div class="dot" id="dot-3"></div>
        </div>
        <div class="grid-pin" id="numpad"></div>
        <button class="btn-main" style="background:#2B5F8E; margin-top:20px; font-size:0.9rem;" onclick="resetPin()">CANCELLA</button>
    </div>

    <div id="app-admin">
        <div class="header-admin">
            <span>ADMIN PANEL</span>
            <button onclick="location.reload()" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:8px; font-size:0.7rem; font-weight:900;">LOGOUT</button>
        </div>
        
        <div class="content">
            <div class="order-header">
                <h2 style="font-weight:900;">NUOVO ORDINE</h2>
                <div class="order-num" id="display-order-num">#01</div>
            </div>
            
            <div class="form-group">
                <span class="label">CERCA CLIENTE (COGNOME O TEL)</span>
                <input type="text" id="search-input" class="input-big" placeholder="ES: ROSSI O 333..." oninput="handleSearch(this.value)">
                <div id="suggestions-box" class="suggestions"></div>
            </div>

            <div class="form-group">
                <span class="label">INDIRIZZO</span>
                <input type="text" id="o-indirizzo" class="input-big" placeholder="VIA E CIVICO">
            </div>

            <button class="btn-maps" onclick="openGoogleMaps()">📍 APRI APP GOOGLE MAPS</button>

            <div class="form-group">
                <span class="label">COSTO DOMICILIO</span>
                <div class="cost-row">
                    <button class="btn-cost" onclick="setCost(1)">1€</button>
                    <button class="btn-cost" onclick="setCost(2)">2€</button>
                    <button class="btn-cost" onclick="setCost(3)">3€</button>
                    <button class="btn-cost" onclick="setCost(4)">4€</button>
                    <button class="btn-cost" onclick="setCost(5)">5€</button>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="form-group"><span class="label">SCALA</span><input type="text" id="o-scala" class="input-big"></div>
                <div class="form-group"><span class="label">PIANO</span><input type="text" id="o-piano" class="input-big"></div>
            </div>

            <div class="update-box">
                <input type="checkbox" id="update-rubrica" checked>
                <label for="update-rubrica">AGGIORNA IN RUBRICA</label>
            </div>

            <hr style="margin:20px 0; border:1px solid var(--bor);">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="form-group">
                    <span class="label">ORARIO CONSEGNA</span>
                    <select id="o-orario" class="input-big" style="height:54px;">
                        </select>
                </div>
                <div class="form-group">
                    <span class="label">PREFERENZA RIDER</span>
                    <div class="rider-row">
                        <button class="btn-rider" id="btn-porpe" onclick="setRider('PORPE')">PORPE</button>
                        <button class="btn-rider" id="btn-gaspare" onclick="setRider('GASPARE')">GASPARE</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const ADMIN_PIN = "0508";
        let currentPin = "";
        let selectedCost = 0;
        let selectedRider = "";
        let orderCount = 1;

        // --- PIN PAD LOGIC (Tuo finale originale) ---
        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++) {
            let btn = document.createElement('div');
            btn.className = 'num-key';
            btn.innerText = i;
            btn.onclick = () => pressKey(i.toString());
            pad.appendChild(btn);
        }
        let empty = document.createElement('div');
        pad.appendChild(empty);
        let zero = document.createElement('div');
        zero.className = 'num-key';
        zero.innerText = "0";
        zero.onclick = () => pressKey("0");
        pad.appendChild(zero);

        function openPinPad() {
            document.getElementById('page-start').classList.remove('show');
            document.getElementById('page-pin').classList.add('show');
        }

        function pressKey(num) {
            if(currentPin.length < 4) { currentPin += num; updateDots(); }
            if(currentPin.length === 4) {
                if(currentPin === ADMIN_PIN) {
                    document.getElementById('page-pin').classList.remove('show');
                    document.getElementById('app-admin').classList.add('show');
                    initOrderForm();
                } else { alert("PIN ERRATO!"); resetPin(); }
            }
        }

        function updateDots() {
            for(let i=0; i<4; i++) { document.getElementById('dot-'+i).classList.toggle('active', i < currentPin.length); }
        }

        function resetPin() { currentPin = ""; updateDots(); }

        // --- NUOVO ORDINE LOGIC ---
        function initOrderForm() {
            generateTimeOptions();
            document.getElementById('display-order-num').innerText = "#" + orderCount.toString().padStart(2, '0');
        }

        function generateTimeOptions() {
            const select = document.getElementById('o-orario');
            select.innerHTML = "";
            let start = 18 * 60; // 18:00 in minuti
            let end = 22 * 60;   // 22:00 in minuti
            
            let now = new Date();
            let currentMinutes = now.getHours() * 60 + now.getMinutes();
            let nearestSlot = Math.ceil(currentMinutes / 15) * 15;

            for(let t = start; t <= end; t += 15) {
                let h = Math.floor(t / 60);
                let m = t % 60;
                let timeStr = `${h}:${m === 0 ? '00' : m}`;
                let opt = document.createElement('option');
                opt.value = timeStr;
                opt.innerText = timeStr;
                if(t === nearestSlot || (t === start && nearestSlot < start)) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function setCost(val) {
            selectedCost = val;
            document.querySelectorAll('.btn-cost').forEach(b => {
                b.classList.toggle('active', b.innerText === val + "€");
            });
        }

        function setRider(name) {
            selectedRider = (selectedRider === name) ? "" : name;
            document.getElementById('btn-porpe').classList.toggle('active', selectedRider === 'PORPE');
            document.getElementById('btn-gaspare').classList.toggle('active', selectedRider === 'GASPARE');
        }

        function openGoogleMaps() {
            const addr = document.getElementById('o-indirizzo').value;
            if(!addr) { alert("Inserisci un indirizzo prima!"); return; }
            // Deep Link per aprire l'App direttamente
            window.open(`comgooglemaps://?q=${encodeURIComponent(addr)}`, '_blank');
            // Backup se il deep link fallisce su alcuni browser
            setTimeout(() => {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`, '_blank');
            }, 500);
        }

        // --- SIMULAZIONE RUBRICA (Verrà collegata a Firebase) ---
        function handleSearch(val) {
            const box = document.getElementById('suggestions-box');
            if(val.length < 2) { box.style.display = 'none'; return; }
            
            // Per ora mostriamo un esempio di come apparirà
            box.innerHTML = `
                <div class="suggestion-item" onclick="selectCustomer('ROSSI MARIO', 'Via Roma 10', 'A', '3')">
                    <b>ROSSI MARIO</b> - Via Roma 10 (Scala A, P.3)
                </div>
            `;
            box.style.display = 'block';
        }

        function selectCustomer(nome, via, scala, piano) {
            document.getElementById('search-input').value = nome;
            document.getElementById('o-indirizzo').value = via;
            document.getElementById('o-scala').value = scala;
            document.getElementById('o-piano').value = piano;
            document.getElementById('suggestions-box').style.display = 'none';
        }
    </script>
</body>
</html>
