        snapshot.forEach(function(child) { var o = child.val(); o._key = child.key; ordiniSalvati.push(o); });
        ordiniSalvati.sort(function(a,b) { return a.ora.localeCompare(b.ora); });
        if(document.getElementById('tab5').classList.contains('show')) renderConsegne();
        if(document.getElementById('tab8').classList.contains('show')) renderConsegnati();
        document.getElementById('fb-status').textContent = '🟢 sync';
    });
    contatoreRef.on('value', function(snapshot) { if(snapshot.val() !== null) currentOrderNum = snapshot.val() + 1; });
    db.ref('riders').on('value', function(snap) { riders = snap.val() || {}; });
    clientiRef.on('value', function(snap) { clienti = snap.val() || {}; });
    db.ref('.info/connected').on('value', function(snap) {
        document.getElementById('fb-status').textContent = snap.val() ? '🟢 sync' : '🔴 offline';
    });
}

function cicloTipo(i) {
    var dot = document.getElementById('bt-'+i);
    var attuale = parseInt(dot.getAttribute('data-tipo'));
    var prossimo = (attuale + 1) % 5;

function setTipo(i, tipo) {
    var dot = document.getElementById('bt-'+i);
    var row = document.getElementById('row-'+i);
    dot.setAttribute('data-tipo', tipo);
    row.classList.remove('tipo-polleria','tipo-bibite','tipo-banco','tipo-coscia');

function onGustoInput(i) {
    autoExpand(document.getElementById('g-'+i));
    updateRiepilogo();
    var val = document.getElementById('g-'+i).value.trim().toUpperCase();
    var sug = document.getElementById('sug-'+i);
    if(val.length < 2 || !listino) { sug.style.display='none'; return; }
    var matches = [];
    var keys = Object.keys(listino);
    for(var k=0; k<keys.length; k++) {
        var p = listino[keys[k]];
        if(p.nome.indexOf(val) !== -1) matches.push([keys[k], p]);
    }
    if(matches.length === 0) { sug.style.display='none'; return; }
    var html = '';
    for(var m=0; m<Math.min(5,matches.length); m++) {
        var p = matches[m][1];
        var priceLabel = p.modalita==='qta' ? '(prezzo da qtà)' : p.modalita==='kg' ? p.prezzo.toFixed(2).replace('.',',')+'\u20ac/kg' : p.prezzo.toFixed(2).replace('.',',')+'\u20ac';
        html += '<div style="padding:8px 10px; font-size:0.9rem; color:var(--blu); cursor:pointer; border-bottom:1px solid #eee;" onclick="selezionaProdotto('+i+',\''+p.nome+'\',\''+p.tipo+'\','+p.prezzo+',\''+p.modalita+'\')">' +
            '<span style="color:'+(coloriTipo[p.tipo]||'inherit')+';">\u25cf</span> '+p.nome+' <span style="color:#aaa; font-size:0.8rem;">'+priceLabel+'</span></div>';
    }
    sug.innerHTML = html;
    sug.style.display = 'block';
}

function selezionaProdotto(i, nome, tipo, prezzo, modalita) {
    document.getElementById('g-'+i).value = nome;
    setTipo(i, tipo);
    var qta = document.getElementById('q-'+i).value.trim();
    if(modalita === 'fisso') { var q = parseQtaKg(qta) || 1; document.getElementById('p-'+i).value = (q * prezzo).toFixed(2); }
    else if(modalita === 'kg') { var q = parseQtaKg(qta); if(q > 0) document.getElementById('p-'+i).value = (q * prezzo).toFixed(2); }
    else if(modalita === 'qta') { var q = parseFloat(qta.replace(',','.')); if(q > 0) document.getElementById('p-'+i).value = q.toFixed(2); }
    document.getElementById('sug-'+i).style.display = 'none';
    updateRiepilogo();
}

function parseQtaKg(q) {
    var s = (q||'').toString().trim().replace(',','.');
    if(s.indexOf('/') !== -1) { var p=s.split('/'); return parseFloat(p[0])/parseFloat(p[1]); }
    return parseFloat(s) || 0;
}

function onQtaInput(i) {
    var nome = document.getElementById('g-'+i).value.trim().toUpperCase();
    var match = null;
    var keys = Object.keys(listino||{});
    for(var k=0; k<keys.length; k++) { if(listino[keys[k]].nome === nome) { match = listino[keys[k]]; break; } }
    if(!match) return;
    var qta = document.getElementById('q-'+i).value.trim();
    if(match.modalita === 'fisso') { var q = parseQtaKg(qta) || 1; if(q > 0) document.getElementById('p-'+i).value = (q * match.prezzo).toFixed(2); }
    else if(match.modalita === 'kg') { var q = parseQtaKg(qta); if(q > 0) document.getElementById('p-'+i).value = (q * match.prezzo).toFixed(2); }
    else if(match.modalita === 'qta') { var q = parseFloat(qta.replace(',','.')); if(q > 0) document.getElementById('p-'+i).value = q.toFixed(2); }
    updateRiepilogo();
}

function updateTimeSelect() {
    var sel = document.getElementById('o-orario');
    sel.innerHTML = '<option value="">\ud83d\udd52 ORARIO CONSEGNA</option>';
    for(var t = 1080; t <= 1350; t += 15) {
        var hh = Math.floor(t/60), mm = t%60;
        var timeStr = hh + ':' + (mm === 0 ? '00' : mm);
        var opt = document.createElement('option');
        opt.value = timeStr; opt.innerText = timeStr;
        sel.appendChild(opt);

function autoExpand(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; updateRiepilogo(); }

function goGusto(e, i) {
    if(e.key === ' ') { e.preventDefault(); document.getElementById('g-'+i).focus(); }
    if(e.key === 'Backspace' && document.getElementById('q-'+i).value === '' && i > 0) { e.preventDefault(); document.getElementById('g-'+(i-1)).focus(); }

function goNext(e, i) {
    if(e.key === 'Enter') { e.preventDefault(); if(i<24) document.getElementById('q-'+(i+1)).focus(); }
    if(e.key === 'Backspace' && document.getElementById('g-'+i).value === '') { e.preventDefault(); document.getElementById('q-'+i).focus(); }
}
function goPrezzoNext(e, i) {
    if(e.key === 'Enter') { e.preventDefault(); if(i<24) document.getElementById('p-'+(i+1)).focus(); }
    if(e.key === 'Backspace' && document.getElementById('p-'+i).value === '' && i > 0) { e.preventDefault(); document.getElementById('p-'+(i-1)).focus(); }

function skipTel() { document.getElementById('o-tel').value = "INTERNO"; updateRiepilogo(); }

function updateRiepilogo() {
    var rawItems = [];
    for(var i=0; i<25; i++) {
        var v = parseFloat(document.getElementById('p-'+i).value)||0;
        var g = document.getElementById('g-'+i).value;
        var q = document.getElementById('q-'+i).value || "0";
        var isGf = document.getElementById('f-'+i).checked;
        var tipo = document.getElementById('bt-'+i).getAttribute('data-tipo');
        if(v>0 || g.trim() !== "") rawItems.push({q:q, g:g.toUpperCase(), v:v, isGf:isGf, tipo:tipo});
    }
    rawItems.sort(function(a,b) { return a.tipo - b.tipo; });
    var pt = 0;
    for(var i=0; i<rawItems.length; i++) pt += rawItems[i].v;
    var tot = pt + sCost;
    document.getElementById('main-total').innerText = tot.toFixed(2).replace('.',',') + ' \u20ac';
    var nOrd = '#' + currentOrderNum.toString().padStart(2,'0');
    if(editKey !== null) {
        for(var i=0; i<ordiniSalvati.length; i++) { if(ordiniSalvati[i]._key === editKey) { nOrd = ordiniSalvati[i].num; break; } }
    }
    document.getElementById('header-tag').innerText = nOrd;
    document.getElementById('btn-invia').innerText = (editKey !== null) ? 'AGGIORNA ORDINE ' + nOrd : 'INVIA ORDINE';
    var cog = document.getElementById('o-cognome').value.toUpperCase();
    var ind = document.getElementById('o-indirizzo').value.toUpperCase();
    var ora = document.getElementById('o-orario').value;
    var lHtml = '';
    for(var i=0; i<rawItems.length; i++) {
        var item = rawItems[i];
        var colorClass = item.isGf ? 'gf-text' : (item.tipo==='1'?'tipo-polleria':(item.tipo==='2'?'tipo-bibite':(item.tipo==='3'?'tipo-banco':(item.tipo==='4'?'tipo-coscia':''))));
        lHtml += '<div class="pizza-item '+colorClass+'"><div class="pizza-qty">'+item.q+'</div><div class="pizza-desc">'+(item.isGf?'[GF] ':'')+item.g+'</div><div class="pizza-price">'+item.v.toFixed(2)+'\u20ac</div></div>';
    }
    document.getElementById('riepilogo-box').innerHTML =
        '<div class="rip-row-top"><span>\ud83c\udff7\ufe0f ' + nOrd + '</span> <span>\ud83d\udd52 ' + (ora||'--:--') + '</span></div>' +
        '<div class="rip-row-client">\ud83d\udc64 <b>' + (cog||'---') + '</b><br>\ud83d\udccd <b>' + (ind||'---') + '</b></div>' +
        '<div style="margin-top:10px; border-top:2px solid #333; padding-top:10px;">' + lHtml + '</div>' +
        '<div class="rip-delivery-row"><span style="width:80px; text-align:right; font-size:1.2rem;">\ud83d\udea3 <b>' + sCost.toFixed(2) + '\u20ac</b></span></div>' +
        '<div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;"><div style="text-align:right; color:var(--ora); font-size:1.6rem;"><b>TOTALE: ' + tot.toFixed(2) + '\u20ac</b></div></div>';
    var ok = cog && ind && ora && sCost>0 && pt>0 && sPay;
    document.getElementById('btn-invia').style.background = ok ? 'var(--ver)' : '#ccc';
    document.getElementById('btn-invia').disabled = !ok;
}

function inviaOrdine() {
    var rawItems = [];
    for(var i=0; i<25; i++) {
        var v = parseFloat(document.getElementById('p-'+i).value)||0;
        var g = document.getElementById('g-'+i).value;
        var q = document.getElementById('q-'+i).value || "0";
        var isGf = document.getElementById('f-'+i).checked;
        var tipo = document.getElementById('bt-'+i).getAttribute('data-tipo');
        if(v>0 || g.trim() !== "") rawItems.push({q:q, g:g.toUpperCase(), v:v, isGf:isGf, tipo:tipo});
    }
    rawItems.sort(function(a,b) { return a.tipo - b.tipo; });
    var nOrd = '#' + currentOrderNum.toString().padStart(2,'0');
    if(editKey !== null) {
        for(var i=0; i<ordiniSalvati.length; i++) { if(ordiniSalvati[i]._key === editKey) { nOrd = ordiniSalvati[i].num; break; } }
    }
    var ordine = {
        num: nOrd,
        ora: document.getElementById('o-orario').value,
        cog: document.getElementById('o-cognome').value.toUpperCase(),
        ind: document.getElementById('o-indirizzo').value.toUpperCase(),
        tel: document.getElementById('o-tel').value.toUpperCase(),
        nota: document.getElementById('o-nota-cons').value.toUpperCase(),
        notaRip: document.getElementById('o-nota-rip').value.toUpperCase(),
        tot: document.getElementById('main-total').innerText,
        costoCons: sCost, pay: sPay, resto: document.getElementById('o-resto').value.toUpperCase(),
        prodotti: rawItems
    };
    if(editKey !== null) {
        var k = editKey; editKey = null; ordiniRef.child(k).set(ordine);
    } else {
        ordiniRef.push(ordine);
        contatoreRef.set(currentOrderNum);
        salvaCliente(ordine.cog, ordine.tel, ordine.ind, ordine.nota);
    }
    resetForm(); showTab(5);

function resetForm() {
    document.getElementById('o-cognome').value = "";
    document.getElementById('o-tel').value = "";
    document.getElementById('o-indirizzo').value = "";
    document.getElementById('o-nota-cons').value = "";
    document.getElementById('o-nota-rip').value = "";
    document.getElementById('o-orario').value = "";
    document.getElementById('o-resto').value = "";
    sPay = ""; sCost = 0;
    var costBtns = document.querySelectorAll('[id^="cost"]');
    for(var i=0; i<costBtns.length; i++) costBtns[i].style.background = 'white';

        document.getElementById('q-'+i).value = "";

function modificaOrdine(key) {
    var o = null;
    for(var i=0; i<ordiniSalvati.length; i++) { if(ordiniSalvati[i]._key === key) { o = ordiniSalvati[i]; break; } }
    if(!o) return;
    editKey = key; resetForm();
    document.getElementById('o-cognome').value = o.cog;
    document.getElementById('o-tel').value = o.tel;
    document.getElementById('o-indirizzo').value = o.ind;
    document.getElementById('o-nota-cons').value = o.nota;
    document.getElementById('o-nota-rip').value = o.notaRip;
    updateTimeSelect();
    var selOra = document.getElementById('o-orario');
    var hasTime = false;
    var opts = selOra.options;
    for(var i=0; i<opts.length; i++) { if(opts[i].value === o.ora) { hasTime = true; break; } }
    if(!hasTime) { var opt = document.createElement('option'); opt.value = o.ora; opt.innerText = o.ora; selOra.appendChild(opt); }
    selOra.value = o.ora;
    document.getElementById('o-resto').value = o.resto;
    setCost(o.costoCons); setPay(o.pay);
    for(var i=0; i<o.prodotti.length && i<25; i++) {
        var prod = o.prodotti[i];
        document.getElementById('q-'+i).value = prod.q;
        document.getElementById('g-'+i).value = prod.g;
        document.getElementById('p-'+i).value = prod.v;
        document.getElementById('f-'+i).checked = prod.isGf;
        setTipo(i, prod.tipo||'0');
        var gInput = document.getElementById('g-'+i);
        gInput.style.height = 'auto';
        gInput.style.height = (gInput.scrollHeight > 0 ? gInput.scrollHeight : 50) + 'px';
    }
    showTab(1);
}

function eliminaOrdine(key) {
    var o = null;
    for(var i=0; i<ordiniSalvati.length; i++) { if(ordiniSalvati[i]._key === key) { o = ordiniSalvati[i]; break; } }
    if(o && confirm('Sei sicura di voler eliminare l\'ordine ' + o.num + '?')) ordiniRef.child(key).remove();
}

            '</div></div>' +
            '<div class="card-compatta-detail">' +
            '<div style="font-size:0.85rem;margin-bottom:6px;">' +
            '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.ind)+'" style="color:var(--ora);text-decoration:none;" target="_blank" onclick="event.stopPropagation()">\ud83d\udccd '+o.ind+'</a><br>' +
            '<a href="tel:'+o.tel+'" style="color:var(--link);text-decoration:none;" onclick="event.stopPropagation()">\ud83d\udcde '+o.tel+'</a>' +
            (o.nota ? '<div style="font-size:0.8rem;color:var(--ora);margin-top:4px;">\ud83d\udcdd '+o.nota+'</div>' : '') +
            '</div>' +
            '<div style="background:#f9f9f9;border-radius:6px;padding:6px;">'+prodHtml+'</div>' +
            '<div style="margin-top:8px;">' +
            '<button onclick="event.stopPropagation();eliminaOrdine(\''+o._key+'\')" style="width:100%;padding:8px;background:var(--rosso);color:white;border:none;border-radius:8px;font-family:\'Barlow\',sans-serif;font-weight:900;font-size:0.82rem;cursor:pointer;">\ud83d\uddd1 ELIMINA</button>' +
            '</div></div></div>';
    }
    container.innerHTML = html;
}

function renderOrari() {
    var container = document.getElementById('orari-lista');
    if(ordiniSalvati.length === 0) { container.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;font-size:1.1rem;">Nessun ordine ancora</div>'; return; }
    var fasce = {};
    for(var i=0; i<ordiniSalvati.length; i++) {
        var o = ordiniSalvati[i];
        if(!o.ora) continue;
        if(!fasce[o.ora]) fasce[o.ora] = [];
        fasce[o.ora].push(o);
    }
    var orariOrdinati = Object.keys(fasce).sort();
    var html = '';
    for(var oi=0; oi<orariOrdinati.length; oi++) {
        var ora = orariOrdinati[oi];
        var ordini = fasce[ora], n = ordini.length;
        var caricoClass = n >= 5 ? 'carico-alto' : 'carico-'+n;
        var badgeClass = n >= 5 ? 'badge-rosso' : n >= 3 ? 'badge-giallo' : 'badge-verde';
        var dettagli = '';
        for(var j=0; j<ordini.length; j++) {
            var o = ordini[j];
            var prodTags = '';
            for(var k=0; k<o.prodotti.length; k++) {
                var p = o.prodotti[k];
                var cls = p.isGf?'is-gf':p.tipo==='1'?'is-pollo':p.tipo==='2'?'is-bibita':p.tipo==='3'?'is-banco':'';
                prodTags += '<span class="orario-prod-tag '+cls+'">'+p.q+' '+p.g+'</span>';
            }
            dettagli += '<div class="orario-ordine"><div class="orario-ordine-top"><span class="orario-cliente">\ud83d\udc64 '+o.cog+'</span><span class="orario-num">'+o.num+'</span></div><div class="orario-ind">\ud83d\udccd '+o.ind+'</div><div class="orario-prodotti">'+prodTags+'</div></div>';
        }
        html += '<div class="orario-block '+caricoClass+'"><div class="orario-header" onclick="toggleOrario(this)"><span class="orario-ora">\ud83d\udd52 '+ora+'</span><span class="orario-badge '+badgeClass+'">'+n+' '+(n===1?'ordine':'ordini')+'</span></div><div class="orario-detail">'+dettagli+'</div></div>';
    }
    container.innerHTML = html;
}

function toggleOrario(header) { header.nextElementSibling.classList.toggle('open'); }

function onCognomeInput() {
    updateRiepilogo();
    var val = document.getElementById('o-cognome').value.trim().toUpperCase();
    var list = document.getElementById('autocomplete-list');
    if(val.length < 2) { list.style.display = 'none'; return; }
    var matches = [];
    var keys = Object.keys(clienti);
    for(var i=0; i<keys.length; i++) { if(clienti[keys[i]].cog.indexOf(val) === 0) matches.push(clienti[keys[i]]); }
    if(matches.length === 0) { list.style.display = 'none'; return; }
    var html = '';
    for(var i=0; i<Math.min(5,matches.length); i++) {
        var c = matches[i];
        var cJson = JSON.stringify(c).replace(/"/g,'&quot;');
        html += '<div class="autocomplete-item" onclick="selezionaCliente('+cJson+')"><b>'+c.cog+'</b> \u2014 '+c.ind+'<br><small style="color:#888;">'+(c.tel||'')+'</small></div>';
    }
    list.innerHTML = html;
    list.style.display = 'block';
}

function selezionaCliente(c) {
    document.getElementById('o-cognome').value = c.cog;
    document.getElementById('o-tel').value = c.tel || '';
    document.getElementById('o-indirizzo').value = c.ind || '';
    document.getElementById('o-nota-cons').value = c.nota || '';
    document.getElementById('autocomplete-list').style.display = 'none';
    updateRiepilogo();
}

function salvaCliente(cog, tel, ind, nota) {
    if(!cog || !ind) return;
    var esistente = null;
    var keys = Object.keys(clienti);
    for(var i=0; i<keys.length; i++) { if(clienti[keys[i]].cog === cog && clienti[keys[i]].ind === ind) { esistente = keys[i]; break; } }
    if(esistente) clientiRef.child(esistente).update({cog:cog, tel:tel, ind:ind, nota:nota});
    else clientiRef.push({cog:cog, tel:tel, ind:ind, nota:nota});
}

function verifyMaps() {
    var a = document.getElementById('o-indirizzo').value;
    if(!a) return alert("METTI INDIRIZZO");
    window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a));
    document.getElementById('btn-maps').style.background = 'var(--ver)';
    document.getElementById('btn-maps').innerText = '\u2705 POSIZIONE VERIFICATA';
}

function renderStat() {
    var container = document.getElementById('stat-box');
    if(!container) return;
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Statistiche in costruzione</div>';
}
