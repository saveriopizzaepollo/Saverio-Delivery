        renderOrdini();

        if(selezionati.size === 0) return;
        keyDaAssegnare = null; // multipla
        const opts = document.getElementById('rider-options');
        opts.innerHTML = Object.entries(riders).map(([id, r]) => {
            let inGiro = isRiderInGiro(id);
            return `<button class="rider-option ${inGiro ? 'non-disponibile' : ''}" onclick="assegnaRiderMultiplo('${id}')">

    }

            ordiniRef.child(key).update({ stato: 'assegnato', riderId, tsAssegnato: ts });
        });
        selezionati.clear();
        aggiornaBarraAssegna();
        chiudiRiderOverlay();
        renderOrdini();

    }

            if(document.getElementById('tab3').classList.contains('show')) renderRider();
            if(document.getElementById('tab4').classList.contains('show')) renderConsegnati();
            if(document.getElementById('tab5').classList.contains('show')) renderOrari();
        }
        document.getElementById('fb-status').textContent = '🟢 sync';
    });

    ridersRef.on('value', snap => { 
        riders = snap.val() || {};
        // Auto-scadenza timer 5 minuti — usa serverTime per evitare differenze di orologio
        db.ref('/.info/serverTimeOffset').once('value', offsetSnap => {
            let offset = offsetSnap.val() || 0;
            let serverNow = Date.now() + offset;
            Object.entries(riders).forEach(([id, r]) => {
                if(r.inRientro && r.tsRientro) {
                    let elapsed = serverNow - r.tsRientro;
                    if(elapsed >= 300000) {
                        db.ref('riders').child(id).update({ inRientro: false, tsRientro: null });
                    }
                }
            });
        });
        if(document.getElementById('tab3') && document.getElementById('tab3').classList.contains('show')) renderRider();
    });

    db.ref('.info/connected').on('value', snap => {
        document.getElementById('fb-status').textContent = snap.val() ? '🟢 sync' : '🔴 offline';
    });

    // Sessione attiva
    if(loggedIn) {
        document.getElementById('page-login').classList.remove('show');
        document.getElementById('app-dispatch').style.display = 'block';
    }

    // ── PIN ────────────────────────────────────────────────────────
    const pad = document.getElementById('numpad');
    for(let i=1; i<=9; i++) {
        let b = document.createElement('div'); b.className='num-key'; b.innerText=i;
        b.onclick = () => pressPin(i); pad.appendChild(b);
    }
    let z = document.createElement('div'); z.className='num-key'; z.innerText='0';
    z.style.gridColumnStart='2'; z.onclick = () => pressPin(0); pad.appendChild(z);

    function apriPin() {
        cPin = '';
        for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background='none';
        document.getElementById('pin-error').style.display='none';
        document.getElementById('pin-overlay').classList.add('show');
    }

    function chiudiPin() {
        document.getElementById('pin-overlay').classList.remove('show');
        cPin = '';
    }

    function pressPin(n) {
        if(cPin.length < 4) {
            cPin += n;
            document.getElementById('dot-'+(cPin.length-1)).style.background = 'var(--ora)';
            if(cPin.length === 4) setTimeout(() => verificaPin(), 200);
        }
    }

    function verificaPin() {
        dispatchRef.once('value', snap => {
            let pinSalvato = snap.val()?.pin || PIN_DEFAULT;
            if(cPin === pinSalvato) {
                sessionStorage.setItem('dispatchLogin', 'true');
                loggedIn = true;
                document.getElementById('pin-overlay').classList.remove('show');
                document.getElementById('page-login').classList.remove('show');
                document.getElementById('app-dispatch').style.display = 'block';
                renderConsegne();
            } else {
                document.getElementById('pin-error').style.display = 'block';
                cPin = '';
                for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background='none';
            }
        });
    }

    function logout() {
        sessionStorage.removeItem('dispatchLogin');
        loggedIn = false;
        document.getElementById('app-dispatch').style.display = 'none';
        document.getElementById('page-login').classList.add('show');
    }

    // ── TAB ────────────────────────────────────────────────────────
    function showTab(n) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('show'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab'+n).classList.add('show');
        document.getElementById('btn-t'+n).classList.add('active');
        if(n===1) renderOrdini();
        if(n===2) renderAssegnati();
        if(n===3) renderRider();
        if(n===4) renderConsegnati();
        if(n===5) renderOrari();
    }

    // ── RENDER ORDINI (solo attesa e pronto) ──────────────────────
    function renderOrdini() {
        const lista = ordiniSalvati.filter(o => !o.stato || o.stato === 'attesa' || o.stato === 'pronto');
        renderCardLista('ordini-lista', lista, true);
    }

    // ── RENDER ASSEGNATI ───────────────────────────────────────────
    function renderAssegnati() {
        const lista = ordiniSalvati.filter(o => o.stato === 'assegnato');
        renderCardLista('assegnati-lista', lista, true);
    }

    // ── RENDER CONSEGNATI (compatte) ───────────────────────────────
    function renderConsegnati() {
        const lista = ordiniSalvati.filter(o => o.stato === 'consegnato');
        renderCardLista('consegnati-lista', lista, false);
    }

    // ── RENDER GENERICA LISTA CARD ─────────────────────────────────
    function renderCardLista(containerId, lista, mostraAzioni) {
        const container = document.getElementById(containerId);
        if(lista.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">🛵</div><p>Nessun ordine</p></div>';
            return;
        }
        container.innerHTML = lista.map(o => {
            let stato = o.stato || 'attesa';
            let statoClass = stato==='pronto' ? 'stato-pronto' : stato==='assegnato' ? 'stato-assegnato' : stato==='consegnato' ? 'stato-consegnato' : '';
            let badgeClass = stato==='pronto' ? 'badge-pronto' : stato==='assegnato' ? 'badge-assegnato' : stato==='consegnato' ? 'badge-consegnato' : 'badge-attesa';
            let badgeLabel = stato==='pronto' ? '✅ PRONTO' : stato==='assegnato' ? '🛵 ASSEGNATO' : stato==='consegnato' ? '✔ CONSEGNATO' : '⏳ IN ATTESA';
            let riderNome = o.riderId && riders[o.riderId] ? riders[o.riderId].nome : '';
            let payColor = o.pay==='POS' ? 'var(--rosso)' : o.pay==='PAGATO' ? 'var(--ver)' : 'var(--blu)';
            let payLabel = o.pay + (o.pay==='CONTANTI' && o.resto ? ` (${o.resto})` : '');

            let prodHtml = o.prodotti.map(p => {
                let col = p.isGf ? 'var(--ver)' : p.tipo==='1' ? 'var(--rosso)' : p.tipo==='2' ? 'var(--bibite)' : p.tipo==='3' ? '#8B6914' : 'inherit';
                return `<div class="card-prod-row" style="color:${col}">
                    <span class="card-prod-desc">${p.isGf?'[GF] ':''}${p.q} ${p.g}</span>
                    <span class="card-prod-val">${p.v.toFixed(2)}€</span>
                </div>`;
            }).join('');

            let notaHtml = o.nota ? `<div style="font-size:0.8rem; color:var(--ora); margin-top:4px;">📝 ${o.nota}</div>` : '';

            let azioniHtml = '';
            if(mostraAzioni) {
                let btnPronto = stato==='attesa'
                    ? `<button class="btn-pronto" onclick="event.stopPropagation(); segnaPronte('${o._key}')">✅ PRONTO</button>`
                    : stato==='pronto'
                    ? `<button class="btn-pronto attivo" onclick="event.stopPropagation(); segnaPronte('${o._key}', true)">↩ TOGLI</button>`
                    : '';
                let btnAssegna = (stato==='pronto' || stato==='assegnato')
                    ? `<button class="btn-assegna" onclick="event.stopPropagation(); apriAssegnazione('${o._key}')">${stato==='assegnato' ? '🔄 RIASSEGNA' : '🛵 ASSEGNA'}</button>`
                    : `<button class="btn-assegna" disabled>🛵 ASSEGNA</button>`;
                azioniHtml = `<div class="dispatch-actions">${btnPronto}${btnAssegna}</div>`;
            }

            let checkHtml = mostraAzioni && (stato === 'pronto') ? 
                `<div class="card-check ${selezionati.has(o._key) ? 'checked' : ''}" onclick="toggleSelezione('${o._key}', event)">${selezionati.has(o._key) ? '✓' : ''}</div>` : '';

            return `<div class="card-consegna ${statoClass} ${selezionati.has(o._key) ? 'selezionata' : ''}" onclick="toggleEspansa(this)">
                <div class="card-row-top">
                    ${checkHtml}
                    <div class="card-col-left" style="flex:1;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span class="stato-badge ${badgeClass}">${badgeLabel}</span>
                            <span style="font-size:0.72rem; color:#aaa;">${o.num}</span>
                        </div>
                        <span class="card-nome">👤 ${o.cog}</span>
                        <span class="card-ind-small">📍 ${o.ind}</span>
                    </div>
                    <div class="card-col-right">
                        <span class="card-ora-small">🕒 ${o.ora}</span>
                        ${riderNome ? `<span class="card-rider-small">🛵 ${riderNome}</span>` : ''}
                        <div class="card-pay-tot">
                            <span class="card-pay" style="color:${payColor}">${payLabel}</span>
                            <span class="card-tot">${o.tot}</span>
                        </div>
                    </div>
                </div>
                <div class="card-detail">
                    <div style="font-size:0.85rem; margin-bottom:6px;">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.ind)}" class="card-link-ind" target="_blank" onclick="event.stopPropagation()">📍 ${o.ind}</a><br>
                        <a href="tel:${o.tel}" class="card-link-tel" onclick="event.stopPropagation()">📞 ${o.tel}</a>
                        ${notaHtml}
                    </div>
                    <div style="background:#f9f9f9; border-radius:6px; padding:6px;">
                        ${prodHtml}
                        <div class="card-prod-row" style="margin-top:2px; border-top:1px dashed #ddd; padding-top:2px; color:#888;">
                            <span class="card-prod-desc">🛵 CONSEGNA</span>
                            <span class="card-prod-val">${o.costoCons.toFixed(2)}€</span>
                        </div>
                    </div>
                    ${azioniHtml}
                </div>
            </div>`;
        }).join('');
    }

    function toggleEspansa(card) { card.classList.toggle('espansa'); }

    // ── SEGNA PRONTO ───────────────────────────────────────────────
    function segnaPronte(key, annulla = false) {
        ordiniRef.child(key).update({ stato: annulla ? 'attesa' : 'pronto' });
    }

    // ── ASSEGNAZIONE RIDER ─────────────────────────────────────────
    function apriAssegnazione(key) {
        keyDaAssegnare = key;
        const opts = document.getElementById('rider-options');
        opts.innerHTML = Object.entries(riders).map(([id, r]) => {
            let inGiro = isRiderInGiro(id);
            return `<button class="rider-option ${inGiro ? 'non-disponibile' : ''}" onclick="assegnaRider('${id}')">
                <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${inGiro ? 'var(--rosso)' : 'var(--ver)'}; margin-right:8px;"></span>
                ${r.nome} ${inGiro ? '🔴 IN GIRO' : '🟢 DISPONIBILE'}
            </button>`;
        }).join('');
        document.getElementById('rider-overlay').classList.add('show');
    }

    function chiudiRiderOverlay() {
        document.getElementById('rider-overlay').classList.remove('show');
        keyDaAssegnare = null;
    }

    function assegnaRider(riderId) {
        if(!keyDaAssegnare) return;
        ordiniRef.child(keyDaAssegnare).update({ 
            stato: 'assegnato', 
            riderId,
            tsAssegnato: Date.now()
        });
        chiudiRiderOverlay();
    }

    // ── RENDER RIDER ───────────────────────────────────────────────
    function renderRider() {
        const container = document.getElementById('rider-lista');
        if(Object.keys(riders).length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">🛵</div><p>Nessun rider</p></div>';
            return;
        }

        // Salvo quali tendine sono aperte prima del render
        let aperte = new Set();
        container.querySelectorAll('.rider-block-detail.open').forEach(el => {
            if(el.dataset.riderId) aperte.add(el.dataset.riderId);
        });

        container.innerHTML = Object.entries(riders).map(([id, r]) => {
            let miei = ordiniSalvati.filter(o => o.riderId === id && (o.stato === 'assegnato' || o.stato === 'consegnato'));
            let assegnati = miei.filter(o => o.stato === 'assegnato');
            let consegnati = miei.filter(o => o.stato === 'consegnato');
            let totale = miei.length;
            let nCons = consegnati.length;
            let inGiro = assegnati.length > 0;
            let inRientro = r.inRientro && !inGiro;

            let counterClass = totale === 0 ? 'counter-grigio' : nCons === totale ? 'counter-verde' : 'counter-ora';
            let headerClass = inGiro ? 'in-corso' : '';
            let counterLabel = totale === 0 ? '—' : `${nCons}/${totale}`;
            let bollinoClass = inGiro ? 'bollino-rosso' : 'bollino-verde';
            let statoLabel = inGiro ? '🔴 IN GIRO' : inRientro ? '🟡 RIENTRANDO' : '🟢 DISPONIBILE';
            let eraAperta = aperte.has(id) ? 'open' : '';

            // Timer rientro
            let timerHtml = '';
            if(inRientro && r.tsRientro) {
                let elapsed = Math.floor((Date.now() - r.tsRientro) / 1000);
                let remaining = Math.max(0, 300 - elapsed);
                let mm = Math.floor(remaining / 60);
                let ss = remaining % 60;
                timerHtml = `<div style="background:#FFF9C4; border-radius:8px; padding:8px 12px; margin:8px 15px 0; display:flex; align-items:center; justify-content:space-between;">
                    <span style="font-size:0.9rem; color:#8B6914;">⏱ Rientro: ${mm}:${ss.toString().padStart(2,'0')}</span>
                    <button onclick="annullaTimer('${id}')" style="padding:5px 12px; background:var(--ver); color:white; border:none; border-radius:6px; font-family:'Barlow',sans-serif; font-weight:900; font-size:0.8rem; cursor:pointer;">✅ DISPONIBILE</button>
                </div>`;
            }

            let righe = miei.map(o => {
                let isConsegnata = o.stato === 'consegnato';
                return `<div class="rider-cons-row ${isConsegnata ? 'consegnata' : ''}">
                    <span class="rider-cons-ind">📍 ${o.ind}<br><small style="color:#aaa;">👤 ${o.cog} · 🕒 ${o.ora}</small></span>
                    <span class="rider-cons-stato ${isConsegnata ? 'ok' : 'pending'}">${isConsegnata ? '✔ CONS.' : '🛵 IN CORSO'}</span>
                </div>`;
            }).join('');

            if(totale === 0) righe = `<div style="padding:10px 15px; font-size:0.85rem; color:#aaa;">Nessuna consegna assegnata</div>`;

            return `<div class="rider-block">
                <div class="rider-block-header ${headerClass}" onclick="this.nextElementSibling.classList.toggle('open')">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div class="rider-bollino ${bollinoClass}"></div>
                        <span class="rider-nome-big">${r.nome}</span>
                        <span style="font-size:0.7rem; color:#888;">${statoLabel}</span>
                    </div>
                    <span class="rider-counter ${counterClass}">${counterLabel}</span>
                </div>
                <div class="rider-block-detail ${eraAperta}" data-rider-id="${id}">
                    ${timerHtml}
                    ${righe}
                </div>
            </div>`;
        }).join('');

        // Aggiorna timer ogni secondo se ci sono rider in rientro
        let haTimer = Object.values(riders).some(r => r.inRientro);
        if(haTimer) setTimeout(() => { if(document.getElementById('tab3').classList.contains('show')) renderRider(); }, 1000);
    }

    function annullaTimer(riderId) {
        db.ref('riders').child(riderId).update({ inRientro: false, tsRientro: null });
    }

    // ── RENDER ORARI (identico admin) ──────────────────────────────
    function renderOrari() {
        const container = document.getElementById('orari-lista');
        if(ordiniSalvati.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">🕒</div><p>Nessun ordine ancora</p></div>';
            return;
        }
        let fasce = {};
        ordiniSalvati.forEach(o => {
            if(!o.ora) return;
            if(!fasce[o.ora]) fasce[o.ora] = [];
            fasce[o.ora].push(o);
        });
        let orariOrdinati = Object.keys(fasce).sort();
        container.innerHTML = orariOrdinati.map(ora => {
            let ordini = fasce[ora];
            let n = ordini.length;
            let caricoClass = n >= 5 ? 'carico-alto' : `carico-${n}`;
            let badgeClass = n >= 5 ? 'badge-rosso' : n >= 3 ? 'badge-giallo' : 'badge-verde';
            let dettagli = ordini.map(o => {
                let prodTags = o.prodotti.map(p => {
                    let cls = p.isGf ? 'is-gf' : p.tipo==='1' ? 'is-pollo' : p.tipo==='2' ? 'is-bibita' : p.tipo==='3' ? 'is-banco' : '';
                    return `<span class="orario-prod-tag ${cls}">${p.q} ${p.g}</span>`;
                }).join('');
                let rNome = o.riderId && riders[o.riderId] ? ` — 🛵 ${riders[o.riderId].nome}` : '';
                return `<div class="orario-ordine">
                    <div class="orario-ordine-top">
                        <span class="orario-cliente">👤 ${o.cog}${rNome}</span>
                        <span class="orario-num">${o.num}</span>
                    </div>
                    <div class="orario-ind">📍 ${o.ind}</div>
                    <div class="orario-prodotti">${prodTags}</div>
                </div>`;
            }).join('');
            return `<div class="orario-block ${caricoClass}">
                <div class="orario-header" onclick="toggleOrario(this)">
                    <span class="orario-ora">🕒 ${ora}</span>
                    <span class="orario-badge ${badgeClass}">${n} ${n===1?'ordine':'ordini'}</span>
                </div>
                <div class="orario-detail">${dettagli}</div>
            </div>`;
        }).join('');
    }

    function toggleOrario(header) { header.nextElementSibling.classList.toggle('open'); }

    function apriCambioPIN() {
        document.getElementById('pin-nuovo').value = '';
        document.getElementById('pin-conferma').value = '';
        document.getElementById('pin-msg').style.display = 'none';
        document.getElementById('pin-change-overlay').classList.add('show');
    }

    function chiudiCambioPIN() {
        document.getElementById('pin-change-overlay').classList.remove('show');
    }

    // ── CAMBIO PIN ─────────────────────────────────────────────────
    function cambiaPIN() {
        let nuovo = document.getElementById('pin-nuovo').value.trim();
        let conferma = document.getElementById('pin-conferma').value.trim();
        let msg = document.getElementById('pin-msg');
        if(nuovo.length !== 4 || !/^\d{4}$/.test(nuovo)) {
            msg.style.display='block'; msg.style.color='var(--rosso)'; msg.textContent='IL PIN DEVE ESSERE DI 4 CIFRE'; return;
        }
        if(nuovo !== conferma) {
            msg.style.display='block'; msg.style.color='var(--rosso)'; msg.textContent='I PIN NON COINCIDONO'; return;
        }
        dispatchRef.set({ pin: nuovo });
        msg.style.display='block'; msg.style.color='var(--ver)'; msg.textContent='✅ PIN AGGIORNATO!';
        setTimeout(() => chiudiCambioPIN(), 1500);
    }
</script>
