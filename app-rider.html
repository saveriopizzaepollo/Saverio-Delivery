<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVERIO DELIVERY — RIDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blu: #1A3A5C; --ora: #E8600A; --giallo: #FFEF00; --bor: #D0DCE8; --rosso: #FF4444; --ver: #1B8A4A; --link: #007AFF; --bibite: #007AFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; font-weight: 900; }
        body { background: var(--blu); color: white; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }

        /* PAGINE */
        .page { position: fixed; inset: 0; display: none; background: var(--blu); text-align: center; z-index: 100; overflow-y: auto; }
        .page.show { display: block; }
        .page-inner { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }

        /* PIN OVERLAY */
        .pin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; }
        .pin-overlay.show { display: flex; }
        .pin-box { background: var(--blu); border: 3px solid var(--ora); border-radius: 20px; padding: 30px 25px; width: 90%; max-width: 320px; text-align: center; }
        .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 220px; margin: 0 auto; }
        .num-key { width: 100%; aspect-ratio: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: white; cursor: pointer; transition: background 0.15s; }
        .num-key:active { background: rgba(255,255,255,0.25); }
        .dot-row { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .dot { width: 16px; height: 16px; border: 2px solid white; border-radius: 50%; transition: background 0.15s; }

        /* HEADER APP */
        .header-main { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--blu); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 4px solid var(--ora); z-index: 1000; }
        .header-nome { font-size: 1.1rem; color: var(--giallo); }
        .header-title { font-size: 0.8rem; color: white; }
        .btn-logout { background: none; border: 2px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; padding: 6px 12px; font-size: 0.75rem; cursor: pointer; }

        /* NAV */
        .nav-bar { position: fixed; top: 75px; left: 0; right: 0; height: 60px; background: #f4f7f9; display: flex; padding: 5px; gap: 5px; z-index: 999; }
        .nav-btn { flex: 1; border: none; border-radius: 8px; background: #D0DCE8; color: var(--blu); font-size: 0.75rem; cursor: pointer; text-transform: uppercase; font-weight: 900; }
        .nav-btn.active { background: var(--ora); color: white; }

        /* CONTENT */
        .content-area { position: fixed; top: 135px; bottom: 0; left: 0; right: 0; overflow-y: auto; background: #f4f7f9; color: var(--blu); padding: 15px; }
        .tab-content { display: none; }
        .tab-content.show { display: block; }

        /* CARD CONSEGNA */
        .card-consegna { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 10px solid var(--blu); box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: var(--blu); position: relative; }
        .card-consegna.consegnata { border-left-color: var(--ver); opacity: 0.7; }
        .card-header-main { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .card-num-big { font-size: 1.8rem; color: var(--blu); }
        .card-ora-big { font-size: 1.8rem; color: var(--ora); }
        .card-body-main { font-size: 1.3rem; margin-bottom: 10px; line-height: 1.3; }
        .card-link-tel { color: var(--link); text-decoration: none; }
        .card-link-ind { color: var(--ora); text-decoration: none; }
        
        .card-list-wrapper { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .card-list-text { font-size: 1.1rem; color: var(--blu); display: flex; flex-direction: column; gap: 4px; }
        .card-prod-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 2px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-prod-desc { flex-grow: 1; text-transform: uppercase; }
        .card-prod-val { width: 70px; text-align: right; font-weight: 700; flex-shrink: 0; }

        .card-footer-big { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #eee; padding-top: 10px; }
        .pay-label-big { font-size: 1.3rem; font-weight: 900; }
        .tot-label-big { font-size: 1.8rem; color: var(--ora); }

        .btn-consegnato { width: 100%; padding: 16px; background: var(--ver); color: white; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: 900; cursor: pointer; margin-top: 12px; }

        /* PIN SETTINGS */
        .input-big { width: 100%; padding: 12px; border: 2px solid var(--bor); border-radius: 10px; font-size: 1.1rem; margin-bottom: 12px; outline: none; color: var(--blu); text-align: center; letter-spacing: 6px; }
        .btn-main { width: 100%; padding: 15px; background: var(--ora); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 900; }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        #fb-status { position: fixed; bottom: 8px; right: 10px; font-size: 0.65rem; color: rgba(255,255,255,0.4); z-index: 9999; }
    </style>
</head>
<body>

    <!-- LOGIN RIDER -->
    <div id="page-select" class="page show">
        <div class="page-inner">
            <h1 style="font-size:2.8rem; margin-bottom:8px;">SAVERIO DELIVERY</h1>
            <p style="color:rgba(255,255,255,0.4); margin-bottom:40px; letter-spacing:3px;">AREA RIDER</p>
            <div id="rider-list" style="width:100%; max-width:320px;"></div>
        </div>
    </div>

    <!-- PIN OVERLAY -->
    <div id="pin-overlay" class="pin-overlay">
        <div class="pin-box">
            <h2 id="pin-title" style="font-size:1.6rem; margin-bottom:4px;"></h2>
            <p style="color:rgba(255,255,255,0.4); font-size:0.75rem; margin-bottom:20px;">INSERISCI PIN</p>
            <div class="dot-row">
                <div class="dot" id="dot-0"></div>
                <div class="dot" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
                <div class="dot" id="dot-3"></div>
            </div>
            <div class="grid-pin" id="numpad"></div>
            <p id="pin-error" style="color:var(--rosso); margin-top:15px; display:none;">PIN ERRATO</p>
            <button onclick="chiudiPin()" style="margin-top:18px; background:none; border:none; color:white; opacity:0.4;">← ANNULLA</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-rider" style="display:none;">
        <div class="header-main">
            <span class="header-title">SAVERIO DELIVERY</span>
            <span class="header-nome" id="rider-nome-header"></span>
            <button class="btn-logout" onclick="logout()">ESCI</button>
        </div>
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-ta" onclick="showTab('a')">CONSEGNE</button>
            <button class="nav-btn" id="btn-tb" onclick="showTab('b')">STORICO</button>
            <button class="nav-btn" id="btn-tc" onclick="showTab('c')">PIN</button>
        </div>

        <div id="banner-disponibile" style="display:none; position:fixed; top:135px; left:0; right:0; background:var(--ver); padding:12px 20px; z-index:998; align-items:center; justify-content:space-between;">
            <span style="font-size:0.9rem;">⏱ Stai rientrando?</span>
            <button onclick="sonoDisponibile()" style="padding:8px 18px; background:white; color:var(--ver); border:none; border-radius:8px; font-weight:900;">✅ SONO DISPONIBILE</button>
        </div>

        <div class="content-area">
            <div id="taba" class="tab-content show"><div id="lista-assegnate"></div></div>
            <div id="tabb" class="tab-content"><div id="lista-completate"></div></div>
            <div id="tabc" class="tab-content">
                <div style="background:white; border-radius:15px; padding:20px; color:var(--blu);">
                    <h3 style="margin-bottom:20px;">CAMBIA IL TUO PIN</h3>
                    <input type="password" inputmode="numeric" maxlength="4" id="pin-nuovo" class="input-big" placeholder="NUOVO PIN">
                    <input type="password" inputmode="numeric" maxlength="4" id="pin-conferma" class="input-big" placeholder="CONFERMA">
                    <button class="btn-main" onclick="cambiaPIN()">SALVA NUOVO PIN</button>
                    <p id="pin-msg" style="text-align:center; margin-top:10px; display:none;"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="fb-status">⚪ collegando...</div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvQVRAkkyO00yttmQuoZiAohM2P44gY1Y",
            authDomain: "saverio-delivery-29387.firebaseapp.com",
            databaseURL: "https://saverio-delivery-29387-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "saverio-delivery-29387",
            storageBucket: "saverio-delivery-29387.firebasestorage.app",
            messagingSenderId: "1023327240106",
            appId: "1:1023327240106:web:203ace4347a69a038ab5d3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ridersRef = db.ref('riders');
        const ordiniRef = db.ref('ordini');

        let riders = {};
        let riderSelezionato = null;
        let cPin = "";
        let ordiniTutti = [];
        let sessionRiderId = sessionStorage.getItem('riderId');

        // --- INIZIALIZZAZIONE ---
        ridersRef.on('value', (snap) => {
            riders = snap.val() || {};
            renderRiderList();
            if(sessionRiderId && riders[sessionRiderId]) {
                riderSelezionato = { id: sessionRiderId, ...riders[sessionRiderId] };
                document.getElementById('rider-nome-header').textContent = riderSelezionato.nome;
                if(ordiniTutti.length > 0) renderConsegne();
            }
        });

        ordiniRef.on('value', (snap) => {
            ordiniTutti = [];
            snap.forEach(child => {
                let o = child.val(); o._key = child.key;
                ordiniTutti.push(o);
            });
            ordiniTutti.sort((a,b) => a.ora.localeCompare(b.ora));
            if(riderSelezionato) renderConsegne();
        });

        if(sessionRiderId) {
            document.getElementById('page-select').classList.remove('show');
            document.getElementById('app-rider').style.display = 'block';
        }

        db.ref('.info/connected').on('value', snap => {
            document.getElementById('fb-status').textContent = snap.val() ? '🟢 sync' : '🔴 offline';
        });

        // --- LOGICA LOGIN ---
        function renderRiderList() {
            const container = document.getElementById('rider-list');
            container.innerHTML = Object.entries(riders).map(([id, r]) =>
                `<button style="width:100%; padding:16px; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:12px; color:white; font-size:1.2rem; margin-bottom:10px; cursor:pointer;" onclick="selezionaRider('${id}')">${r.nome}</button>`
            ).join('');
        }

        function selezionaRider(id) {
            riderSelezionato = { id, ...riders[id] };
            document.getElementById('pin-title').textContent = riderSelezionato.nome;
            document.getElementById('pin-error').style.display = 'none';
            cPin = ""; resetDots();
            document.getElementById('pin-overlay').classList.add('show');
        }

        const pad = document.getElementById('numpad');
        for(let i=1; i<=9; i++) {
            let b = document.createElement('div'); b.className='num-key'; b.innerText=i;
            b.onclick = () => pressPin(i); pad.appendChild(b);
        }
        let z = document.createElement('div'); z.className='num-key'; z.innerText='0';
        z.style.gridColumnStart='2'; z.onclick = () => pressPin(0); pad.appendChild(z);

        function pressPin(n) {
            if(cPin.length < 4) {
                cPin += n;
                document.getElementById('dot-'+(cPin.length-1)).style.background = 'var(--ora)';
                if(cPin.length === 4) setTimeout(verificaPin, 200);
            }
        }

        function verificaPin() {
            if(cPin === (riders[riderSelezionato.id]?.pin || '0000')) {
                sessionStorage.setItem('riderId', riderSelezionato.id);
                sessionRiderId = riderSelezionato.id;
                document.getElementById('pin-overlay').classList.remove('show');
                document.getElementById('page-select').classList.remove('show');
                document.getElementById('app-rider').style.display = 'block';
                document.getElementById('rider-nome-header').textContent = riderSelezionato.nome;
                renderConsegne();
            } else {
                document.getElementById('pin-error').style.display = 'block';
                cPin = ""; resetDots();
            }
        }

        function resetDots() { for(let i=0; i<4; i++) document.getElementById('dot-'+i).style.background = 'none'; }

        function logout() {
            sessionStorage.removeItem('riderId');
            location.reload();
        }

        // --- NAVIGAZIONE ---
        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab'+t).classList.add('show');
            document.getElementById('btn-t'+t).classList.add('active');
        }

        // --- RENDER ORDINI ---
        function renderConsegne() {
            if(!riderSelezionato) return;
            let mie = ordiniTutti.filter(o => o.riderId === riderSelezionato.id);
            let assegnate = mie.filter(o => o.stato !== 'consegnato');
            let completate = mie.filter(o => o.stato === 'consegnato').reverse();

            renderLista('lista-assegnate', assegnate, false);
            renderLista('lista-completate', completate, true);

            document.getElementById('btn-ta').textContent = assegnate.length > 0 ? `CONSEGNE (${assegnate.length})` : 'CONSEGNE';
            
            let riderData = riders[riderSelezionato.id];
            document.getElementById('banner-disponibile').style.display = (assegnate.length === 0 && riderData?.inRientro) ? 'flex' : 'none';
        }

        function renderLista(containerId, lista, isCompletate) {
            const container = document.getElementById(containerId);
            if(lista.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>${isCompletate ? 'Nessuno storico' : 'Nessuna consegna'}</p></div>`;
                return;
            }
            container.innerHTML = lista.map(o => {
                let p_html = o.prodotti.map(p => `
                    <div class="card-prod-row" style="color:${p.isGf?'var(--ver)':p.tipo==='1'?'var(--rosso)':p.tipo==='2'?'var(--bibite)':'inherit'}">
                        <span class="card-prod-desc">${p.isGf?'[GF] ':''}${p.q} ${p.g}</span>
                        <span class="card-prod-val">${p.v.toFixed(2)}€</span>
                    </div>`).join('');

                return `
                <div class="card-consegna ${isCompletate ? 'consegnata' : ''}">
                    <div class="card-header-main">
                        <span class="card-num-big">#${o.num}</span>
                        <span class="card-ora-big">${o.ora}</span>
                    </div>
                    <div class="card-body-main">
                        <b>${o.cog}</b><br>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.ind)}" class="card-link-ind" target="_blank">📍 ${o.ind}</a><br>
                        <small>📞 <a href="tel:${o.tel}" class="card-link-tel">${o.tel}</a></small>
                        ${o.nota ? `<div style="margin-top:5px; color:var(--ora); font-size:1.1rem;">📝 ${o.nota}</div>` : ''}
                    </div>
                    <div class="card-list-wrapper"><div class="card-list-text">${p_html}</div></div>
                    <div class="card-footer-big">
                        <span class="pay-label-big" style="color:${o.pay==='POS'?'var(--rosso)':o.pay==='PAGATO'?'var(--ver)':'var(--blu)'}">
                            ${o.pay}${o.pay==='CONTANTI'&&o.resto?' (R:'+o.resto+')':''}
                        </span>
                        <b class="tot-label-big">${o.tot}</b>
                    </div>
                    ${!isCompletate ? `<button class="btn-consegnato" onclick="segnaConsegnato('${o._key}')">✅ CONSEGNATO</button>` : ''}
                </div>`;
            }).join('');
        }

        // --- AZIONI ---
        function segnaConsegnato(key) {
            if(!confirm("Consegna completata?")) return;
            ordiniRef.child(key).update({ stato: 'consegnato', tsConsegnato: firebase.database.ServerValue.TIMESTAMP })
            .then(() => {
                let ancoraDaFare = ordiniTutti.filter(o => o.riderId === riderSelezionato.id && o.stato !== 'consegnato' && o._key !== key);
                if(ancoraDaFare.length === 0) {
                    ridersRef.child(riderSelezionato.id).update({ inRientro: true, tsRientro: firebase.database.ServerValue.TIMESTAMP });
                }
            });
        }

        function sonoDisponibile() {
            ridersRef.child(riderSelezionato.id).update({ inRientro: false, tsRientro: null });
        }

        function cambiaPIN() {
            let n = document.getElementById('pin-nuovo').value;
            let c = document.getElementById('pin-conferma').value;
            let m = document.getElementById('pin-msg');
            if(!/^\d{4}$/.test(n) || n !== c) {
                m.textContent = "ERRORE PIN"; m.style.color = "var(--rosso)"; m.style.display = "block"; return;
            }
            ridersRef.child(riderSelezionato.id).update({ pin: n }).then(() => {
                m.textContent = "✅ AGGIORNATO"; m.style.color = "var(--ver)"; m.style.display = "block";
                document.getElementById('pin-nuovo').value = ""; document.getElementById('pin-conferma').value = "";
                setTimeout(() => m.style.display = "none", 2000);
            });
        }

        function chiudiPin() { document.getElementById('pin-overlay').classList.remove('show'); }
    </script>
</body>
</html>
